dding:9px 14px;border-bottom:1px solid var(--border);gap:12px}.confirm-row:last-child{border-bottom:none}.confirm-key{font-size:11px;color:var(--muted);font-family:var(--mono);width:42%;flex-shrink:0;padding-top:1px}.confirm-val{font-size:13px;font-weight:500;flex:1;word-break:break-word}.success-wrap{text-align:center;padding:56px 20px}.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px}.success-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--accent)}.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}.success-ref{font-family:var(--mono);font-size:16px;color:var(--accent2);font-weight:600;margin:12px 0 24px}.success-actions{display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto}.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,17,23,.85);align-items:center;justify-content:center;flex-direction:column;gap:16px}.loading-overlay.show{display:flex}.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:13px;color:var(--muted);font-family:var(--mono)}

<body>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Submitting…</div></div>
<div class="header"><div class="header-left"><div class="back-btn" onclick="goPortal()"><span class="back-arrow">←</span><span class="back-label" id="h-back">Portal</span></div><div><div class="header-title" id="h-title">Maintenance Visit Record</div><div class="header-sub" id="h-sub">SERVICE / REPAIR LOG</div></div></div><div class="lang-toggle"><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('zh')">中文</button></div></div>

  <div class="screen active" id="screen-start"></div>
  <div class="screen" id="screen-arrival">
    <div class="form-header"><div class="form-title" id="arrival-title"></div><div class="form-sub" id="arrival-sub"></div></div>
    <div class="section"><div class="section-header"><span class="section-icon">🛠️</span><span class="section-title" id="arrival-section-title"></span></div><div class="section-body">
      <div class="field full"><label id="l-recordcreated"></label><input type="text" id="f-recordcreated" readonly></div>
      <div class="field"><label id="l-company"></label><input type="text" id="f-company"></div>
      <div class="field"><label id="l-contact"></label><input type="text" id="f-contact"></div>
      <div class="field"><label id="l-phone"></label><input type="tel" inputmode="tel" id="f-phone"></div>
      <div class="field"><label id="l-email"></label><input type="email" id="f-email"></div>
      <div class="field"><label id="l-arrival"></label><input type="time" id="f-arrival"></div>

      <div class="field" id="other-equipment-wrap" style="display:none"><label id="l-other-equipment"></label><input type="text" id="f-other-equipment"></div>
      <div class="field full"><label id="l-initial"></label><textarea id="f-initial"></textarea></div>
      <div class="field full"><label id="l-sitecontact-arrival"></label><input type="text" id="f-sitecontact-arrival"></div>
    </div></div>
    <div class="alert" id="alert-arrival"></div><div class="btn-wrap"><button class="btn btn-primary" id="arrival-submit" onclick="submitArrival()"></button></div>
  </div>
  <div class="screen" id="screen-reminder">
    <div class="success-wrap"><div class="success-icon">!</div><div class="success-title" id="reminder-title" style="color:var(--warn)"></div><div class="success-sub" id="reminder-msg"></div><div class="success-ref" id="reminder-ref"></div><div class="success-actions"><button class="btn btn-warn" id="reminder-complete" onclick="showCompleteFromOpen()"></button><button class="btn btn-secondary" id="reminder-home" onclick="goPortal()"></button></div></div>
  </div>
  <div class="screen" id="screen-complete">
    <div class="form-header"><div class="form-title" id="complete-title"></div><div class="form-sub" id="complete-sub"></div></div>
    <div id="open-job-card"></div>
    <div class="section"><div class="section-header"><span class="section-icon">✅</span><span class="section-title" id="complete-section-title"></span></div><div class="section-body">
      <div class="field"><label id="l-departure"></label><input type="time" id="f-departure"></div>
      <div class="field"><label id="l-fixed"></label><select id="f-fixed" onchange="toggleFollowupReason()"><option value="">—</option><option value="Yes">Yes</option><option value="Partially">Partially</option><option value="No">No</option><option value="Routine Service">Routine Service</option></select></div>
      <div class="field"><label id="l-followup"></label><select id="f-followup" onchange="toggleFollowupReason()"><option value="">—</option><option value="No">No</option><option value="Yes">Yes</option></select></div>
      <div class="field full"><label id="l-work"></label><textarea id="f-work"></textarea></div>
      <div class="field full" id="followup-reason-wrap" style="display:none"><label id="l-followupreason"></label><textarea id="f-followupreason"></textarea></div>
      <div class="field full"><label id="l-sitecontact-complete"></label><input type="text" id="f-sitecontact-complete"></div>
      <div class="field full"><label id="l-notes"></label><textarea id="f-notes"></textarea></div>
    </div></div>
    <div class="alert" id="alert-complete"></div><div class="btn-wrap"><button class="btn btn-primary" id="complete-review" onclick="goReview()"></button></div>
  </div>
  <div class="screen" id="screen-confirm"><div class="confirm-header"><div class="confirm-title" id="cf-title"></div><div class="confirm-sub" id="cf-sub"></div></div><div class="confirm-section"><div class="confirm-section-title" id="cf-basic-title"></div><div id="confirm-body"></div></div><div class="btn-wrap"><button class="btn btn-secondary" id="cf-edit-btn" onclick="showScreen('complete')"></button><button class="btn btn-primary" id="cf-submit-btn" onclick="submitComplete()"></button></div><p class="note" id="cf-note"></p></div>
  <div class="screen" id="screen-success"><div class="success-wrap"><div class="success-icon">✓</div><div class="success-title" id="succ-title"></div><div class="success-sub" id="succ-msg"></div><div class="success-ref" id="succ-ref"></div><div class="success-actions"><button class="btn btn-secondary" id="succ-new" onclick="clearAndNew()"></button><button class="btn btn-secondary" id="succ-home" onclick="goPortal()"></button></div></div></div>
</div>
<script>
let station=localStorage.getItem('ap_station')||'';let lang=localStorage.getItem('ap_lang')||'en';const openedAt=new Date();
const SHEET_URL='';
function openKey(){return 'ap_open_maintenance_'+station;}
function getOpenJob(){try{return JSON.parse(localStorage.getItem(openKey())||'null')}catch(e){return null}}
function saveOpenJob(j){localStorage.setItem(openKey(),JSON.stringify(j));}
function clearOpenJob(){localStorage.removeItem(openKey());}
const S={en:{pageTitle:'Maintenance Visit Record — Aries Petroleum',hBack:'Portal',hTitle:'Maintenance Visit Record',hSub:'SERVICE / REPAIR LOG',nsMsg:'No station selected. Please return to the portal first.',nsLink:'← Go to Portal',badge:'MAINTENANCE',arrivalTitle:'Arrival Registration',arrivalSub:'Contractor/service provider records arrival details first.',arrivalSection:'Arrival Details',recordCreated:'Record Created',company:'Company Name *',contact:'Contact Person *',phone:'Phone Number *',email:'Email',arrival:'Arrival Time *',equipment:'Equipment / Area *',otherEquipment:'Specific Equipment *',initial:'Initial Issue / Service Description *',siteContactArrival:'Site Staff / Person Assisted',arrivalSubmit:'Submit Arrival Record',reminderTitle:'Maintenance In Progress',reminderMsg:'Before leaving the site, please return and complete the final maintenance record. Staff can also complete it later if required.',reminderComplete:'Complete Final Record',reminderHome:'← Back to Portal',completeTitle:'Complete Maintenance Record',completeSub:'Complete departure time, work completed and follow-up details.',completeSection:'Final Details',departure:'Departure Time *',fixed:'Issue Fixed? *',followup:'Follow Up Required? *',work:'Work Completed *',followupReason:'Follow Up / Unfinished Reason *',siteContactComplete:'Completed By / Site Staff',notes:'Notes',completeReview:'Review & Submit →',cfTitle:'Review & Submit',cfSub:'Check maintenance details before submitting.',cfBasicTitle:'Maintenance Visit Details',cfEdit:'← Edit',cfSubmit:'Submit Completed Record',cfNote:'Data will be saved to Google Sheets.',succTitle:'Record Completed',succMsg:'Maintenance visit record has been completed.',succNew:'New Maintenance Record',succHome:'← Back to Portal',submitting:'Submitting…',errCompany:'Please enter company name.',errContact:'Please enter contact person.',errPhone:'Please enter phone number.',errArrival:'Please enter arrival time.',errEquipment:'Please select equipment / area.',errOtherEquipment:'Please enter specific equipment.',errInitial:'Please enter initial description.',errDeparture:'Please enter departure time.',errFixed:'Please select whether issue was fixed.',errFollowup:'Please select whether follow up is required.',errWork:'Please describe work completed.',errFollowupReason:'Please enter follow-up / unfinished reason.',statusInProgress:'IN PROGRESS',fieldStation:'Station',fieldStatus:'Status',fieldRef:'Reference No.',fieldCompany:'Company',fieldContact:'Contact',fieldPhone:'Phone',fieldEmail:'Email',fieldArrival:'Arrival Time',fieldDeparture:'Departure Time',fieldEquipment:'Equipment / Area',fieldInitial:'Initial Description',fieldWork:'Work Completed',fieldFixed:'Issue Fixed',fieldFollowup:'Follow Up Required',fieldFollowupReason:'Follow Up Reason',fieldSiteContact:'Site Contact',fieldNotes:'Notes',na:'—'},zh:{pageTitle:'维修到场登记 — Aries Petroleum',hBack:'首页',hTitle:'维修到场登记',hSub:'维修 / 保养记录',nsMsg:'未选择站点，请先返回首页选择站点。',nsLink:'← 返回首页',badge:'维修',arrivalTitle:'到场登记',arrivalSub:'维修人员或服务人员先登记到场信息。',arrivalSection:'到场信息',recordCreated:'记录创建时间',company:'公司名称 *',contact:'联系人 *',phone:'电话号码 *',email:'邮箱',arrival:'到场时间 *',equipment:'维修设备 / 区域 *',otherEquipment:'具体设备 *',initial:'初步问题 / 服务说明 *',siteContactArrival:'现场协助人员',arrivalSubmit:'提交到场记录',reminderTitle:'维修仍在进行中',reminderMsg:'离开站点前，请返回并完成最终维修登记。如维修人员忘记，员工也可以稍后补充完成。',reminderComplete:'完成最终登记',reminderHome:'← 返回首页',completeTitle:'完成维修记录',completeSub:'请补充离开时间、完成内容和后续跟进信息。',completeSection:'最终信息',departure:'离开时间 *',fixed:'是否已修好？*',followup:'是否需要跟进？*',work:'完成内容 *',followupReason:'跟进 / 未完成原因 *',siteContactComplete:'完成人 / 现场员工',notes:'备注',completeReview:'核对并提交 →',cfTitle:'确认提交',cfSub:'提交前请核对维修记录。',cfBasicTitle:'维修到场信息',cfEdit:'← 返回修改',cfSubmit:'确认提交完成记录',cfNote:'数据将保存至 Google Sheets。',succTitle:'记录已完成',succMsg:'维修到场记录已完成。',succNew:'新建维修记录',succHome:'← 返回首页',submitting:'提交中…',errCompany:'请填写公司名称。',errContact:'请填写联系人。',errPhone:'请填写电话号码。',errArrival:'请填写到场时间。',errEquipment:'请选择维修设备 / 区域。',errOtherEquipment:'请填写具体设备。',errInitial:'请填写初步说明。',errDeparture:'请填写离开时间。',errFixed:'请选择是否已修好。',errFollowup:'请选择是否需要跟进。',errWork:'请填写完成内容。',errFollowupReason:'请填写跟进 / 未完成原因。',statusInProgress:'进行中',fieldStation:'站点',fieldStatus:'状态',fieldRef:'参考编号',fieldCompany:'公司',fieldContact:'联系人',fieldPhone:'电话',fieldEmail:'邮箱',fieldArrival:'到场时间',fieldDeparture:'离开时间',fieldEquipment:'维修设备 / 区域',fieldInitial:'初步说明',fieldWork:'完成内容',fieldFixed:'是否修好',fieldFollowup:'是否需要跟进',fieldFollowupReason:'跟进原因',fieldSiteContact:'现场人员',fieldNotes:'备注',na:'—'}};
function t(){return S[lang]}function setText(id,v){const el=document.getElementById(id);if(el&&v!==undefined)el.textContent=v}
function setLang(l){lang=l;localStorage.setItem('ap_lang',l);document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文')));applyLang()}
function applyLang(){const L=t();document.title=L.pageTitle;['h-back','h-title','h-sub','ns-msg','ns-link','badge'].forEach((id,i)=>setText(id,[L.hBack,L.hTitle,L.hSub,L.nsMsg,L.nsLink,L.badge][i]));setText('arrival-title',L.arrivalTitle);setText('arrival-sub',L.arrivalSub);setText('arrival-section-title',L.arrivalSection);setText('l-recordcreated',L.recordCreated);setText('l-company',L.company);setText('l-contact',L.contact);setText('l-phone',L.phone);setText('l-email',L.email);setText('l-arrival',L.arrival);setText('l-equipment',L.equipment);setText('l-other-equipment',L.otherEquipment);setText('l-initial',L.initial);setText('l-sitecontact-arrival',L.siteContactArrival);setText('arrival-submit',L.arrivalSubmit);setText('reminder-title',L.reminderTitle);setText('reminder-msg',L.reminderMsg);setText('reminder-complete',L.reminderComplete);setText('reminder-home',L.reminderHome);setText('complete-title',L.completeTitle);setText('complete-sub',L.completeSub);setText('complete-section-title',L.completeSection);setText('l-departure',L.departure);setText('l-fixed',L.fixed);setText('l-followup',L.followup);setText('l-work',L.work);setText('l-followupreason',L.followupReason);setText('l-sitecontact-complete',L.siteContactComplete);setText('l-notes',L.notes);setText('complete-review',L.completeReview);setText('cf-title',L.cfTitle);setText('cf-sub',L.cfSub);setText('cf-basic-title',L.cfBasicTitle);setText('cf-edit-btn',L.cfEdit);setText('cf-submit-btn',L.cfSubmit);setText('cf-note',L.cfNote);setText('succ-title',L.succTitle);setText('succ-msg',L.succMsg);setText('succ-new',L.succNew);setText('succ-home',L.succHome);if(station)document.getElementById('station-display').innerHTML=`<span>${station}</span>`;document.getElementById('f-recordcreated').value=formatDateTime(openedAt);renderStart()}
function fmtTime(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function formatDateTime(d){return d.toLocaleDateString(lang==='en'?'en-AU':'zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' '+d.toLocaleTimeString(lang==='en'?'en-AU':'zh-CN',{hour:'2-digit',minute:'2-digit'})}
function val(id){return document.getElementById(id).value.trim()}function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0)}
function renderStart(){if(!station)return;const job=getOpenJob();const L=t();if(job){document.getElementById('screen-start').innerHTML=`<div class="form-header"><div class="form-title">${L.reminderTitle}</div><div class="form-sub">${L.reminderMsg}</div></div>${openJobHtml(job)}<div class="btn-wrap"><button class="btn btn-warn" onclick="showCompleteFromOpen()">${L.reminderComplete}</button><button class="btn btn-secondary" onclick="clearAndNew()">${L.succNew}</button></div>`;showScreen('start')}else{showScreen('arrival')}}
function openJobHtml(job){const L=t();return `<div class="open-card"><div class="open-title">⚠ ${L.reminderTitle}</div><div class="open-sub">${esc(job.companyName)} — ${esc(job.equipmentDisplay)}</div><div class="open-row"><div class="open-key">${L.fieldRef}</div><div class="open-val">${esc(job.referenceNo)}</div></div><div class="open-row"><div class="open-key">${L.fieldContact}</div><div class="open-val">${esc(job.contactPerson)}</div></div><div class="open-row"><div class="open-key">${L.fieldArrival}</div><div class="open-val">${esc(job.arrivalTime)}</div></div></div>`}
function toggleOtherEquipment(){document.getElementById('other-equipment-wrap').style.display=val('f-equipment')==='Other'?'block':'none'}function toggleFollowupReason(){const show=val('f-fixed')==='No'||val('f-fixed')==='Partially'||val('f-followup')==='Yes';document.getElementById('followup-reason-wrap').style.display=show?'block':'none'}
function submitArrival(){const L=t();hideAlert('alert-arrival');if(!val('f-company'))return showAlert('alert-arrival',L.errCompany);if(!val('f-contact'))return showAlert('alert-arrival',L.errContact);if(!val('f-phone'))return showAlert('alert-arrival',L.errPhone);if(!val('f-arrival'))return showAlert('alert-arrival',L.errArrival);if(!val('f-equipment'))return showAlert('alert-arrival',L.errEquipment);if(val('f-equipment')==='Other'&&!val('f-other-equipment'))return showAlert('alert-arrival',L.errOtherEquipment);if(!val('f-initial'))return showAlert('alert-arrival',L.errInitial);const ref='MT-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*9000+1000);const equipmentDisplay=val('f-equipment')==='Other'?val('f-other-equipment'):val('f-equipment');const job={formType:'maintenanceArrival',status:'IN_PROGRESS',referenceNo:ref,submittedAt:new Date().toISOString(),openedAt:openedAt.toISOString(),station,lang,companyName:val('f-company'),contactPerson:val('f-contact'),phone:val('f-phone'),email:val('f-email'),arrivalTime:val('f-arrival'),equipment:val('f-equipment'),specificEquipment:val('f-other-equipment'),equipmentDisplay,initialDescription:val('f-initial'),siteContactArrival:val('f-sitecontact-arrival')};saveOpenJob(job);console.log(job);document.getElementById('reminder-ref').textContent='Ref: '+ref;showScreen('reminder')}
function showCompleteFromOpen(){const job=getOpenJob();if(!job){renderStart();return}document.getElementById('open-job-card').innerHTML=openJobHtml(job);document.getElementById('f-departure').value=fmtTime(new Date());showScreen('complete')}
function goReview(){const L=t();hideAlert('alert-complete');if(!val('f-departure'))return showAlert('alert-complete',L.errDeparture);if(!val('f-fixed'))return showAlert('alert-complete',L.errFixed);if(!val('f-followup'))return showAlert('alert-complete',L.errFollowup);if(!val('f-work'))return showAlert('alert-complete',L.errWork);const need=val('f-fixed')==='No'||val('f-fixed')==='Partially'||val('f-followup')==='Yes';if(need&&!val('f-followupreason'))return showAlert('alert-complete',L.errFollowupReason);buildConfirm();showScreen('confirm')}
function buildConfirm(){const L=t(),job=getOpenJob();const rows=[[L.fieldStation,station],[L.fieldStatus,'COMPLETED'],[L.fieldRef,job.referenceNo],[L.fieldCompany,job.companyName],[L.fieldContact,job.contactPerson],[L.fieldPhone,job.phone],[L.fieldEmail,job.email||L.na],[L.fieldArrival,job.arrivalTime],[L.fieldDeparture,val('f-departure')],[L.fieldEquipment,job.equipmentDisplay],[L.fieldInitial,job.initialDescription],[L.fieldWork,val('f-work')],[L.fieldFixed,val('f-fixed')],[L.fieldFollowup,val('f-followup')],[L.fieldFollowupReason,val('f-followupreason')||L.na],[L.fieldSiteContact,val('f-sitecontact-complete')||job.siteContactArrival||L.na],[L.fieldNotes,val('f-notes')||L.na]];document.getElementById('confirm-body').innerHTML=rows.map(([k,v])=>`<div class="confirm-row"><div class="confirm-key">${esc(k)}</div><div class="confirm-val">${esc(v)}</div></div>`).join('')}
function submitComplete(){const L=t(),job=getOpenJob();const payload={...job,formType:'maintenanceRecord',status:'COMPLETED',completedAt:new Date().toISOString(),departureTime:val('f-departure'),workCompleted:val('f-work'),issueFixed:val('f-fixed'),followUpRequired:val('f-followup'),followUpReason:val('f-followupreason'),siteContactComplete:val('f-sitecontact-complete'),notes:val('f-notes')};document.getElementById('loading-text').textContent=L.submitting;document.getElementById('loadingOverlay').classList.add('show');if(!SHEET_URL){console.log(payload);setTimeout(()=>onSuccess(job.referenceNo),500);return}fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(()=>onSuccess(job.referenceNo)).catch(()=>onSuccess(job.referenceNo))}
function onSuccess(ref){document.getElementById('loadingOverlay').classList.remove('show');clearOpenJob();localStorage.removeItem(openKey());document.getElementById('succ-ref').textContent='Ref: '+ref;showScreen('success')}
function clearAndNew(){clearOpenJob();location.reload()}function showAlert(id,msg){const a=document.getElementById(id);Object.assign(a.style,{background:'var(--warn-bg)',borderColor:'var(--warn-border)',color:'var(--warn)'});a.textContent=msg;a.classList.add('show');a.scrollIntoView({behavior:'smooth',block:'center'})}function hideAlert(id){const el=document.getElementById(id);if(el)el.classList.remove('show')}function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function goPortal(){window.location.href='index.html'}
if(!station){document.getElementById('no-station-bar').classList.add('show');document.getElementById('station-bar').style.display='none';document.getElementById('screen-start').style.display='none'}
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文')));document.getElementById('f-arrival').value=fmtTime(openedAt);applyLang();
</script>
</body>
</html>
