<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maintenance Visit Record — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sinopec-red:#E60012;--sinopec-red-dark:#B8000E;
  --bp-green:#00A651;--bp-green-dark:#007A3D;
  --liberty-blue:#003DA5;--liberty-blue-dark:#002A73;
  --liberty-red:#CE1126;
  --bg:#F4F6F8;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#EEF2F6;
  --border:#DDE3EA;--border2:#C9D2DD;
  --accent:var(--bp-green);--accent2:var(--liberty-blue);
  --warn:#E60012;--danger:#B8000E;
  --text:#142033;--muted:#667085;--label:#344054;
  --mono:'DM Mono',monospace;--sans:'Sora',sans-serif;
  --ok-bg:#ECFDF3;--ok-border:#B7E4C7;
  --warn-bg:#FFF1F2;--warn-border:#FDA4AF;
  --blue-bg:#EFF6FF;--blue-border:#BFDBFE;
  --radius:16px;--radius-sm:10px;
  --shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);color:#fff;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.86);font-size:13px;cursor:pointer;padding:6px 10px 6px 0;border-right:1px solid rgba(255,255,255,.24);margin-right:2px;white-space:nowrap}
.back-btn:hover{color:#fff}
.back-arrow{font-size:15px}
.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em;font-weight:600}
.header-title{font-size:14px;font-weight:800;color:#fff}
.header-sub{font-size:10px;color:rgba(255,255,255,.82);font-family:var(--mono);margin-top:1px;letter-spacing:.07em;text-transform:uppercase}
.lang-toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.lang-btn{padding:6px 10px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:none;background:transparent}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.no-station{display:none;background:var(--warn-bg);border-bottom:1px solid var(--warn-border);padding:12px 16px;text-align:center}
.no-station.show{display:block}
.no-station-msg{font-size:13px;color:var(--sinopec-red-dark);margin-bottom:8px;font-weight:600}
.no-station-link{display:inline-block;background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;font-size:12px;font-weight:800;padding:8px 16px;border-radius:9px;text-decoration:none}
.station-bar{background:#fff;border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.station-dot{width:7px;height:7px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 0 4px rgba(0,166,81,.12);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;color:var(--muted)}
.station-name span{color:var(--text);font-weight:700}
.badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--blue-bg);color:var(--liberty-blue);border:1px solid var(--blue-border)}
.container{max-width:560px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.form-header{margin-bottom:18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.form-title{font-size:19px;font-weight:800;margin-bottom:4px;color:var(--text)}
.form-sub{font-size:13px;color:var(--muted);line-height:1.55}
.section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.section-header{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.section-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;font-family:var(--mono);font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}
.field input[readonly]{background:var(--surface2);color:var(--muted)}
.field select option{background:#fff;color:var(--text)}
.field textarea{resize:vertical;min-height:82px;line-height:1.5}
.open-card{background:var(--warn-bg);border:1px solid var(--warn-border);border-left:4px solid var(--sinopec-red);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.open-card.remote{border-left-color:var(--liberty-blue);background:var(--blue-bg);border-color:var(--blue-border)}
.open-title{font-size:15px;font-weight:800;color:var(--sinopec-red-dark);margin-bottom:8px}
.open-card.remote .open-title{color:var(--liberty-blue)}
.open-sub{font-size:12px;color:var(--label);line-height:1.6;margin-bottom:10px}
.open-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(230,0,18,.13);padding-top:8px;margin-top:8px}
.open-card.remote .open-row{border-top-color:rgba(0,61,165,.13)}
.open-key{font-size:11px;color:var(--muted);font-family:var(--mono)}
.open-val{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.alert{display:none;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px;line-height:1.5}
.alert.show{display:block}
.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:800;padding:14px;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--liberty-blue),var(--liberty-blue-dark));color:#fff;box-shadow:0 4px 14px rgba(0,61,165,.22)}
.btn-warn{background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;box-shadow:0 4px 14px rgba(230,0,18,.22)}
.btn-secondary{background:#fff;color:var(--label);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.confirm-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.confirm-section-title{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:10px 14px;border-bottom:1px solid var(--border);gap:12px}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:11px;color:var(--muted);font-family:var(--mono);width:42%;flex-shrink:0;font-weight:700}
.confirm-val{font-size:13px;font-weight:600;flex:1;word-break:break-word;color:var(--text)}
.success-wrap{text-align:center;padding:56px 20px}
.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px;color:var(--bp-green-dark);font-weight:800}
.success-title{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--bp-green-dark)}
.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}
.success-ref{font-family:var(--mono);font-size:16px;color:var(--liberty-blue);font-weight:800;margin:12px 0 24px}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.42);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(0,61,165,.18);border-top-color:var(--liberty-blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--label);font-family:var(--mono);background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow-sm)}
.fetch-status{font-size:11px;color:var(--muted);font-family:var(--mono);text-align:center;padding:8px;margin-bottom:10px}
@media(max-width:520px){
  .section-body{grid-template-columns:1fr}
  .header{padding:13px 14px}
  .container{padding:18px 12px}
}
</style>
</head>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 11;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'
   + '#ap-ui.show{display:flex}#ap-box{background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit}'
   + '#ap-title{font-weight:800;font-size:17px;margin-bottom:8px}#ap-msg{font-size:14px;line-height:1.6;white-space:pre-line}'
   + '#ap-detail{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-word}'
   + '#ap-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}'
   + '#ap-btns button{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}'
   + '.ap-primary{background:#E60012;color:#fff}.ap-ghost{background:#eef0f3;color:#333}'
   + '.ap-spin{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#E60012;border-radius:50%;animation:apspin .7s linear infinite;vertical-align:middle;margin-right:8px}'
   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}

function openKey(){ return 'ap_open_maintenance_' + station; }
function getLocalJobs(){
  try{

    if(Array.isArray(data)) return data;
    return data ? [data] : [];
  }catch(e){ return []; }
}
function addOpenJob(j){
  const jobs = getLocalJobs();
  jobs.push(j);
  localStorage.setItem(openKey(), JSON.stringify(jobs));

async function fetchRemoteOpenJobs(){
  if(!station || !SHEET_URL) return [];
  try{
    const url = `${SHEET_URL}?action=getOpenMaintenance&station=${encodeURIComponent(station)}&pin=8888`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    if(data.success && Array.isArray(data.jobs)){
      return data.jobs.map(j => ({
        formType: 'maintenanceArrival',
        status: 'IN_PROGRESS',
        referenceNo: j.ReferenceNo || j.referenceNo || '',
        submittedAt: j.SubmittedAt || j.submittedAt || '',
        station: j.Station || j.station || station,
        companyName: j.CompanyName || j.companyName || '',
        contactPerson: j.ContactPerson || j.contactPerson || '',
        phone: j.Phone || j.phone || '',
        email: j.Email || j.email || '',
        arrivalTime: j.ArrivalTime || j.arrivalTime || '',
        equipment: j.Equipment || j.equipment || '',
        specificEquipment: j.SpecificEquipment || j.specificEquipment || '',
        equipmentDisplay: j.EquipmentDisplay || j.equipmentDisplay || j.Equipment || j.equipment || '',
        initialDescription: j.InitialDescription || j.initialDescription || '',
        siteContactArrival: j.SiteContactArrival || j.siteContactArrival || '',
        _fromRemote: true
      }));
    }
  }catch(e){}
  return [];
}

// Merge local + remote, deduplicate by referenceNo
function mergeJobs(local, remote){
  const seen = new Set(local.map(j => j.referenceNo));
  const merged = [...local];
  for(const r of remote){
    if(r.referenceNo && !seen.has(r.referenceNo)){
      merged.push(r);
      seen.add(r.referenceNo);
    }
  }
  return merged;
}

function fmtTime(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

// ── INIT: fetch remote + local then render ──
async function initStart(){
  if(!station) return;
  const L = t();
  // Show loading indicator in start screen
  document.getElementById('screen-start').innerHTML = `<div class="fetch-status">${L.fetchingJobs}</div>`;
  showScreen('start');

  const local = getLocalJobs();
  const remote = await fetchRemoteOpenJobs();
  const allJobs = mergeJobs(local, remote);

  renderStart(allJobs);
}

function renderStart(jobs){
  if(!station) return;
  const L = t();
  if(jobs && jobs.length){
    const cards = jobs.map(job => `
      ${openJobHtml(job)}
      <div class="btn-wrap" style="margin-bottom:14px">
        <button class="btn btn-warn" onclick="showCompleteFromOpen('${escapeAttr(job.referenceNo)}')">${L.reminderComplete}</button>
      </div>`).join('');
    document.getElementById('screen-start').innerHTML = `
      <div class="form-header"><div class="form-title">${L.reminderTitle}</div><div class="form-sub">${L.reminderMsg}</div></div>
      ${cards}
      <button class="btn btn-secondary" onclick="showScreen('arrival')">${L.succNew}</button>`;
    showScreen('start');
  } else {
    showScreen('arrival');
  }
}

function openJobHtml(job){
  const L = t();
  const isRemote = job._fromRemote;
  const cardClass = isRemote ? 'open-card remote' : 'open-card';
  const titleLabel = isRemote ? L.remoteJobLabel : L.localJobLabel;
  return `<div class="${cardClass}">
    <div class="open-title">${titleLabel}</div>
    <div class="open-sub">${escapeHtml(job.companyName||'—')} — ${escapeHtml(job.equipmentDisplay||'—')}</div>
    <div class="open-row"><div class="open-key">${L.fieldRef}</div><div class="open-val">${escapeHtml(job.referenceNo||'—')}</div></div>
    <div class="open-row"><div class="open-key">${L.fieldContact}</div><div class="open-val">${escapeHtml(job.contactPerson||'—')}</div></div>

  </div>`;
}

function submitArrival(){

  if(!val('f-contact')) return showAlert('alert-arrival',L.errContact);

  if(!val('f-arrival')) return showAlert('alert-arrival',L.errArrival);

  // The job is only kept as "open" and the reminder shown once the Sheet confirms it.
  // A retry of the same entries reuses the same reference number.
  apRun({ key:'maintenanceArrival', url:SHEET_URL, button:'arrival-submit',
    makeExtra:()=>({ ref:'MT-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*9000+1000) }),
    buildPayload:(x)=>({
      formType:'maintenanceArrival',status:'IN_PROGRESS',referenceNo:x?x.ref:undefined,

      station,lang,

      phone:val('f-phone'),email:val('f-email'),arrivalTime:val('f-arrival'),
      equipment:val('f-equipment'),specificEquipment:val('f-other-equipment'),

// currentJob holds the job being completed (works for both local and remote)
let currentJob = null;

function showCompleteFromOpen(ref){
  // First check local
  let job = getLocalJobs().find(j => j.referenceNo === ref);

  // If not local, check if it was a remote job stored in the start screen data
  if(!job){
    // Re-fetch from DOM isn't reliable — store remote jobs in memory
    job = _remoteJobsCache.find(j => j.referenceNo === ref);
  }

  // Fallback: use last local job
  if(!job){
    const local = getLocalJobs();
    if(local.length){ job = local[local.length-1]; ref = job.referenceNo; }
  }

  if(!job){ initStart(); return; }

  currentJob = job;
  document.getElementById('open-job-card').innerHTML = openJobHtml(job);
  document.getElementById('open-job-card').dataset.ref = ref;
  document.getElementById('f-departure').value = fmtTime(new Date());
  showScreen('complete');
}

// Cache remote jobs in memory so showCompleteFromOpen can find them
let _remoteJobsCache = [];

// Override initStart to cache remote jobs
const _origInitStart = initStart;
async function initStart(){
  if(!station) return;
  const L = t();
  document.getElementById('screen-start').innerHTML = `<div class="fetch-status">${L.fetchingJobs}</div>`;
  showScreen('start');

  const local = getLocalJobs();
  const remote = await fetchRemoteOpenJobs();
  _remoteJobsCache = remote;
  const allJobs = mergeJobs(local, remote);
  renderStart(allJobs);
}

  if(!val('f-work')) return showAlert('alert-complete',L.errWork);
  const need=val('f-fixed')==='No'||val('f-fixed')==='Partially'||val('f-followup')==='Yes';
  if(need&&!val('f-followupreason')) return showAlert('alert-complete',L.errFollowupReason);
  buildConfirm();
  showScreen('confirm');
}

function buildConfirm(){
  const L=t();
  const job = currentJob;
  if(!job){ initStart(); return; }
  const rows=[
    [L.fieldRef,job.referenceNo],[L.fieldCompany,job.companyName],[L.fieldContact,job.contactPerson],[L.fieldPhone,job.phone],

    [L.fieldInitial,job.initialDescription],[L.fieldWork,val('f-work')],[L.fieldFixed,val('f-fixed')],
    [L.fieldFollowup,val('f-followup')],[L.fieldFollowupReason,val('f-followupreason')||L.na],[L.fieldNotes,val('f-notes')||L.na]
  ];
  document.getElementById('confirm-body').innerHTML=rows.map(([k,v])=>`<div class="confirm-row"><div class="confirm-key">${escapeHtml(k)}</div><div class="confirm-val">${escapeHtml(v)}</div></div>`).join('');
}

function submitComplete(){
  const job = currentJob;
  if(!job){ initStart(); return; }

  const payload={
    ...job,
    formType:'maintenanceRecord',status:'COMPLETED',
    completedAt:new Date().toISOString(),
    departureTime:val('f-departure'),workCompleted:val('f-work'),
    issueFixed:val('f-fixed'),followUpRequired:val('f-followup'),
    followUpReason:val('f-followupreason'),
    siteContactComplete:val('f-sitecontact-complete'),
    notes:val('f-notes')
  };

  // The job leaves the "open" list only after the Sheet confirms the completion
  apRun({ key:'maintenanceComplete-'+job.referenceNo, url:SHEET_URL, button:'cf-submit-btn',
    buildPayload:()=>payload,
    onSaved:()=>{
      removeOpenJob(job.referenceNo);
      currentJob = null;
      document.getElementById('succ-ref').textContent='Ref: '+job.referenceNo;
      showScreen('success');
    }
  });
}

  ['f-company','f-contact','f-phone','f-email','f-initial','f-sitecontact-arrival'].forEach(id=>{

function escapeHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(str){ return escapeHtml(str).replace(/'/g,'&#39;'); }
