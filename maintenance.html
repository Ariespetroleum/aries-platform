<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maintenance Visit Record — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0f1117;--surface:#181c25;--surface2:#1f2433;--border:#2a3044;--border2:#353f58;--accent:#4ade80;--accent2:#22d3ee;--warn:#fb923c;--danger:#f87171;--text:#e8eaf0;--muted:#7a8299;--label:#a0aabb;--mono:'DM Mono',monospace;--sans:'Sora',sans-serif;--ok-bg:rgba(74,222,128,.08);--ok-border:rgba(74,222,128,.25);--warn-bg:rgba(251,146,60,.08);--warn-border:rgba(251,146,60,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 10px 4px 0;border-right:1px solid var(--border);margin-right:2px;white-space:nowrap}
.back-arrow{font-size:15px}.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.header-title{font-size:13px;font-weight:600}.header-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.lang-btn{padding:4px 9px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent}
.lang-btn.active{background:var(--border2);color:var(--text)}
.no-station{display:none;background:rgba(248,113,113,.08);border-bottom:1px solid rgba(248,113,113,.3);padding:12px 16px;text-align:center}
.no-station.show{display:block}.no-station-msg{font-size:13px;color:var(--danger);margin-bottom:8px}
.no-station-link{display:inline-block;background:var(--danger);color:#1a0000;font-size:12px;font-weight:600;padding:7px 16px;border-radius:7px;text-decoration:none}
.station-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px}
.station-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
.station-name{font-family:var(--mono);font-size:11px;color:var(--label)}
.station-name span{color:var(--text);font-weight:600}
.badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:rgba(34,211,238,.1);color:var(--accent2);border:1px solid rgba(34,211,238,.2)}
.container{max-width:540px;margin:0 auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}
.form-header{margin-bottom:20px}.form-title{font-size:18px;font-weight:700;margin-bottom:4px}.form-sub{font-size:12px;color:var(--muted);line-height:1.5}
.section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.section-header{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.section-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none}
.field textarea{resize:vertical;min-height:82px;line-height:1.5}
.notice{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--warn);font-size:12px;line-height:1.6}
.open-card{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:14px;margin-bottom:14px}
.open-title{font-size:15px;font-weight:700;color:var(--warn);margin-bottom:8px}
.open-sub{font-size:12px;color:var(--label);line-height:1.6;margin-bottom:10px}
.open-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(251,146,60,.18);padding-top:8px;margin-top:8px}
.open-key{font-size:11px;color:var(--muted);font-family:var(--mono)}.open-val{font-size:12px;font-weight:600;text-align:right}
.alert{display:none;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;line-height:1.5}
.alert.show{display:block}
.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:10px;font-family:var(--sans);font-size:14px;font-weight:600;padding:14px;cursor:pointer}
.btn-primary{background:var(--accent2);color:#071a17}.btn-warn{background:var(--warn);color:#1a0800}.btn-secondary{background:var(--surface2);color:var(--label);border:1px solid var(--border)}
.confirm-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.confirm-section-title{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:9px 14px;border-bottom:1px solid var(--border);gap:12px}
.confirm-row:last-child{border-bottom:none}.confirm-key{font-size:11px;color:var(--muted);font-family:var(--mono);width:42%;flex-shrink:0}.confirm-val{font-size:13px;font-weight:500;flex:1;word-break:break-word}
.success-wrap{text-align:center;padding:56px 20px}.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px}
.success-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--accent)}.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}.success-ref{font-family:var(--mono);font-size:16px;color:var(--accent2);font-weight:600;margin:12px 0 24px}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,17,23,.85);align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:13px;color:var(--muted);font-family:var(--mono)}
@media(max-width:520px){.section-body{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Submitting…</div></div>

<div class="header">
  <div class="header-left">
    <div class="back-btn" onclick="goPortal()"><span class="back-arrow">←</span><span class="back-label" id="h-back">Portal</span></div>
    <div><div class="header-title" id="h-title">Maintenance Visit Record</div><div class="header-sub" id="h-sub">SERVICE / REPAIR LOG</div></div>
  </div>
  <div class="lang-toggle"><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('zh')">中文</button></div>
</div>

<div class="no-station" id="no-station-bar"><div class="no-station-msg" id="ns-msg"></div><a class="no-station-link" href="index.html" id="ns-link"></a></div>
<div class="station-bar" id="station-bar"><div class="station-dot"></div><div class="station-name" id="station-display"></div><div class="badge" id="badge">MAINTENANCE</div></div>

<div class="container">
  <div class="screen active" id="screen-start"></div>

  <div class="screen" id="screen-arrival">
    <div class="form-header"><div class="form-title" id="arrival-title"></div><div class="form-sub" id="arrival-sub"></div></div>
    <div class="section">
      <div class="section-header"><span>🛠️</span><span class="section-title" id="arrival-section-title"></span></div>
      <div class="section-body">
        <div class="field full"><label id="l-recordcreated"></label><input type="text" id="f-recordcreated" readonly></div>
        <div class="field"><label id="l-company"></label><input type="text" id="f-company"></div>
        <div class="field"><label id="l-contact"></label><input type="text" id="f-contact"></div>
        <div class="field"><label id="l-phone"></label><input type="tel" id="f-phone"></div>
        <div class="field"><label id="l-email"></label><input type="email" id="f-email"></div>
        <div class="field"><label id="l-arrival"></label><input type="time" id="f-arrival"></div>
        <div class="field"><label id="l-equipment"></label>
          <select id="f-equipment" onchange="toggleOtherEquipment()">
            <option value="">—</option>
            <option>Car Wash</option><option>Coffee Machine</option><option>POS</option><option>Pump</option><option>Aircon</option><option>Fridge</option><option>Freezer</option><option>Ice Machine</option><option>Lights</option><option>Toilet</option><option>Doors</option><option>Security System</option><option>Other</option>
          </select>
        </div>
        <div class="field" id="other-equipment-wrap" style="display:none"><label id="l-other-equipment"></label><input type="text" id="f-other-equipment"></div>
        <div class="field full"><label id="l-initial"></label><textarea id="f-initial"></textarea></div>
        <div class="field full"><label id="l-sitecontact-arrival"></label><input type="text" id="f-sitecontact-arrival"></div>
      </div>
    </div>
    <div class="alert" id="alert-arrival"></div>
    <div class="btn-wrap"><button class="btn btn-primary" id="arrival-submit" onclick="submitArrival()"></button></div>
  </div>

  <div class="screen" id="screen-reminder">
    <div class="success-wrap">
      <div class="success-icon">!</div>
      <div class="success-title" id="reminder-title" style="color:var(--warn)"></div>
      <div class="success-sub" id="reminder-msg"></div>
      <div class="success-ref" id="reminder-ref"></div>
      <div class="btn-wrap">
        <button class="btn btn-warn" id="reminder-complete" onclick="showCompleteFromOpen()"></button>
        <button class="btn btn-secondary" id="reminder-home" onclick="goPortal()"></button>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-complete">
    <div class="form-header"><div class="form-title" id="complete-title"></div><div class="form-sub" id="complete-sub"></div></div>
    <div id="open-job-card"></div>
    <div class="section">
      <div class="section-header"><span>✅</span><span class="section-title" id="complete-section-title"></span></div>
      <div class="section-body">
        <div class="field"><label id="l-departure"></label><input type="time" id="f-departure"></div>
        <div class="field"><label id="l-fixed"></label><select id="f-fixed" onchange="toggleFollowupReason()"><option value="">—</option><option value="Yes">Yes</option><option value="Partially">Partially</option><option value="No">No</option><option value="Routine Service">Routine Service</option></select></div>
        <div class="field"><label id="l-followup"></label><select id="f-followup" onchange="toggleFollowupReason()"><option value="">—</option><option value="No">No</option><option value="Yes">Yes</option></select></div>
        <div class="field full"><label id="l-work"></label><textarea id="f-work"></textarea></div>
        <div class="field full" id="followup-reason-wrap" style="display:none"><label id="l-followupreason"></label><textarea id="f-followupreason"></textarea></div>
        <div class="field full"><label id="l-sitecontact-complete"></label><input type="text" id="f-sitecontact-complete"></div>
        <div class="field full"><label id="l-notes"></label><textarea id="f-notes"></textarea></div>
      </div>
    </div>
    <div class="alert" id="alert-complete"></div>
    <div class="btn-wrap"><button class="btn btn-primary" id="complete-review" onclick="goReview()"></button></div>
  </div>

  <div class="screen" id="screen-confirm">
    <div class="form-header"><div class="form-title" id="cf-title"></div><div class="form-sub" id="cf-sub"></div></div>
    <div class="confirm-section"><div class="confirm-section-title" id="cf-basic-title"></div><div id="confirm-body"></div></div>
    <div class="btn-wrap"><button class="btn btn-secondary" id="cf-edit-btn" onclick="showScreen('complete')"></button><button class="btn btn-primary" id="cf-submit-btn" onclick="submitComplete()"></button></div>
  </div>

  <div class="screen" id="screen-success">
    <div class="success-wrap"><div class="success-icon">✓</div><div class="success-title" id="succ-title"></div><div class="success-sub" id="succ-msg"></div><div class="success-ref" id="succ-ref"></div><div class="btn-wrap"><button class="btn btn-secondary" id="succ-new" onclick="clearAndNew()"></button><button class="btn btn-secondary" id="succ-home" onclick="goPortal()"></button></div></div>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';

let station = localStorage.getItem('ap_station') || '';
let lang = localStorage.getItem('ap_lang') || 'en';
const openedAt = new Date();

function openKey(){return 'ap_open_maintenance_' + station}
function getOpenJobs(){
  try{
    const data=JSON.parse(localStorage.getItem(openKey())||'[]');
    if(Array.isArray(data))return data;
    return data?[data]:[];
  }catch(e){return []}
}
function addOpenJob(j){
  const jobs=getOpenJobs();
  jobs.push(j);
  localStorage.setItem(openKey(),JSON.stringify(jobs));
}
function removeOpenJob(ref){
  const jobs=getOpenJobs().filter(j=>j.referenceNo!==ref);
  localStorage.setItem(openKey(),JSON.stringify(jobs));
}

const S = {
  en:{
    pageTitle:'Maintenance Visit Record — Aries Petroleum',hBack:'Portal',hTitle:'Maintenance Visit Record',hSub:'SERVICE / REPAIR LOG',
    nsMsg:'No station selected. Please return to the portal first.',nsLink:'← Go to Portal',badge:'MAINTENANCE',
    arrivalTitle:'Arrival Registration',arrivalSub:'Contractor/service provider records arrival details first.',arrivalSection:'Arrival Details',
    recordCreated:'Record Created',company:'Company Name *',contact:'Contact Person *',phone:'Phone Number *',email:'Email',arrival:'Arrival Time *',
    equipment:'Equipment / Area *',otherEquipment:'Specific Equipment *',initial:'Initial Issue / Service Description *',siteContactArrival:'Site Staff / Person Assisted',
    arrivalSubmit:'Submit Arrival Record',reminderTitle:'Maintenance In Progress',
    reminderMsg:'Before leaving the site, please return and complete the final maintenance record. Staff can also complete it later if required.',
    reminderComplete:'Complete Final Record',reminderHome:'← Back to Portal',
    completeTitle:'Complete Maintenance Record',completeSub:'Complete departure time, work completed and follow-up details.',completeSection:'Final Details',
    departure:'Departure Time *',fixed:'Issue Fixed? *',followup:'Follow Up Required? *',work:'Work Completed *',followupReason:'Follow Up / Unfinished Reason *',
    siteContactComplete:'Completed By / Site Staff',notes:'Notes',completeReview:'Review & Submit →',
    cfTitle:'Review & Submit',cfSub:'Check maintenance details before submitting.',cfBasicTitle:'Maintenance Visit Details',cfEdit:'← Edit',cfSubmit:'Submit Completed Record',
    succTitle:'Record Completed',succMsg:'Maintenance visit record has been completed.',succNew:'New Maintenance Record',succHome:'← Back to Portal',
    submitting:'Submitting…',savingArrival:'Saving arrival record…',
    errCompany:'Please enter company name.',errContact:'Please enter contact person.',errPhone:'Please enter phone number.',errArrival:'Please enter arrival time.',errEquipment:'Please select equipment / area.',errOtherEquipment:'Please enter specific equipment.',errInitial:'Please enter initial description.',
    errDeparture:'Please enter departure time.',errFixed:'Please select whether issue was fixed.',errFollowup:'Please select whether follow up is required.',errWork:'Please describe work completed.',errFollowupReason:'Please enter follow-up / unfinished reason.',
    fieldRef:'Reference No.',fieldCompany:'Company',fieldContact:'Contact',fieldPhone:'Phone',fieldArrival:'Arrival Time',fieldDeparture:'Departure Time',fieldEquipment:'Equipment / Area',fieldInitial:'Initial Description',fieldWork:'Work Completed',fieldFixed:'Issue Fixed',fieldFollowup:'Follow Up Required',fieldFollowupReason:'Follow Up Reason',fieldNotes:'Notes',na:'—'
  },
  zh:{
    pageTitle:'维修到场登记 — Aries Petroleum',hBack:'首页',hTitle:'维修到场登记',hSub:'维修 / 保养记录',
    nsMsg:'未选择站点，请先返回首页选择站点。',nsLink:'← 返回首页',badge:'维修',
    arrivalTitle:'到场登记',arrivalSub:'维修人员或服务人员先登记到场信息。',arrivalSection:'到场信息',
    recordCreated:'记录创建时间',company:'公司名称 *',contact:'联系人 *',phone:'电话号码 *',email:'邮箱',arrival:'到场时间 *',
    equipment:'维修设备 / 区域 *',otherEquipment:'具体设备 *',initial:'初步问题 / 服务说明 *',siteContactArrival:'现场协助人员',
    arrivalSubmit:'提交到场记录',reminderTitle:'维修仍在进行中',
    reminderMsg:'离开站点前，请返回并完成最终维修登记。如维修人员忘记，员工也可以稍后补充完成。',
    reminderComplete:'完成最终登记',reminderHome:'← 返回首页',
    completeTitle:'完成维修记录',completeSub:'请补充离开时间、完成内容和后续跟进信息。',completeSection:'最终信息',
    departure:'离开时间 *',fixed:'是否已修好？*',followup:'是否需要跟进？*',work:'完成内容 *',followupReason:'跟进 / 未完成原因 *',
    siteContactComplete:'完成人 / 现场员工',notes:'备注',completeReview:'核对并提交 →',
    cfTitle:'确认提交',cfSub:'提交前请核对维修记录。',cfBasicTitle:'维修到场信息',cfEdit:'← 返回修改',cfSubmit:'确认提交完成记录',
    succTitle:'记录已完成',succMsg:'维修到场记录已完成。',succNew:'新建维修记录',succHome:'← 返回首页',
    submitting:'提交中…',savingArrival:'正在保存到场记录…',
    errCompany:'请填写公司名称。',errContact:'请填写联系人。',errPhone:'请填写电话号码。',errArrival:'请填写到场时间。',errEquipment:'请选择维修设备 / 区域。',errOtherEquipment:'请填写具体设备。',errInitial:'请填写初步说明。',
    errDeparture:'请填写离开时间。',errFixed:'请选择是否已修好。',errFollowup:'请选择是否需要跟进。',errWork:'请填写完成内容。',errFollowupReason:'请填写跟进 / 未完成原因。',
    fieldRef:'参考编号',fieldCompany:'公司',fieldContact:'联系人',fieldPhone:'电话',fieldArrival:'到场时间',fieldDeparture:'离开时间',fieldEquipment:'维修设备 / 区域',fieldInitial:'初步说明',fieldWork:'完成内容',fieldFixed:'是否修好',fieldFollowup:'是否需要跟进',fieldFollowupReason:'跟进原因',fieldNotes:'备注',na:'—'
  }
};

function t(){return S[lang]}
function setText(id,v){const el=document.getElementById(id);if(el)el.textContent=v}

function setLang(l){
  lang=l;localStorage.setItem('ap_lang',l);
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文')));
  applyLang();
}

function applyLang(){
  const L=t();document.title=L.pageTitle;
  setText('h-back',L.hBack);setText('h-title',L.hTitle);setText('h-sub',L.hSub);setText('ns-msg',L.nsMsg);setText('ns-link',L.nsLink);setText('badge',L.badge);
  setText('arrival-title',L.arrivalTitle);setText('arrival-sub',L.arrivalSub);setText('arrival-section-title',L.arrivalSection);
  setText('l-recordcreated',L.recordCreated);setText('l-company',L.company);setText('l-contact',L.contact);setText('l-phone',L.phone);setText('l-email',L.email);setText('l-arrival',L.arrival);setText('l-equipment',L.equipment);setText('l-other-equipment',L.otherEquipment);setText('l-initial',L.initial);setText('l-sitecontact-arrival',L.siteContactArrival);setText('arrival-submit',L.arrivalSubmit);
  setText('reminder-title',L.reminderTitle);setText('reminder-msg',L.reminderMsg);setText('reminder-complete',L.reminderComplete);setText('reminder-home',L.reminderHome);
  setText('complete-title',L.completeTitle);setText('complete-sub',L.completeSub);setText('complete-section-title',L.completeSection);
  setText('l-departure',L.departure);setText('l-fixed',L.fixed);setText('l-followup',L.followup);setText('l-work',L.work);setText('l-followupreason',L.followupReason);setText('l-sitecontact-complete',L.siteContactComplete);setText('l-notes',L.notes);setText('complete-review',L.completeReview);
  setText('cf-title',L.cfTitle);setText('cf-sub',L.cfSub);setText('cf-basic-title',L.cfBasicTitle);setText('cf-edit-btn',L.cfEdit);setText('cf-submit-btn',L.cfSubmit);
  setText('succ-title',L.succTitle);setText('succ-msg',L.succMsg);setText('succ-new',L.succNew);setText('succ-home',L.succHome);
  if(station)document.getElementById('station-display').innerHTML=`<span>${escapeHtml(station)}</span>`;
  document.getElementById('f-recordcreated').value=formatDateTime(openedAt);
  renderStart();
}

function fmtTime(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function formatDateTime(d){return d.toLocaleDateString(lang==='en'?'en-AU':'zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' '+d.toLocaleTimeString(lang==='en'?'en-AU':'zh-CN',{hour:'2-digit',minute:'2-digit'})}
function val(id){return document.getElementById(id).value.trim()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0)}

function renderStart(){
  if(!station)return;
  const jobs=getOpenJobs();
  const L=t();
  if(jobs.length){
    const cards=jobs.map(job=>`
      ${openJobHtml(job)}
      <div class="btn-wrap" style="margin-bottom:14px">
        <button class="btn btn-warn" onclick="showCompleteFromOpen('${escapeAttr(job.referenceNo)}')">${L.reminderComplete}</button>
      </div>`).join('');
    document.getElementById('screen-start').innerHTML=`
      <div class="form-header"><div class="form-title">${L.reminderTitle}</div><div class="form-sub">${L.reminderMsg}</div></div>
      ${cards}
      <button class="btn btn-secondary" onclick="showScreen('arrival')">${L.succNew}</button>`;
    showScreen('start');
  }else{
    showScreen('arrival');
  }
}

function openJobHtml(job){
  const L=t();
  return `<div class="open-card"><div class="open-title">⚠ ${L.reminderTitle}</div><div class="open-sub">${escapeHtml(job.companyName)} — ${escapeHtml(job.equipmentDisplay)}</div><div class="open-row"><div class="open-key">${L.fieldRef}</div><div class="open-val">${escapeHtml(job.referenceNo)}</div></div><div class="open-row"><div class="open-key">${L.fieldContact}</div><div class="open-val">${escapeHtml(job.contactPerson)}</div></div><div class="open-row"><div class="open-key">${L.fieldArrival}</div><div class="open-val">${escapeHtml(job.arrivalTime)}</div></div></div>`;
}

function toggleOtherEquipment(){document.getElementById('other-equipment-wrap').style.display=val('f-equipment')==='Other'?'block':'none'}
function toggleFollowupReason(){const show=val('f-fixed')==='No'||val('f-fixed')==='Partially'||val('f-followup')==='Yes';document.getElementById('followup-reason-wrap').style.display=show?'block':'none'}

function submitArrival(){
  const L=t();
  hideAlert('alert-arrival');

  if(!val('f-company'))return showAlert('alert-arrival',L.errCompany);
  if(!val('f-contact'))return showAlert('alert-arrival',L.errContact);
  if(!val('f-phone'))return showAlert('alert-arrival',L.errPhone);
  if(!val('f-arrival'))return showAlert('alert-arrival',L.errArrival);
  if(!val('f-equipment'))return showAlert('alert-arrival',L.errEquipment);
  if(val('f-equipment')==='Other'&&!val('f-other-equipment'))return showAlert('alert-arrival',L.errOtherEquipment);
  if(!val('f-initial'))return showAlert('alert-arrival',L.errInitial);

  const ref='MT-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*9000+1000);
  const equipmentDisplay=val('f-equipment')==='Other'?val('f-other-equipment'):val('f-equipment');

  const job={
    formType:'maintenanceArrival',
    status:'IN_PROGRESS',
    referenceNo:ref,
    submittedAt:new Date().toISOString(),
    openedAt:openedAt.toISOString(),
    station:station,
    lang:lang,
    companyName:val('f-company'),
    contactPerson:val('f-contact'),
    phone:val('f-phone'),
    email:val('f-email'),
    arrivalTime:val('f-arrival'),
    equipment:val('f-equipment'),
    specificEquipment:val('f-other-equipment'),
    equipmentDisplay:equipmentDisplay,
    initialDescription:val('f-initial'),
    siteContactArrival:val('f-sitecontact-arrival')
  };

  addOpenJob(job);

  document.getElementById('loadingOverlay').classList.remove('show');
  document.getElementById('reminder-ref').textContent='Ref: '+ref;
  document.getElementById('reminder-complete').onclick=function(){showCompleteFromOpen(ref)};
  showScreen('reminder');

  if(SHEET_URL){
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(job)}).catch(()=>{});
  }
}

function showCompleteFromOpen(ref){
  const jobs=getOpenJobs();
  let job=jobs.find(j=>j.referenceNo===ref);
  if(!job&&jobs.length){
    job=jobs[jobs.length-1];
    ref=job.referenceNo;
  }
  if(!job){renderStart();return}
  document.getElementById('open-job-card').innerHTML=openJobHtml(job);
  document.getElementById('open-job-card').dataset.ref=ref;
  document.getElementById('f-departure').value=fmtTime(new Date());
  showScreen('complete');
}

function goReview(){
  const L=t();
  hideAlert('alert-complete');
  if(!val('f-departure'))return showAlert('alert-complete',L.errDeparture);
  if(!val('f-fixed'))return showAlert('alert-complete',L.errFixed);
  if(!val('f-followup'))return showAlert('alert-complete',L.errFollowup);
  if(!val('f-work'))return showAlert('alert-complete',L.errWork);
  const need=val('f-fixed')==='No'||val('f-fixed')==='Partially'||val('f-followup')==='Yes';
  if(need&&!val('f-followupreason'))return showAlert('alert-complete',L.errFollowupReason);
  buildConfirm();
  showScreen('confirm');
}

function buildConfirm(){
  const L=t();
  const ref=document.getElementById('open-job-card').dataset.ref;
  const jobs=getOpenJobs();
  const job=jobs.find(j=>j.referenceNo===ref);
  if(!job){renderStart();return}
  const rows=[
    [L.fieldRef,job.referenceNo],[L.fieldCompany,job.companyName],[L.fieldContact,job.contactPerson],[L.fieldPhone,job.phone],
    [L.fieldArrival,job.arrivalTime],[L.fieldDeparture,val('f-departure')],[L.fieldEquipment,job.equipmentDisplay],
    [L.fieldInitial,job.initialDescription],[L.fieldWork,val('f-work')],[L.fieldFixed,val('f-fixed')],[L.fieldFollowup,val('f-followup')],
    [L.fieldFollowupReason,val('f-followupreason')||L.na],[L.fieldNotes,val('f-notes')||L.na]
  ];
  document.getElementById('confirm-body').innerHTML=rows.map(([k,v])=>`<div class="confirm-row"><div class="confirm-key">${escapeHtml(k)}</div><div class="confirm-val">${escapeHtml(v)}</div></div>`).join('');
}

function submitComplete(){
  const L=t();
  const ref=document.getElementById('open-job-card').dataset.ref;
  const jobs=getOpenJobs();
  const job=jobs.find(j=>j.referenceNo===ref);
  if(!job){renderStart();return}

  const payload={
    ...job,
    formType:'maintenanceRecord',
    status:'COMPLETED',
    completedAt:new Date().toISOString(),
    departureTime:val('f-departure'),
    workCompleted:val('f-work'),
    issueFixed:val('f-fixed'),
    followUpRequired:val('f-followup'),
    followUpReason:val('f-followupreason'),
    siteContactComplete:val('f-sitecontact-complete'),
    notes:val('f-notes')
  };

  onSuccess(job.referenceNo);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
}

function onSuccess(ref){
  document.getElementById('loadingOverlay').classList.remove('show');
  removeOpenJob(ref);
  document.getElementById('succ-ref').textContent='Ref: '+ref;
  showScreen('success');
}

function clearAndNew(){
  ['f-company','f-contact','f-phone','f-email','f-initial','f-sitecontact-arrival'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-equipment').value='';
  document.getElementById('f-arrival').value=fmtTime(new Date());
  document.getElementById('f-recordcreated').value=formatDateTime(openedAt);
  document.getElementById('other-equipment-wrap').style.display='none';
  showScreen('arrival');
}
function showAlert(id,msg){const a=document.getElementById(id);a.style.background='var(--warn-bg)';a.style.border='1px solid var(--warn-border)';a.style.color='var(--warn)';a.textContent=msg;a.classList.add('show');a.scrollIntoView({behavior:'smooth',block:'center'})}
function hideAlert(id){const el=document.getElementById(id);if(el)el.classList.remove('show')}
function escapeHtml(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escapeAttr(str){return escapeHtml(str).replace(/'/g,'&#39;')}
function goPortal(){window.location.href='index.html'}

if(!station){
  document.getElementById('no-station-bar').classList.add('show');
  document.getElementById('station-bar').style.display='none';
  document.getElementById('screen-start').style.display='none';
}

document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文')));
document.getElementById('f-arrival').value=fmtTime(openedAt);
applyLang();
</script>
</body>
</html>
