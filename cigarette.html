.delete-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--sinopec-red);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-weight:700}.delete-btn:hover{background:var(--sinopec-red);color:#fff}

.confirm-header{margin-bottom:18px}.confirm-title{font-size:20px;font-weight:800;margin-bottom:5px;color:var(--text)}.confirm-sub{font-size:12px;color:var(--muted)}.confirm-section{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}.confirm-section-title{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}.confirm-row{display:flex;padding:9px 14px;border-bottom:1px solid var(--border);gap:12px;align-items:center}.confirm-row:last-child{border-bottom:none}.confirm-key{font-size:12px;color:var(--label);flex:1;min-width:0;font-weight:600}.confirm-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);flex-shrink:0}.confirm-val.zero{color:var(--muted)}
.success-wrap{text-align:center;padding:56px 20px}.success-icon{width:68px;height:68px;background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--bp-green-dark);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;font-weight:800}.success-title{font-size:21px;font-weight:800;margin-bottom:8px;color:var(--bp-green-dark)}.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:24px}.success-actions{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(20,32,51,.72);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:16px}.loading-overlay.show{display:flex}.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:13px;color:#fff;font-family:var(--mono)}

.list-loading{padding:20px 14px;text-align:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.sync-badge{display:none;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}

<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Submitting…</div>
</div>

<div class="header">
  <div class="header-left">
    <div class="back-btn" onclick="goPortal()">
      <span class="back-arrow">←</span>
      <span class="back-label" id="h-back">Portal</span>
    </div>
    <div>
      <div class="header-title" id="h-title">Cigarette Stock Check</div>
      <div class="header-sub" id="h-sub">END OF SHIFT</div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="no-station" id="no-station-bar">
  <div class="no-station-msg" id="ns-msg"></div>
  <a class="no-station-link" href="index.html" id="ns-link"></a>
</div>

<div class="station-bar" id="station-bar">
  <div class="station-dot"></div>
  <div class="station-name" id="station-display"></div>
  <div class="daily-badge" id="daily-badge">DAILY</div>
</div>

<div class="container">

  <!-- ══ FORM ══ -->
  <div class="screen active" id="screen-form">

    <div class="form-header">
      <div class="form-title" id="f-title">Cigarette Stock Check</div>
      <div class="form-sub" id="f-sub">Count remaining stock at end of shift.</div>
    </div>

    <div class="info-grid">
      <div class="field">
        <label id="l-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label id="l-shift">Shift *</label>
        <select id="f-shift">
          <option value="">—</option>
          <option id="sh-morning">Morning</option>
          <option id="sh-afternoon">Afternoon</option>
          <option id="sh-night">Night</option>
        </select>
      </div>
      <div class="field full">
        <label id="l-staff">Staff Name *</label>
        <div class="staff-wrap">
          <input type="text" id="f-staff" placeholder="Your name" autocomplete="off"
            onfocus="showLastUsedHint()" onblur="hideLastUsedHint()" oninput="hideLastUsedHint()">
          <div class="last-used-hint" id="last-used-hint" onmousedown="useLastName()">
            <span id="last-used-prefix"></span> <span class="last-used-name" id="last-used-name"></span>

          <div id="staff-hint" class="staff-hint" style="display:none"></div>

      </div>
    </div>

    <!-- Summary -->
    <div class="summary-bar">
      <div class="summary-stat">
        <div class="summary-num" id="sum-total">0</div>
        <div class="summary-label" id="sum-total-label">Total</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-stat">
        <div class="summary-num" id="sum-filled">0</div>
        <div class="summary-label" id="sum-filled-label">Counted</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-stat">
        <div class="summary-num" id="sum-remain" style="color:var(--warn)">0</div>
        <div class="summary-label" id="sum-remain-label">Remaining</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="items-left-label" id="items-left-label"></div>
      <button class="manage-btn" id="manage-btn" onclick="toggleManage()"></button>
    </div>

    <!-- Manage mode warning banner -->
    <div class="manage-banner" id="manage-banner"></div>

    <!-- Product list -->
    <div class="section">
      <div class="section-header">
        <div class="section-header-left">
          <span class="section-icon">🚬</span>
          <span class="section-title" id="sec-products-title">Products</span>
          <span class="sync-badge" id="sync-badge"></span>
        </div>
        <span class="section-count" id="product-count">0 items</span>
      </div>
      <div id="product-list"></div>
      <!-- Add row only visible in manage mode -->
      <div class="add-product-row" id="add-product-row" style="display:none">
        <input class="add-product-input" id="new-product-input" type="text"
          onkeydown="if(event.key==='Enter')addProduct()">
        <button class="add-product-btn" id="add-product-btn" onclick="addProduct()">+ Add</button>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>
    <div class="btn-wrap">
      <button class="btn btn-primary" id="review-btn" onclick="goReview()"></button>
    </div>
  </div>

  <!-- ══ CONFIRM ══ -->
  <div class="screen" id="screen-confirm">
    <div class="confirm-header">
      <div class="confirm-title" id="cf-title"></div>
      <div class="confirm-sub"   id="cf-sub"></div>
    </div>
    <div class="confirm-section">
      <div class="confirm-section-title" id="cf-info-title"></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-date-label"></div><div class="confirm-val" id="cf-date-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-shift-label"></div><div class="confirm-val" id="cf-shift-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-staff-label"></div><div class="confirm-val" id="cf-staff-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-station-label"></div><div class="confirm-val" id="cf-station-val"></div></div>
    </div>
    <div class="confirm-section">
      <div class="confirm-section-title" id="cf-stock-title"></div>
      <div id="cf-stock-list"></div>
    </div>

    <div class="btn-wrap">
      <button class="btn btn-secondary" id="cf-edit-btn"   onclick="showScreen('form')"></button>
      <button class="btn btn-primary"   id="cf-submit-btn" onclick="submitForm()"></button>

    <p class="note" id="cf-note"></p>
  </div>

  <!-- ══ SUCCESS ══ -->
  <div class="screen" id="screen-success">
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <div class="success-title" id="succ-title"></div>
      <div class="success-sub"   id="succ-msg"></div>
      <div class="success-actions">
        <button class="btn btn-secondary" id="succ-again" onclick="resetForm()"></button>
        <button class="btn btn-secondary" id="succ-home"  onclick="goPortal()"></button>
      </div>
    </div>
  </div>

</div>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 10;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'

   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';

// in-memory working copy (source of truth for this session once loaded)
let _products = null;

function cacheKey() { return `ap_cig_products_${station}`; }

function getCachedProducts() {
  try {
    const raw = localStorage.getItem(cacheKey());
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function setCachedProducts(list) {
  try { localStorage.setItem(cacheKey(), JSON.stringify(list)); } catch(e) {}
}

function getDefaultProducts() {
  return DEFAULT_PRODUCTS.map(name => ({ name, custom: false }));
}

// Load from server via JSONP — avoids CORS/redirect issues with Google Apps Script.
// Falls back to localStorage cache then defaults.
function loadProductsFromServer() {
  if (!station) {
    _products = getDefaultProducts();
    return Promise.resolve();
  }

  showSyncBadge('syncing');

  return new Promise((resolve) => {
    const cbName = '_cigCb_' + Date.now();
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      console.warn('CigProducts JSONP timeout');
      useFallback();
      resolve();
    }, 8000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    function useFallback() {
      const cached = getCachedProducts();
      _products = cached || getDefaultProducts();
      showSyncBadge('error');
    }

    window[cbName] = function(data) {
      cleanup();
      try {
        if (data && data.success) {
          if (data.products === null) {
            _products = getDefaultProducts();
            saveProductsToServer(_products);
          } else {
            _products = data.products;
            setCachedProducts(_products);
          }
          hideSyncBadge();
        } else {
          useFallback();
        }
      } catch(e) {
        useFallback();
      }
      resolve();
    };

    script.src = SHEET_URL + '?action=getCigProducts&station=' + encodeURIComponent(station) + '&callback=' + cbName + '&t=' + Date.now();
    script.onerror = () => { cleanup(); useFallback(); resolve(); };
    document.head.appendChild(script);
  });
}

// Save the shared product list. The local copy is only a cache: the badge stays
// on "not synced" until the Apps Script confirms the list was written to the Sheet.
// Saves run one at a time; if the list changes while saving, the latest list is sent next.
let cigSyncRunning = false, cigSyncQueued = null;
async function saveProductsToServer(list) {
  if (!station) return;
  setCachedProducts(list);
  cigSyncQueued = list;
  if (cigSyncRunning) return;
  cigSyncRunning = true;
  try {
    while (cigSyncQueued) {
      const next = cigSyncQueued; cigSyncQueued = null;
      showSyncBadge('syncing');
      const req = apRequestFor('cigProducts', { station, products: next });
      const result = await apSubmit(SHEET_URL, { formType:'saveCigProducts', station, products:next, requestId:req.requestId });
      if (result.status === 'ok') {
        apDone('cigProducts');
        if (!cigSyncQueued) hideSyncBadge();
      } else {
        console.warn('CigProducts save not confirmed:', result);
        if (!cigSyncQueued) showSyncBadge('error', next);
      }
    }
  } finally {
    cigSyncRunning = false;
  }
}

function showSyncBadge(type, unsavedList) {
  const el = document.getElementById('sync-badge');
  el.className = 'sync-badge ' + type;
  el.textContent = type === 'syncing' ? t().syncingList : t().syncError;
  // Tap the red badge to retry with the same request (no duplicate list)
  el.style.cursor = type === 'error' ? 'pointer' : '';
  el.onclick = type === 'error' ? () => saveProductsToServer(unsavedList || getProducts()) : null;
}
function hideSyncBadge() {
  const el = document.getElementById('sync-badge');
  el.className = 'sync-badge';
}

const qtyCache = {};

function renderProducts() {
  const products = getProducts();
  const L = t();

  // Preserve current input values before re-render
  products.forEach((_, i) => {
    const el = document.getElementById(`qty_${i}`);
    if (el) qtyCache[i] = el.value;
  });

  const list = document.getElementById('product-list');

  if (_products === null) {
    list.innerHTML = `<div class="list-loading">${L.loadingList}</div>`;
    setText('product-count', L.productCount(0));
    return;
  }

  list.innerHTML = products.map((p, i) => {
    const cached = qtyCache[i] ?? '';
    const filled = cached !== '';
    const deleteBtn = manageMode
      ? `<button class="delete-btn" onclick="deleteProduct(${i})" title="Remove">✕</button>`
      : '';
    return `
      <div class="product-row">
        <div class="product-name${p.custom ? ' custom' : ''}">${escHtml(p.name)}</div>
        <div class="qty-wrap">
          ${manageMode ? '' : `
            <button class="qty-btn" onclick="adjustQty(${i},-1)">−</button>
            <input class="qty-input${filled ? ' filled' : ''}" type="number"
              id="qty_${i}" min="0" value="${escHtml(cached)}" placeholder="—"
              oninput="onQtyInput(${i},this)">
            <button class="qty-btn" onclick="adjustQty(${i},1)">+</button>
          `}
          ${deleteBtn}
        </div>
      </div>`;
  }).join('');
  setText('product-count', L.productCount(products.length));
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getQty(i) {
  const el = document.getElementById(`qty_${i}`);
  const v  = el ? el.value : (qtyCache[i] ?? '');
  if (v === '' || v === null || v === undefined) return null;
  return Math.max(0, parseInt(v) || 0);
}

function setQty(i, val) {
  const el = document.getElementById(`qty_${i}`);
  if (!el) return;
  el.value = val;
  el.className = 'qty-input filled';
  qtyCache[i] = String(val);
  updateSummary();
}

function adjustQty(i, delta) {
  const current = getQty(i) ?? 0;
  setQty(i, Math.max(0, current + delta));
}

function onQtyInput(i, input) {
  if (input.value === '') {
    input.className = 'qty-input';
    qtyCache[i] = '';
  } else {
    const v = Math.max(0, parseInt(input.value) || 0);
    input.value = v;
    input.className = 'qty-input filled';
    qtyCache[i] = String(v);
  }
  updateSummary();
}

function updateSummary() {
  const products = getProducts();
  const total  = products.length;
  const filled = products.filter((_, i) => getQty(i) !== null).length;
  const remain = total - filled;
  setText('sum-total',  total);
  setText('sum-filled', filled);
  setText('sum-remain', remain);
  const el = document.getElementById('sum-remain');
  if (el) el.style.color = remain === 0 ? 'var(--accent)' : 'var(--warn)';
  setText('items-left-label', t().itemsLeft(remain));
}

function addProduct() {
  const input = document.getElementById('new-product-input');
  const name  = input.value.trim();
  if (!name) return;
  const products = getProducts();
  if (products.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    input.style.borderColor = 'var(--danger)';
    setTimeout(() => { input.style.borderColor = ''; }, 1500);
    alert(t().duplicateWarning);
    return;
  }
  const newList = [...products, { name, custom: true }];
  setAndSaveProducts(newList);
  input.value = '';
  renderProducts();
  updateSummary();
}

function deleteProduct(i) {
  const products = getProducts();
  if (!confirm(t().deleteConfirm(products[i].name))) return;
  delete qtyCache[i];
  const keys = Object.keys(qtyCache).map(Number).filter(k => k > i);
  keys.sort((a,b) => a-b).forEach(k => {
    qtyCache[k-1] = qtyCache[k];
    delete qtyCache[k];
  });
  const newList = products.filter((_, idx) => idx !== i);
  setAndSaveProducts(newList);
  renderProducts();
  updateSummary();
}

function toggleManage() {
  manageMode = !manageMode;
  applyLang();
}

function goReview() {
  const L = t();
  hideAlert('alertBox');
  const staff = document.getElementById('f-staff').value.trim();
  const shift = document.getElementById('f-shift').value;
  if (!staff) { showAlert('alertBox', L.errStaff); return; }
  if (!shift) { showAlert('alertBox', L.errShift); return; }
  const products = getProducts();
  const counted  = products.filter((_, i) => getQty(i) !== null);
  if (counted.length === 0) { showAlert('alertBox', L.errProducts); return; }
  const shiftText = document.getElementById('f-shift').options[document.getElementById('f-shift').selectedIndex].text;
  setText('cf-date-val',    document.getElementById('f-date').value);
  setText('cf-shift-val',   shiftText);
  setText('cf-staff-val',   staff);
  setText('cf-station-val', station);
  document.getElementById('cf-stock-list').innerHTML = products.map((p, i) => {
    const qty = getQty(i);
    return `
      <div class="confirm-row">
        <div class="confirm-key" style="${p.custom ? 'color:var(--accent2)' : ''}">${escHtml(p.name)}</div>
        <div class="confirm-val${qty === null ? ' zero' : ''}">${qty !== null ? qty : L.notCounted}</div>
      </div>`;
  }).join('');
  showScreen('confirm');
}

function submitForm() {
  const products = getProducts();
  const staff    = document.getElementById('f-staff').value.trim();
  const shift    = document.getElementById('f-shift').value;
  const date     = document.getElementById('f-date').value;
  localStorage.setItem(LAST_NAME_KEY, staff);
  const items = products.map((p, i) => ({
    productName: p.name, isCustom: p.custom, qty: getQty(i),
  }));
  const payload = {
    formType:'cigaretteStockCheck', submittedAt:new Date().toISOString(),
    station, lang, date, shift, staffName:staff, items,
    totalProducts:products.length,
    countedProducts:items.filter(x=>x.qty!==null).length,
  };
  apRun({ key:'cigarette', url:SHEET_URL, button:'cf-submit-btn', buildPayload:()=>payload, onSaved:()=>onSuccess() });
}

function onSuccess() { showScreen('success'); }

function resetForm() {
  Object.keys(qtyCache).forEach(k => delete qtyCache[k]);
  getProducts().forEach((_, i) => {
    const el = document.getElementById(`qty_${i}`);
    if (el) { el.value = ''; el.className = 'qty-input'; }
  });
  document.getElementById('f-shift').value = '';
  document.getElementById('f-date').value  = todayStr();
  hideAlert('alertBox');
  updateSummary();
  initStaffField();
  showScreen('form');
}

function showAlert(id, msg) {
  const a = document.getElementById(id);
  Object.assign(a.style, { background:'var(--warn-bg)', borderColor:'var(--warn-border)', color:'var(--warn)' });
  a.textContent = msg;
  a.classList.add('show');
  a.scrollIntoView({ behavior:'smooth', block:'center' });
}
function hideAlert(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); }
function todayStr() { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function goPortal() { window.location.href = 'index.html'; }

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
if (!station) {
  document.getElementById('no-station-bar').classList.add('show');
  document.getElementById('station-bar').style.display  = 'none';
  document.getElementById('screen-form').style.display  = 'none';
}
document.querySelectorAll('.lang-btn').forEach(b => {
  b.classList.toggle('active',
    (lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文'));
});
document.getElementById('f-date').value = todayStr();
initStaffField();
applyLang();  // renders skeleton "Loading…" state first

// Load product list from server, then re-render
if (station) {
  loadProductsFromServer().then(() => {
    renderProducts();
    updateSummary();
  });
}
</script>
</body>
</html>
