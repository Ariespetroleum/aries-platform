<style>

body{background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:48px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.88);font-size:13px;cursor:pointer;padding:5px 10px 5px 0;border-right:1px solid rgba(255,255,255,.24);margin-right:4px;transition:opacity .15s}
.back-btn:hover{opacity:.8}
.back-arrow{font-size:16px;line-height:1}.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.header-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:#fff}
.header-sub{font-size:10px;color:rgba(255,255,255,.82);font-family:var(--mono);margin-top:1px;letter-spacing:.08em}

.lang-btn{padding:5px 10px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:none;background:transparent;transition:all .15s;letter-spacing:.04em}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.header-time{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.82)}

.station-dot{width:7px;height:7px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 0 4px rgba(0,166,81,.12);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.station-name span{color:var(--text);font-weight:800}
.container{max-width:540px;margin:0 auto;padding:20px 16px}
.form-header{margin-bottom:20px}

.form-sub{font-size:13px;color:var(--muted);line-height:1.5}
.steps{display:flex;gap:6px;margin-bottom:22px}
.step{flex:1;height:4px;border-radius:999px;background:var(--border);transition:background .3s}
.step.done{background:var(--bp-green)}.step.active{background:var(--liberty-blue)}

<body>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 13;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    // requestedAt = when this request was first created; retries keep it (the server refuses very old requests)
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), createdAt: Date.now(), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'
   + '#ap-ui.show{display:flex}#ap-box{background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit}'
   + '#ap-title{font-weight:800;font-size:17px;margin-bottom:8px}#ap-msg{font-size:14px;line-height:1.6;white-space:pre-line}'
   + '#ap-detail{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-word}'
   + '#ap-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}'
   + '#ap-btns button{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}'
   + '.ap-primary{background:#E60012;color:#fff}.ap-ghost{background:#eef0f3;color:#333}'
   + '.ap-spin{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#E60012;border-radius:50%;animation:apspin .7s linear infinite;vertical-align:middle;margin-right:8px}'
   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId, requestedAt:req.createdAt });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';
let station = localStorage.getItem('ap_station') || '';
let lang    = localStorage.getItem('ap_lang')    || 'en';

const STRINGS = {
  en:{pageTitle:'Temperature Log — Aries Petroleum',hBack:'Portal',hTitle:'Temperature Log',nsMsgNoStn:'No station selected. Please return to the portal first.',nsLink:'← Go to Portal',fTitle:'Temperature Log',fSub:'Record temperatures for all units — 3 shifts per day.',shifts:{morning:'☀️ Morning',afternoon:'🌤 Afternoon',night:'🌙 Night'},badges:{morning:'Morning Shift',afternoon:'Afternoon Shift',night:'Night Shift'},sigLabel:'Staff name',sigPh:'Enter your name',flagTitle:'⚠ Out-of-range readings',submitBtn:'Submit shift',fNote:'Saved to Google Sheets',successTitle:'All shifts submitted',successMsg:'All three shift temperature records have been saved.',succAlarm:'🚨 Persistent alarm (manager notified):',succSingle:'⚠ Single-shift exceedance:',succAgain:'Submit another day',succHome:'← Back to Portal',submitting:'Submitting…',shiftSaved:(s)=>`✓ ${s} shift saved. Continue with next shift.`,errSig:'Please enter your name before submitting.',errEmpty:(n)=>`${n} reading(s) still empty. Please fill all fields.`,errInvalid:'One or more readings contain invalid characters. Please enter numbers only (e.g. −18 or 3.5).',groups:{hot:'Hot Food',cold:'Refrigerated',frozen:'Frozen'},devices:{hot_pie:{name:'Hot Pie Warmer',note:'Min 60°C'},sandwich:{name:'Sandwich Fridge',note:'Max 5°C'},donut:{name:'Donut Display Fridge',note:'Max 5°C'},dairy:{name:'Milk & Dairy Fridge',note:'Max 5°C'},cool_room:{name:'Cool Room',note:'Max 5°C'},ice_cream:{name:'Ice Cream Freezer',note:'Max −15°C'},freezer:{name:'Chest Freezer',note:'Max −15°C'}},alarmTitle:'Persistent Temperature Alarm',alarmSub:'The following units have exceeded safe limits in 2+ shifts.\nNotify your manager immediately.',alarmAck:'I have notified my manager — continue',alarmNote:'Record will be flagged in Google Sheets.',alarmExceeded:'Exceeded',alarmTimes:'time(s)',alarmReading:'Readings:',alarmLimit:'Limit:',staffHint:'✎ Not you? Tap to change'},
  zh:{pageTitle:'温度记录 — Aries Petroleum',hBack:'首页',hTitle:'温度记录',nsMsgNoStn:'未选择站点，请先返回首页选择站点。',nsLink:'← 返回首页',fTitle:'温度记录',fSub:'每天三班次，记录所有设备温度。',shifts:{morning:'☀️ 早班',afternoon:'🌤 午班',night:'🌙 夜班'},badges:{morning:'早班',afternoon:'午班',night:'夜班'},sigLabel:'员工姓名',sigPh:'输入姓名',flagTitle:'⚠ 温度异常项目',submitBtn:'提交当前班次',fNote:'数据保存至 Google Sheets',successTitle:'三班次全部提交',successMsg:'所有温度记录已保存至 Google Sheets。',succAlarm:'🚨 持续异常（已通知主管）：',succSingle:'⚠ 单次超标：',succAgain:'再填一天',succHome:'← 返回首页',submitting:'提交中…',shiftSaved:(s)=>`✓ ${s}已保存，请继续填写下一班次。`,errSig:'请填写员工姓名。',errEmpty:(n)=>`还有 ${n} 项未填写，请全部填完再提交。`,errInvalid:'有输入内容包含无效字符，请只输入数字（如 −18 或 3.5）。',groups:{hot:'热食',cold:'冷藏',frozen:'冷冻'},devices:{hot_pie:{name:'热派保温柜',note:'不低于 60°C'},sandwich:{name:'三明治保鲜柜',note:'不超过 5°C'},donut:{name:'甜甜圈保鲜柜',note:'不超过 5°C'},dairy:{name:'鲜奶及奶制品柜',note:'不超过 5°C'},cool_room:{name:'冷藏室',note:'不超过 5°C'},ice_cream:{name:'冰淇淋冷冻柜',note:'不超过 −15°C'},freezer:{name:'卧式冷冻柜',note:'不超过 −15°C'}},alarmTitle:'温度持续异常 — 立即处理',alarmSub:'以下设备在 2 个或以上班次中超出安全范围，\n请立即通知主管。',alarmAck:'我已通知主管，继续提交',alarmNote:'记录将在 Google Sheets 中标记为需跟进。',alarmExceeded:'超标',alarmTimes:'次',alarmReading:'实测值：',alarmLimit:'限值：',staffHint:'✎ 不是你？点击更改'}
};

const DEVICES=[{key:'hot_pie',direction:'min_only',hotMin:60,max:null,group:'hot'},{key:'sandwich',direction:'max_only',hotMin:null,max:5,group:'cold'},{key:'donut',direction:'max_only',hotMin:null,max:5,group:'cold'},{key:'dairy',direction:'max_only',hotMin:null,max:5,group:'cold'},{key:'cool_room',direction:'max_only',hotMin:null,max:5,group:'cold'},{key:'ice_cream',direction:'max_only',hotMin:null,max:-15,group:'frozen'},{key:'freezer',direction:'max_only',hotMin:null,max:-15,group:'frozen'}];
const SHIFTS=['morning','afternoon','night'];
const GROUP_ORDER=['hot','cold','frozen'];
const GROUP_COLORS={hot:'#fcd34d',cold:'#22d3ee',frozen:'#a78bfa'};

let currentShift='morning';
let submitted={morning:false,afternoon:false,night:false};
let pendingRow=null,alarmCallback=null;

function t(){return STRINGS[lang];}

// ── Parse a temperature string robustly ──────────────────────────────────────
// Handles: "−18" (Unicode minus), "-18" (hyphen), "3.5", " 4 ", etc.
function parseTempValue(raw) {
  if (raw === '' || raw === null || raw === undefined) return NaN;
  // Replace Unicode minus (U+2212) and en-dash with ASCII hyphen
  const cleaned = String(raw).replace(/[\u2212\u2013]/g, '-').trim();
  // Allow only digits, hyphen at start, and one decimal point
  if (!/^-?\d*\.?\d+$/.test(cleaned)) return NaN;
  return parseFloat(cleaned);
}

// ── Staff name autofill (4hr expiry) ─────────────────────────────────────────
function getStaffName(){
  const name=localStorage.getItem('ap_staff_name')||'';
  const ts=parseInt(localStorage.getItem('ap_staff_name_ts')||'0');
  return(name&&ts&&(Date.now()-ts)<4*60*60*1000)?name:'';
}

function initStaffFields(){
  const name=getStaffName();
  SHIFTS.forEach(sh=>{
    const inp=document.getElementById('sig-'+sh);
    const hint=document.getElementById('hint-'+sh);
    if(!inp||!hint) return;
    if(name){
      inp.value=name;
      inp.readOnly=true;
      inp.style.background='var(--surface2)';
      inp.style.color='var(--muted)';
      hint.textContent=t().staffHint;
      hint.style.display='block';
      hint.onclick=(()=>{
        const i=inp; const h=hint;
        return ()=>{i.readOnly=false;i.style.background='';i.style.color='';i.value='';h.style.display='none';i.focus();};
      })();
    } else {
      inp.readOnly=false;inp.style.background='';inp.style.color='';hint.style.display='none';
    }
  });
}

function setLang(l){lang=l;localStorage.setItem('ap_lang',l);document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文'));});applyLang();}

function applyLang(){
  const s=t();
  document.title=s.pageTitle;
  document.getElementById('h-back').textContent=s.hBack;
  document.getElementById('h-title').textContent=s.hTitle;
  document.getElementById('ns-msg').textContent=s.nsMsgNoStn;
  document.getElementById('ns-link').textContent=s.nsLink;
  document.getElementById('f-title').textContent=s.fTitle;
  document.getElementById('f-sub').textContent=s.fSub;
  document.getElementById('submitBtn').textContent=s.submitBtn;
  document.getElementById('f-note').textContent=s.fNote;
  document.getElementById('flag-title').textContent=s.flagTitle;
  document.getElementById('succ-title').textContent=s.successTitle;
  document.getElementById('succ-again').textContent=s.succAgain;
  document.getElementById('succ-home').textContent=s.succHome;
  document.getElementById('alarm-title').textContent=s.alarmTitle;
  document.getElementById('alarm-sub').innerHTML=s.alarmSub.replace('\n','<br>');
  document.getElementById('alarm-ack-btn').textContent=s.alarmAck;
  document.getElementById('alarm-note').textContent=s.alarmNote;
  SHIFTS.forEach(sh=>{
    const tab=document.getElementById('tab-'+sh);
    tab.textContent=s.shifts[sh];
    if(submitted[sh]) tab.classList.add('done-tab');
    document.getElementById('badge-'+sh).textContent=s.badges[sh];
    document.getElementById('siglabel-'+sh).textContent=s.sigLabel;
    document.getElementById('sig-'+sh).placeholder=s.sigPh;
    const hint=document.getElementById('hint-'+sh);
    if(hint&&hint.style.display!=='none') hint.textContent=s.staffHint;
  });
  if(station) document.getElementById('station-display').innerHTML=`<span>${station}</span>`;
  SHIFTS.forEach(buildCard);
  updateFlags();
}

function buildCard(shift){
  const card=document.getElementById('card-'+shift);card.innerHTML='';const s=t();
  GROUP_ORDER.forEach((grp,gi)=>{
    const devs=DEVICES.filter(d=>d.group===grp);if(!devs.length)return;
    const hdr=document.createElement('div');hdr.className='card-group-label';hdr.style.color=GROUP_COLORS[grp];if(gi>0)hdr.style.borderTop='1px solid var(--border)';hdr.textContent=s.groups[grp];card.appendChild(hdr);
    devs.forEach(d=>{
      const dev=s.devices[d.key];const row=document.createElement('div');row.className='temp-row';
      const needsMinus = d.max !== null && d.max < 0;
      // All platforms use the ± button — most mobile keyboards don't reliably show a minus key.
      row.innerHTML=`<div class="device-info"><div class="device-name">${dev.name}</div><div class="device-range">${dev.note}</div></div><div class="temp-input-wrap"><button class="sign-btn${needsMinus?' negative':''}" id="sign_${shift}_${d.key}" onclick="toggleSign('${shift}','${d.key}')" type="button" tabindex="-1">±</button><div class="temp-input-inner"><input class="temp-input" type="text" inputmode="numeric" pattern="-?[0-9]*\\.?[0-9]*" id="${shift}_${d.key}" placeholder="—" autocomplete="off" oninput="validateTemp(this,'${shift}','${d.key}')"><span class="temp-unit">°C</span></div></div><div class="status-dot" id="dot_${shift}_${d.key}"></div>`;
      card.appendChild(row);
    });
  });
}

function getStatus(val,d){if(d.direction==='min_only'){if(val>=d.hotMin)return'ok';if(val>=d.hotMin-5)return'warn';return'danger';}if(val<=d.max)return'ok';if(val<=d.max+2)return'warn';return'danger';}

// ── ± button: toggle sign of current value ───────────────────────────────────
function toggleSign(shift, key) {
  const input = document.getElementById(shift + '_' + key);
  const btn   = document.getElementById('sign_' + shift + '_' + key);
  const raw   = input.value.trim();
  if (raw === '' || raw === '0') return;
  const val = parseTempValue(raw);
  if (isNaN(val)) return;
  const newVal = -val;
  // Display without unnecessary decimal for whole numbers
  input.value = Number.isInteger(newVal) ? String(newVal) : String(newVal);
  btn.classList.toggle('negative', newVal < 0);
  validateTemp(input, shift, key);
}

function validateTemp(input,shift,key){
  const d=DEVICES.find(x=>x.key===key);
  const dot=document.getElementById('dot_'+shift+'_'+key);
  const raw=input.value;
  // Empty — reset
  if(raw===''||raw==='-'){input.className='temp-input';dot.className='status-dot';return;}
  const val=parseTempValue(raw);
  if(isNaN(val)){input.className='temp-input';dot.className='status-dot';return;}
  // Sync sign button state
  const btn=document.getElementById('sign_'+shift+'_'+key);
  if(btn) btn.classList.toggle('negative', val<0);
  const st=getStatus(val,d);
  input.className='temp-input '+st;
  dot.className='status-dot '+st;
  updateFlags();
}

function updateFlags(){const s=t();const flags=[];SHIFTS.forEach(shift=>{DEVICES.forEach(d=>{const inp=document.getElementById(shift+'_'+d.key);if(!inp||inp.value==='')return;const val=parseTempValue(inp.value);if(isNaN(val))return;if(getStatus(val,d)==='danger')flags.push('['+s.badges[shift]+'] '+s.devices[d.key].name+': '+inp.value+'°C — '+s.devices[d.key].note);});});document.getElementById('flagItems').innerHTML=flags.map(f=>'<div class="flag-item"><span>⚠</span> '+f+'</div>').join('');document.getElementById('flagList').classList.toggle('show',flags.length>0);}

function getRepeatOffenders(){const counts={};DEVICES.forEach(d=>{counts[d.key]={count:0,shifts:[],values:[]};});const toCheck=[...new Set([...SHIFTS.filter(s=>submitted[s]),currentShift])];toCheck.forEach(shift=>{DEVICES.forEach(d=>{const inp=document.getElementById(shift+'_'+d.key);if(!inp||inp.value==='')return;const val=parseTempValue(inp.value);if(!isNaN(val)&&getStatus(val,d)==='danger'){counts[d.key].count++;counts[d.key].shifts.push(t().badges[shift]);counts[d.key].values.push(inp.value+'°C');}});});return DEVICES.filter(d=>counts[d.key].count>=2).map(d=>({device:d,...counts[d.key]}));}

function switchShift(shift){currentShift=shift;SHIFTS.forEach(s=>document.getElementById('sec-'+s).classList.toggle('active',s===shift));updateTabs();updateStepBar();document.getElementById('alertBox').classList.remove('show');}

function updateTabs(){const s=t();SHIFTS.forEach(sh=>{const tab=document.getElementById('tab-'+sh);tab.className='shift-tab';tab.textContent=s.shifts[sh];if(submitted[sh])tab.classList.add('done-tab');if(sh===currentShift)tab.classList.add('active-'+sh);});}

function updateStepBar(){SHIFTS.forEach((s,i)=>{const el=document.getElementById('step'+i);el.className=submitted[s]?'step done':s===currentShift?'step active':'step';});}

function submitShift(){
  const s=t();const sig=document.getElementById('sig-'+currentShift).value.trim();
  if(!sig){showAlert(s.errSig);return;}
  // Check for any invalid (non-numeric) entries
  const invalid=DEVICES.filter(d=>{const v=document.getElementById(currentShift+'_'+d.key).value;return v!==''&&isNaN(parseTempValue(v));});
  if(invalid.length){showAlert(s.errInvalid);return;}
  const missing=DEVICES.filter(d=>{const v=document.getElementById(currentShift+'_'+d.key).value;return v===''||isNaN(parseTempValue(v));}).length;
  if(missing){showAlert(s.errEmpty(missing));return;}
  const row={formType:'temperatureLog',submittedAt:new Date().toISOString(),station,date:todayStr(),shift:currentShift,signature:sig,lang};
  DEVICES.forEach(d=>{row[d.key]=parseTempValue(document.getElementById(currentShift+'_'+d.key).value);});
  showAlarmIfNeeded(row,()=>sendToSheets(row));
}

function sendToSheets(row){apRun({ key:'temperature-'+row.shift, url:SHEET_URL, button:'submitBtn', buildPayload:()=>row, onSaved:()=>onSuccess(row) });}

function onSuccess(row){
  const s=t();submitted[currentShift]=true;updateTabs();updateStepBar();
  const allDone=SHIFTS.every(sh=>submitted[sh]);
  if(allDone){showSuccessScreen();}
  else{const next=SHIFTS.find(sh=>!submitted[sh]);setAlert(s.shiftSaved(s.badges[row.shift]),'ok');document.getElementById('submitBtn').textContent=s.submitBtn;document.getElementById('submitBtn').disabled=false;if(next)switchShift(next);}
}

function showSuccessScreen(){
  const s=t();const offenders=getRepeatOffenders();const singleFlags=[];
  SHIFTS.forEach(shift=>{DEVICES.forEach(d=>{const inp=document.getElementById(shift+'_'+d.key);if(inp&&inp.classList.contains('danger')&&!offenders.find(o=>o.device.key===d.key))singleFlags.push(s.devices[d.key].name);});});
  let extra='';
  if(offenders.length)extra+=`<br><br><span style="color:#f87171">${s.succAlarm} ${offenders.map(o=>s.devices[o.device.key].name).join(', ')}</span>`;
  if(singleFlags.length)extra+=`<br><span style="color:#fb923c">${s.succSingle} ${[...new Set(singleFlags)].join(', ')}</span>`;
  document.getElementById('succ-msg').innerHTML=s.successMsg+extra;
  document.getElementById('formMain').style.display='none';
  document.getElementById('successScreen').classList.add('show');
}

function showAlarmIfNeeded(row,onClear){const offenders=getRepeatOffenders();if(!offenders.length){onClear();return;}const s=t();document.getElementById('alarm-items').innerHTML=offenders.map(o=>`<div class="alarm-item"><div class="alarm-item-name">⚠ ${s.devices[o.device.key].name}</div><div class="alarm-item-detail">${s.alarmExceeded} <span>${o.count} ${s.alarmTimes}</span> (${o.shifts.join(', ')}) — ${s.alarmReading} <span>${o.values.join(', ')}</span> — ${s.alarmLimit} ${s.devices[o.device.key].note}</div></div>`).join('');pendingRow=row;alarmCallback=()=>{row._alarmAcknowledged=true;onClear();};document.getElementById('alarmOverlay').classList.add('show');}

function ackAlarm(){document.getElementById('alarmOverlay').classList.remove('show');if(alarmCallback){alarmCallback();alarmCallback=null;}}

function showAlert(msg){setAlert(msg,'warn');}
function setAlert(msg,type){const a=document.getElementById('alertBox');if(type==='ok'){Object.assign(a.style,{background:'rgba(74,222,128,.08)',borderColor:'rgba(74,222,128,.25)',color:'var(--accent)'});}else{Object.assign(a.style,{background:'var(--warn-bg)',borderColor:'var(--warn-border)',color:'var(--warn)'});}a.textContent=msg;a.classList.add('show');}

function todayStr(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}
function goPortal(){window.location.href='index.html';}

function resetForm(){
  submitted={morning:false,afternoon:false,night:false};
  SHIFTS.forEach(sh=>{
    DEVICES.forEach(d=>{
      const inp=document.getElementById(sh+'_'+d.key);
      if(inp){inp.value='';inp.className='temp-input';}
      const dot=document.getElementById('dot_'+sh+'_'+d.key);
      if(dot)dot.className='status-dot';
      const btn=document.getElementById('sign_'+sh+'_'+d.key);
      if(btn){const needsMinus=d.max!==null&&d.max<0;btn.className='sign-btn'+(needsMinus?' negative':'');}
    });
  });
  document.getElementById('flagList').classList.remove('show');
  document.getElementById('alertBox').classList.remove('show');
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('formMain').style.display='block';
  document.getElementById('submitBtn').textContent=t().submitBtn;
  document.getElementById('submitBtn').disabled=false;
  initStaffFields();
  switchShift('morning');
}

function updateClock(){const n=new Date();document.getElementById('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
updateClock();setInterval(updateClock,10000);

// ── Init ──────────────────────────────────────────────────────────────────────
