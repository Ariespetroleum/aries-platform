<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Newspaper Returns — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117;--surface:#181c25;--surface2:#1f2433;--border:#2a3044;--border2:#353f58;
  --accent:#4ade80;--accent2:#22d3ee;--warn:#fb923c;--danger:#f87171;
  --text:#e8eaf0;--muted:#7a8299;--label:#a0aabb;
  --mono:'DM Mono',monospace;--sans:'Sora',sans-serif;
  --ok-bg:rgba(74,222,128,.08);--ok-border:rgba(74,222,128,.25);
  --warn-bg:rgba(251,146,60,.08);--warn-border:rgba(251,146,60,.3);
  --danger-bg:rgba(248,113,113,.08);--danger-border:rgba(248,113,113,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 10px 4px 0;border-right:1px solid var(--border);margin-right:2px;transition:color .15s;white-space:nowrap}
.back-btn:hover{color:var(--accent2)}
.header-title{font-size:13px;font-weight:600}
.header-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.lang-btn{padding:4px 9px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .15s}
.lang-btn.active{background:var(--border2);color:var(--text)}

.no-station{display:none;background:var(--danger-bg);border-bottom:1px solid var(--danger-border);padding:12px 16px;text-align:center}
.no-station.show{display:block}
.no-station-msg{font-size:13px;color:var(--danger);margin-bottom:8px}
.no-station-link{display:inline-block;background:var(--danger);color:#1a0000;font-size:12px;font-weight:600;padding:7px 16px;border-radius:7px;text-decoration:none}

.station-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px}
.station-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent2);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;color:var(--label)}
.station-name span{color:var(--text);font-weight:600}
.daily-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:rgba(34,211,238,.1);color:var(--accent2);border:1px solid rgba(34,211,238,.2)}

.container{max-width:520px;margin:0 auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}

.form-header{margin-bottom:20px}
.form-title{font-size:18px;font-weight:700;margin-bottom:4px}
.form-sub{font-size:12px;color:var(--muted);line-height:1.5}

/* ── Date navigator ── */
.date-nav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.nav-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.nav-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.date-center{flex:1;text-align:center}
.date-main{font-size:14px;font-weight:700}
.date-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.today-chip{font-size:10px;color:var(--accent);font-family:var(--mono);padding:2px 7px;border:1px solid var(--ok-border);border-radius:4px;background:var(--ok-bg);margin-top:3px;display:inline-block}
.today-btn{font-size:11px;color:var(--accent2);cursor:pointer;font-family:var(--mono);padding:4px 10px;border:1px solid rgba(34,211,238,.25);border-radius:5px;background:rgba(34,211,238,.06);transition:all .15s;white-space:nowrap;flex-shrink:0}
.today-btn:hover{background:rgba(34,211,238,.12)}

/* ── Week view toggle ── */
.week-toggle-btn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);font-family:var(--mono);cursor:pointer;text-align:center;transition:all .15s;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.week-toggle-btn:hover{border-color:var(--border2);color:var(--text)}
.week-toggle-btn.open{border-color:rgba(34,211,238,.3);color:var(--accent2);background:rgba(34,211,238,.05)}

/* ── Week summary panel ── */
.week-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.week-panel.show{display:block}
.week-panel-header{padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.week-panel-nav{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.week-panel-nav:hover{border-color:var(--accent2);color:var(--accent2)}
.week-panel-title{flex:1;text-align:center}
.week-panel-title-main{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.week-panel-title-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.week-panel-this{font-size:10px;color:var(--accent2);font-family:var(--mono);cursor:pointer;padding:2px 7px;border:1px solid rgba(34,211,238,.2);border-radius:4px;background:rgba(34,211,238,.06);transition:all .15s;white-space:nowrap}
.week-panel-this:hover{background:rgba(34,211,238,.12)}
.week-grid{overflow-x:auto}
.week-table{width:100%;border-collapse:collapse}
.week-table th{background:var(--surface2);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);color:var(--muted);padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.week-table th.paper-th{text-align:left;padding-left:12px;min-width:120px}
.week-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:12px;color:var(--label)}
.week-table td.paper-td{text-align:left;padding-left:12px;font-size:12px;font-weight:500;color:var(--text)}
.week-table td.today-td{background:rgba(34,211,238,.04);color:var(--accent2)}
.week-table td.total-td{font-weight:700;color:var(--accent)}
.week-table tr:last-child td{border-bottom:none}
.week-table tr.total-row td{background:var(--surface2);font-weight:700;color:var(--text);font-size:12px}
.week-table tr.total-row td.total-grand{color:var(--accent)}

/* ── Staff row ── */
.staff-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.field input:focus{border-color:var(--accent2)}
.field.full{grid-column:1/-1}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar-label{font-family:var(--mono);font-size:10px;color:var(--muted)}
.manage-btn{font-size:11px;cursor:pointer;font-family:var(--mono);padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap}
.manage-btn:hover{border-color:var(--border2);color:var(--text)}
.manage-btn.active{border-color:var(--danger-border);color:var(--danger);background:var(--danger-bg)}
.manage-banner{display:none;background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--danger);line-height:1.5}
.manage-banner.show{display:block}

/* ── Daily entry list ── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.section-header{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-header-left{display:flex;align-items:center;gap:8px}
.section-icon{font-size:14px}
.section-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.section-count{font-family:var(--mono);font-size:10px;color:var(--muted);padding:2px 7px;background:var(--surface);border:1px solid var(--border);border-radius:4px}

.entry-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px;transition:background .15s}
.entry-row:last-child{border-bottom:none}
.entry-row:focus-within{background:var(--surface2)}
.paper-name{flex:1;font-size:13px;font-weight:500;min-width:0}
.paper-name.custom{color:var(--accent2)}
.qty-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;line-height:1}
.qty-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.qty-input{width:52px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:14px;font-weight:600;padding:5px 6px;text-align:center;outline:none;transition:border-color .2s;-moz-appearance:textfield}
.qty-input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty-input:focus{border-color:var(--accent2)}
.qty-input.filled{border-color:var(--ok-border);background:var(--ok-bg);color:var(--accent)}
.delete-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--danger);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.delete-btn:hover{background:var(--danger);color:#fff}

.add-row{padding:10px 14px;display:none;gap:8px;align-items:center;border-top:1px solid var(--border);background:var(--surface2)}
.add-row.show{display:flex}
.add-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;transition:border-color .2s}
.add-input:focus{border-color:var(--accent2)}
.add-btn{background:var(--accent2);color:#071a17;border:none;border-radius:7px;font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0}
.add-btn:hover{opacity:.85}

.alert{display:none;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;line-height:1.5}
.alert.show{display:block}

.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:10px;font-family:var(--sans);font-size:14px;font-weight:600;padding:14px;cursor:pointer;letter-spacing:.02em;transition:opacity .18s,transform .1s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#071a0d}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface2);color:var(--label);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

/* ── Confirm ── */
.confirm-header{margin-bottom:18px}
.confirm-title{font-size:18px;font-weight:700;margin-bottom:4px}
.confirm-sub{font-size:12px;color:var(--muted)}
.confirm-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.confirm-section-title{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:8px 14px;border-bottom:1px solid var(--border);gap:12px;align-items:center}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:12px;color:var(--label);flex:1}
.confirm-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);flex-shrink:0}

.success-wrap{text-align:center;padding:56px 20px}
.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px}
.success-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:24px}
.success-actions{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}

.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,17,23,.85);align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted);font-family:var(--mono)}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Submitting…</div>
</div>

<div class="header">
  <div class="header-left">
    <div class="back-btn" onclick="goPortal()">
      <span style="font-size:15px">←</span>
      <span style="font-family:var(--mono);font-size:11px;letter-spacing:.04em" id="h-back">Portal</span>
    </div>
    <div>
      <div class="header-title" id="h-title">Newspaper Returns</div>
      <div class="header-sub"   id="h-sub">DAILY RECORD</div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="no-station" id="no-station-bar">
  <div class="no-station-msg" id="ns-msg"></div>
  <a class="no-station-link" href="index.html" id="ns-link"></a>
</div>

<div class="station-bar" id="station-bar">
  <div class="station-dot"></div>
  <div class="station-name" id="station-display"></div>
  <div class="daily-badge" id="daily-badge">DAILY</div>
</div>

<div class="container">

  <!-- ══ FORM ══ -->
  <div class="screen active" id="screen-form">

    <div class="form-header">
      <div class="form-title" id="f-title">Newspaper Returns</div>
      <div class="form-sub"   id="f-sub">Enter today's return quantities for each title.</div>
    </div>

    <!-- Date navigator -->
    <div class="date-nav">
      <button class="nav-btn" onclick="shiftDay(-1)">←</button>
      <div class="date-center">
        <div class="date-main" id="date-main"></div>
        <div class="date-sub"  id="date-sub"></div>
        <div id="today-chip-wrap"></div>
      </div>
      <div class="today-btn" id="today-btn" onclick="goToday()"></div>
      <button class="nav-btn" onclick="shiftDay(1)">→</button>
    </div>

    <!-- Week summary toggle -->
    <button class="week-toggle-btn" id="week-toggle-btn" onclick="toggleWeekPanel()"></button>

    <!-- Week summary panel -->
    <div class="week-panel" id="week-panel">
      <div class="week-panel-header">
        <button class="week-panel-nav" onclick="shiftWeekPanel(-1)">←</button>
        <div class="week-panel-title">
          <div class="week-panel-title-main" id="week-panel-label"></div>
          <div class="week-panel-title-sub"  id="week-panel-dates"></div>
        </div>
        <div class="week-panel-this" id="week-panel-this-btn" onclick="weekPanelGoThis()"></div>
        <button class="week-panel-nav" onclick="shiftWeekPanel(1)">→</button>
      </div>
      <div class="week-grid">
        <table class="week-table" id="week-table"></table>
      </div>
    </div>

    <!-- Staff -->
    <div class="staff-row">
      <div class="field">
        <label id="l-staff">Staff Name *</label>
        <input type="text" id="f-staff" placeholder="Your name">
      </div>
      <div class="field">
        <label id="l-notes">Notes</label>
        <input type="text" id="f-notes" placeholder="Optional">
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-label" id="toolbar-label"></div>
      <button class="manage-btn" id="manage-btn" onclick="toggleManage()"></button>
    </div>
    <div class="manage-banner" id="manage-banner"></div>

    <!-- Entry list -->
    <div class="section">
      <div class="section-header">
        <div class="section-header-left">
          <span class="section-icon">📰</span>
          <span class="section-title" id="sec-title">Titles</span>
        </div>
        <span class="section-count" id="sec-count"></span>
      </div>
      <div id="entry-list"></div>
      <div class="add-row" id="add-row">
        <input class="add-input" id="new-paper-input" type="text"
          onkeydown="if(event.key==='Enter')addPaper()">
        <button class="add-btn" id="add-btn" onclick="addPaper()">+ Add</button>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>
    <div class="btn-wrap">
      <button class="btn btn-primary" id="review-btn" onclick="goReview()"></button>
    </div>
  </div>

  <!-- ══ CONFIRM ══ -->
  <div class="screen" id="screen-confirm">
    <div class="confirm-header">
      <div class="confirm-title" id="cf-title"></div>
      <div class="confirm-sub"   id="cf-sub"></div>
    </div>
    <div class="confirm-section">
      <div class="confirm-section-title" id="cf-info-title"></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-date-label"></div><div class="confirm-val" id="cf-date-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-staff-label"></div><div class="confirm-val" id="cf-staff-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-station-label"></div><div class="confirm-val" id="cf-station-val"></div></div>
    </div>
    <div class="confirm-section">
      <div class="confirm-section-title" id="cf-returns-title"></div>
      <div id="cf-returns-list"></div>
    </div>
    <div class="alert" id="cf-alert"></div>
    <div class="btn-wrap">
      <button class="btn btn-secondary" id="cf-edit-btn"   onclick="showScreen('form')"></button>
      <button class="btn btn-primary"   id="cf-submit-btn" onclick="submitForm()"></button>
    </div>
    <p class="note" id="cf-note"></p>
  </div>

  <!-- ══ SUCCESS ══ -->
  <div class="screen" id="screen-success">
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <div class="success-title" id="succ-title"></div>
      <div class="success-sub"   id="succ-msg"></div>
      <div class="success-actions">
        <button class="btn btn-secondary" id="succ-again" onclick="resetForm()"></button>
        <button class="btn btn-secondary" id="succ-home"  onclick="goPortal()"></button>
      </div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let station    = localStorage.getItem('ap_station') || '';
let lang       = localStorage.getItem('ap_lang')    || 'en';
let manageMode = false;
let weekOpen   = false;
let dayOffset  = 0;   // 0 = today, -1 = yesterday, etc.
let weekPanelOffset = 0;  // 0 = this week, -1 = last week, etc.

// TODO: Paste your Google Apps Script Web App URL here when backend is ready.
// Leave blank during HTML/front-end testing.
const SHEET_URL = '';

// Week summary is designed to read real historical data from Google Sheets via Apps Script.
// While SHEET_URL is blank, the page uses local in-page cache for preview only.
// Future backend actions expected:
//   GET  ?action=getNewspaperWeeklySummary&station=...&weekOffset=...
//   POST { formType: 'newspaperReturns', ... }

// qty cache per paper per date: key = `${paperIdx}_${dateStr}`
const qtyCache = {};

// ══════════════════════════════════════════
// STRINGS
// ══════════════════════════════════════════
const S = {
  en: {
    pageTitle: 'Newspaper Returns — Aries Petroleum',
    hBack:'Portal', hTitle:'Newspaper Returns', hSub:'DAILY RECORD',
    nsMsgNoStn:'No station selected. Please return to the portal first.',

function t() { return S[lang]; }

// ══════════════════════════════════════════
// PAPERS — per station localStorage
// ══════════════════════════════════════════
const DEFAULT_PAPERS = ['Herald Sun','The Age','The Australian'];
function paperKey() { return `ap_news_${station}`; }
function loadPapers() {
  const saved = localStorage.getItem(paperKey());
  if (saved) { try { return JSON.parse(saved); } catch(e) {} }
  const list = DEFAULT_PAPERS.map(n => ({ name:n, custom:false }));
  savePapers(list); return list;
}
function savePapers(list) { localStorage.setItem(paperKey(), JSON.stringify(list)); }

// ══════════════════════════════════════════
// DATE HELPERS
// ══════════════════════════════════════════
function getActiveDate() {
  const d = new Date();
  d.setDate(d.getDate() + dayOffset);
  d.setHours(0,0,0,0);
  return d;
}
function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isToday(d) {
  const n = new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
}
function getWeekDates() {
  const now = new Date(); const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)); mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function formatDisplay(d) {
  return lang==='en'
    ? d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})
    : d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
}
function formatShort(d) {
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

}

// DATE NAV
// ══════════════════════════════════════════
function shiftDay(delta) {
  dayOffset += delta;
  updateDateDisplay();
  renderList();
  if (weekOpen) renderWeekPanel();
}
function goToday() {
  dayOffset = 0;
  updateDateDisplay();
  renderList();
  if (weekOpen) renderWeekPanel();
}
function updateDateDisplay() {
  const d = getActiveDate();
  const L = t();
  setText('date-main', formatDisplay(d));
  setText('date-sub',  dateStr(d));
  const chip = document.getElementById('today-chip-wrap');
  chip.innerHTML = isToday(d) ? `<span class="today-chip">${L.todayChip}</span>` : '';

// ══════════════════════════════════════════
// WEEK PANEL
// ══════════════════════════════════════════
function toggleWeekPanel() {
  weekOpen = !weekOpen;
  if (weekOpen) weekPanelOffset = 0;
  const L = t();
  const wb = document.getElementById('week-toggle-btn');
  wb.textContent = weekOpen ? L.weekClose : L.weekOpen;
  wb.className   = 'week-toggle-btn'+(weekOpen?' open':'');
  document.getElementById('week-panel').className = 'week-panel'+(weekOpen?' show':'');
  if (weekOpen) renderWeekPanel();
}

function shiftWeekPanel(delta) {
  weekPanelOffset += delta;
  // Don't allow going into the future beyond this week
  if (weekPanelOffset > 0) weekPanelOffset = 0;
  renderWeekPanel();
}

function weekPanelGoThis() {
  weekPanelOffset = 0;
  renderWeekPanel();
}

function getWeekDatesForPanel(offset) {
  const now = new Date(); const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+(offset*7));
  mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}

async function renderWeekPanel() {
  const L      = t();
  const dates  = getWeekDatesForPanel(weekPanelOffset);

  // Header label
  const isThisWeek = weekPanelOffset === 0;
  const isLastWeek = weekPanelOffset === -1;
  const label = isThisWeek
    ? (lang==='en' ? 'This Week' : '本周')
    : isLastWeek
      ? (lang==='en' ? 'Last Week' : '上周')
      : (lang==='en' ? `${Math.abs(weekPanelOffset)} weeks ago` : `${Math.abs(weekPanelOffset)} 周前`);

  setText('week-panel-label', label);
  setText('week-panel-dates', `${formatShort(dates[0])} – ${formatShort(dates[6])}`);
  const thisBtn = document.getElementById('week-panel-this-btn');
  thisBtn.textContent = L.weekPanelThisBtn;
  thisBtn.style.display = isThisWeek ? 'none' : '';

  // If Apps Script URL is set, try to load real historical data from Google Sheets.
  // If the request fails or SHEET_URL is blank, fall back to local preview cache.
  if (SHEET_URL) {
    const loaded = await renderWeekPanelFromSheet();
    if (loaded) return;
  }

  renderWeekPanelFromLocalCache();
}

async function renderWeekPanelFromSheet() {
  try {
    const url = `${SHEET_URL}?action=getNewspaperWeeklySummary&station=${encodeURIComponent(station)}&weekOffset=${weekPanelOffset}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || data.success !== true || !Array.isArray(data.items)) return false;

    const L = t();
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    let html = '<thead><tr>';
    html += `<th class="paper-th">${lang==='en'?'Title':'报纸'}</th>`;
    days.forEach((key, i) => {
      html += `<th>${L.days[i]}<br><span style="font-weight:400;font-size:9px">${key}</span></th>`;
    });
    html += `<th>${L.total}</th></tr></thead><tbody>`;

    data.items.forEach(item => {
      html += `<tr><td class="paper-td">${escHtml(item.paperName || '')}</td>`;
      days.forEach(key => {
        const v = item[key];
        html += `<td>${v !== null && v !== undefined && v !== '' ? v : '—'}</td>`;
      });
      html += `<td class="total-td">${item.total ? item.total : '—'}</td></tr>`;
    });

    html += '</tbody>';
    document.getElementById('week-table').innerHTML = html;
    return true;
  } catch (err) {
    return false;
  }
}

function renderWeekPanelFromLocalCache() {
  const L      = t();
  const papers = loadPapers();
  const dates  = getWeekDatesForPanel(weekPanelOffset);

  let html = '<thead><tr>';
  html += `<th class="paper-th">${lang==='en'?'Title':'报纸'}</th>`;
  dates.forEach((d,i) => {
    const today = isToday(d);
    html += `<th style="${today?'color:var(--accent2)':''}">${L.days[i]}<br><span style="font-weight:400;font-size:9px">${formatShort(d)}</span></th>`;
  });
  html += `<th>${L.total}</th></tr></thead><tbody>`;

  papers.forEach((p,pi) => {
    let rowTotal = 0;
    html += `<tr><td class="paper-td">${escHtml(p.name)}</td>`;
    dates.forEach((d) => {
      const ds  = dateStr(d);
      const key = `${pi}_${ds}`;
      const v   = qtyCache[key] ?? null;
      const today = isToday(d);
      html += `<td class="${today?'today-td':''}">${v !== null ? v : '—'}</td>`;
      if (v !== null) rowTotal += v;
    });
    html += `<td class="total-td">${rowTotal > 0 ? rowTotal : '—'}</td></tr>`;
  });

  html += `<tr class="total-row"><td class="paper-td">${L.total}</td>`;
  let grandTotal = 0;
  dates.forEach((d) => {
    const ds = dateStr(d);
    let dayTotal = 0;
    papers.forEach((_,pi) => {
      const v = qtyCache[`${pi}_${ds}`] ?? null;
      if (v !== null) dayTotal += v;
    });
    grandTotal += dayTotal;
    const today = isToday(d);
    html += `<td style="${today?'color:var(--accent2)':''}">${dayTotal > 0 ? dayTotal : '—'}</td>`;
  });
  html += `<td class="total-grand">${grandTotal > 0 ? grandTotal : '—'}</td></tr>`;
  html += '</tbody>';
  document.getElementById('week-table').innerHTML = html;
}

// ══════════════════════════════════════════
// DAILY ENTRY LIST
// ══════════════════════════════════════════
function renderList() {
  const papers = loadPapers();
  const ds     = dateStr(getActiveDate());
  const L      = t();

  document.getElementById('entry-list').innerHTML = papers.map((p,pi) => {
    const key    = `${pi}_${ds}`;
    const cached = qtyCache[key] ?? '';
    const filled = cached !== '';
    const delBtn = manageMode
      ? `<button class="delete-btn" onclick="deletePaper(${pi})">✕</button>`
      : '';
    return `<div class="entry-row">
      <div class="paper-name${p.custom?' custom':''}">${escHtml(p.name)}</div>
      <div class="qty-wrap">
        ${manageMode ? '' : `
          <button class="qty-btn" onclick="adjustQty(${pi},'${ds}',-1)">−</button>
          <input class="qty-input${filled?' filled':''}" type="number"
            id="qty_${pi}" min="0" value="${filled?cached:''}" placeholder="—"
            oninput="onQtyInput(${pi},'${ds}',this)">
          <button class="qty-btn" onclick="adjustQty(${pi},'${ds}',1)">+</button>
        `}
        ${delBtn}
      </div>
    </div>`;
  }).join('');

  setText('sec-count', L.secCount(papers.length));
}

// ══════════════════════════════════════════
// QTY
// ══════════════════════════════════════════
function getQty(pi, ds) {
  const el = document.getElementById(`qty_${pi}`);
  if (el && el.value !== '') return parseInt(el.value)||0;
  const cached = qtyCache[`${pi}_${ds}`];
  return cached !== undefined ? cached : null;
}

function setQty(pi, ds, val) {
  qtyCache[`${pi}_${ds}`] = val;
  const el = document.getElementById(`qty_${pi}`);
  if (el) { el.value = val; el.className = 'qty-input filled'; }
  if (weekOpen) renderWeekPanel();
}

function adjustQty(pi, ds, delta) {
  const cur = getQty(pi, ds) ?? 0;
  setQty(pi, ds, Math.max(0, cur + delta));
}

function onQtyInput(pi, ds, input) {
  if (input.value === '') {
    delete qtyCache[`${pi}_${ds}`];
    input.className = 'qty-input';
  } else {
    const v = Math.max(0, parseInt(input.value)||0);
    input.value = v;
    input.className = 'qty-input filled';
    qtyCache[`${pi}_${ds}`] = v;
  }
  if (weekOpen) renderWeekPanel();
}

// ══════════════════════════════════════════
// ADD / DELETE
// ══════════════════════════════════════════
function addPaper() {
  const input = document.getElementById('new-paper-input');
  const name  = input.value.trim();
  if (!name) return;
  const papers = loadPapers();
  if (papers.some(p => p.name.toLowerCase()===name.toLowerCase())) {
    input.style.borderColor='var(--danger)';
    setTimeout(()=>{ input.style.borderColor=''; },1500);
    return;
  }
  papers.push({name, custom:true});
  savePapers(papers);
  input.value='';
  renderList();
  if (weekOpen) renderWeekPanel();
}

function deletePaper(pi) {
  const papers = loadPapers();
  if (!confirm(t().deleteConfirm(papers[pi].name))) return;
  // Remove all cache entries for this paper
  Object.keys(qtyCache).forEach(k => {
    if (k.startsWith(`${pi}_`)) delete qtyCache[k];
  });
  // Shift cache indices
  Object.keys(qtyCache).forEach(k => {
    const [p,ds] = k.split('_');
    if (parseInt(p) > pi) {
      qtyCache[`${parseInt(p)-1}_${ds}`] = qtyCache[k];
      delete qtyCache[k];
    }
  });
  papers.splice(pi, 1);
  savePapers(papers);
  renderList();
  if (weekOpen) renderWeekPanel();
}

// ══════════════════════════════════════════
// REVIEW
// ══════════════════════════════════════════
function goReview() {
  const L = t();
  hideAlert('alertBox');
  const staff = document.getElementById('f-staff').value.trim();
  if (!staff) { showAlert('alertBox', L.errStaff); return; }

  const papers = loadPapers();
  const ds     = dateStr(getActiveDate());
  const hasData = papers.some((_,pi) => getQty(pi,ds) !== null);
  if (!hasData) { showAlert('alertBox', L.errNoData); return; }

  setText('cf-date-val',    formatDisplay(getActiveDate()));
  setText('cf-staff-val',   staff);
  setText('cf-station-val', station);

  let rows = '';
  papers.forEach((p,pi) => {
    const v = getQty(pi, ds);
    if (v !== null) {
      rows += `<div class="confirm-row">
        <div class="confirm-key">${escHtml(p.name)}</div>
        <div class="confirm-val">${v}</div>
      </div>`;
    }
  });
  document.getElementById('cf-returns-list').innerHTML = rows;
  showScreen('confirm');
}

// ══════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════
function submitForm() {
  const L      = t();
  const papers = loadPapers();
  const d      = getActiveDate();
  const ds     = dateStr(d);
  const staff  = document.getElementById('f-staff').value.trim();
  const notes  = document.getElementById('f-notes').value.trim();

  const items = papers.map((p,pi) => ({
    paperName: p.name,
    isCustom:  p.custom,
    qty:       getQty(pi, ds),
  })).filter(x => x.qty !== null);

  const payload = {
    formType:    'newspaperReturns',
    submittedAt: new Date().toISOString(),
    station, lang,
    date:        ds,
    dayOfWeek:   L.daysFull[d.getDay()===0?6:d.getDay()-1],
    staffName:   staff,
    notes,
    items,
    totalReturns: items.reduce((s,x)=>s+x.qty, 0),
  };

  document.getElementById('loading-text').textContent = L.submitting;
  document.getElementById('loadingOverlay').classList.add('show');

  if (!SHEET_URL) {
    // Front-end preview mode only. Paste Apps Script URL into SHEET_URL when backend is ready.
    setTimeout(() => onSuccess(), 400);
    return;
  }

  fetch(SHEET_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  })
  .then(()=>onSuccess())
  .catch(()=>onSuccess());
}

function onSuccess() {
  document.getElementById('loadingOverlay').classList.remove('show');
  showScreen('success');
}

// ══════════════════════════════════════════

function resetForm() {
  dayOffset = 0;
  document.getElementById('f-staff').value = '';
  document.getElementById('f-notes').value = '';
  hideAlert('alertBox');
  updateDateDisplay();
  renderList();
  if (weekOpen) renderWeekPanel();
  showScreen('form');
}
