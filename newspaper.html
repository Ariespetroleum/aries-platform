<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Newspaper Returns — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sinopec-red:#E60012;--sinopec-red-dark:#B8000E;--bp-green:#00A651;--bp-green-dark:#007A3D;--liberty-blue:#003DA5;--liberty-blue-dark:#002A73;--liberty-red:#CE1126;--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#EEF2F6;--border:#DDE3EA;--border2:#C9D2DD;--accent:var(--bp-green);--accent2:var(--liberty-blue);--warn:var(--sinopec-red);--danger:var(--sinopec-red);--text:#142033;--muted:#667085;--label:#344054;--mono:'DM Mono',monospace;--sans:'Sora',sans-serif;--ok-bg:#ECFDF3;--ok-border:#B7E4C7;--warn-bg:#EFF6FF;--warn-border:#BFDBFE;--danger-bg:#FFF1F2;--danger-border:#FDA4AF;--radius:16px;--radius-sm:10px;--shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.88);font-size:13px;cursor:pointer;padding:5px 10px 5px 0;border-right:1px solid rgba(255,255,255,.24);margin-right:2px;transition:opacity .15s;white-space:nowrap}
.back-btn:hover{opacity:.8}
.header-title{font-size:14px;font-weight:800;color:#fff}.header-sub{font-size:10px;color:rgba(255,255,255,.82);font-family:var(--mono);margin-top:1px;letter-spacing:.08em}
.header-right{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.lang-btn{padding:5px 10px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:none;background:transparent;transition:all .15s}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.no-station{display:none;background:var(--danger-bg);border-bottom:1px solid var(--danger-border);padding:12px 16px;text-align:center}
.no-station.show{display:block}
.no-station-msg{font-size:13px;color:var(--sinopec-red-dark);margin-bottom:8px;font-weight:700}
.no-station-link{display:inline-block;background:var(--sinopec-red);color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:9px;text-decoration:none}
.station-bar{background:#fff;border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.station-dot{width:7px;height:7px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 0 4px rgba(0,166,81,.12);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;color:var(--muted)}.station-name span{color:var(--text);font-weight:700}
.daily-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:#EFF6FF;color:var(--liberty-blue);border:1px solid #BFDBFE}
.container{max-width:540px;margin:0 auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}
.form-header{margin-bottom:20px}
.form-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}
.form-sub{font-size:13px;color:var(--muted);line-height:1.5}
.date-nav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.nav-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--label);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.nav-btn:hover{border-color:var(--liberty-blue);color:var(--liberty-blue)}
.date-center{flex:1;text-align:center}.date-main{font-size:15px;font-weight:800;color:var(--text)}.date-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.today-chip{font-size:10px;color:var(--bp-green-dark);font-family:var(--mono);font-weight:800;padding:2px 7px;border:1px solid var(--ok-border);border-radius:5px;background:var(--ok-bg);margin-top:4px;display:inline-block}
.today-btn{font-size:11px;color:var(--liberty-blue);cursor:pointer;font-family:var(--mono);font-weight:700;padding:6px 10px;border:1px solid #BFDBFE;border-radius:7px;background:#EFF6FF;transition:all .15s;white-space:nowrap;flex-shrink:0}
.today-btn:hover{background:#DBEAFE}
.week-toggle-btn{width:100%;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:12px;color:var(--muted);font-family:var(--mono);font-weight:700;cursor:pointer;text-align:center;transition:all .15s;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow-sm)}
.week-toggle-btn:hover{border-color:var(--border2);color:var(--text)}.week-toggle-btn.open{border-color:#BFDBFE;color:var(--liberty-blue);background:#EFF6FF}
.week-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}.week-panel.show{display:block}
.week-panel-header{padding:9px 10px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.week-panel-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--label);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.week-panel-nav:hover{border-color:var(--liberty-blue);color:var(--liberty-blue)}
.week-panel-title{flex:1;text-align:center}.week-panel-title-main{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}.week-panel-title-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.week-panel-this{font-size:10px;color:var(--liberty-blue);font-family:var(--mono);font-weight:700;cursor:pointer;padding:3px 7px;border:1px solid #BFDBFE;border-radius:6px;background:#EFF6FF;transition:all .15s;white-space:nowrap}.week-panel-this:hover{background:#DBEAFE}
.week-grid{overflow-x:auto}.week-table{width:100%;border-collapse:collapse}
.week-table th{background:var(--surface2);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);color:var(--muted);padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.week-table th.paper-th{text-align:left;padding-left:12px;min-width:120px}
.week-table td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:12px;color:var(--label)}
.week-table td.paper-td{text-align:left;padding-left:12px;font-size:12px;font-weight:700;color:var(--text)}.week-table td.today-td{background:#EFF6FF;color:var(--liberty-blue)}.week-table td.total-td{font-weight:800;color:var(--bp-green-dark)}.week-table tr:last-child td{border-bottom:none}.week-table tr.total-row td{background:var(--surface2);font-weight:800;color:var(--text);font-size:12px}.week-table tr.total-row td.total-grand{color:var(--bp-green-dark)}
.staff-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono);font-weight:700}
.field input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.field input:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}
.field.full{grid-column:1/-1}
.staff-hint{font-size:11px;color:var(--liberty-blue);margin-top:4px;cursor:pointer;font-family:var(--mono)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.toolbar-label{font-family:var(--mono);font-size:10px;color:var(--muted)}
.manage-btn{font-size:11px;cursor:pointer;font-family:var(--mono);font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--muted);transition:all .15s;white-space:nowrap}
.manage-btn:hover{border-color:var(--border2);color:var(--text)}.manage-btn.active{border-color:var(--danger-border);color:var(--sinopec-red);background:var(--danger-bg)}
.manage-banner{display:none;background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--sinopec-red-dark);line-height:1.5;font-weight:600}.manage-banner.show{display:block}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.section-header{padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-header-left{display:flex;align-items:center;gap:8px}.section-icon{font-size:15px}.section-title{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}.section-count{font-family:var(--mono);font-size:10px;color:var(--muted);padding:3px 7px;background:#fff;border:1px solid var(--border);border-radius:6px}
.entry-row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);gap:10px;transition:background .15s}.entry-row:last-child{border-bottom:none}.entry-row:focus-within{background:var(--surface2)}
.paper-name{flex:1;font-size:13px;font-weight:700;min-width:0;color:var(--text)}.paper-name.custom{color:var(--liberty-blue)}
.qty-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--label);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;line-height:1}
.qty-btn:hover{border-color:var(--liberty-blue);color:var(--liberty-blue)}
.qty-input{width:54px;background:#fff;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;font-weight:800;padding:6px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield}
.qty-input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty-input:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}.qty-input.filled{border-color:var(--ok-border);background:var(--ok-bg);color:var(--bp-green-dark)}
.delete-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--sinopec-red);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}.delete-btn:hover{background:var(--sinopec-red);color:#fff}
.add-row{padding:10px 14px;display:none;gap:8px;align-items:center;border-top:1px solid var(--border);background:var(--surface2)}.add-row.show{display:flex}
.add-input{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s}.add-input:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}
.add-btn{background:var(--liberty-blue);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-size:12px;font-weight:800;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0}.add-btn:hover{opacity:.9}
.alert{display:none;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px;line-height:1.5;font-weight:700}.alert.show{display:block}
.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:800;padding:14px;cursor:pointer;letter-spacing:.02em;transition:opacity .18s,transform .1s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--bp-green),var(--bp-green-dark));color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.20)}.btn-primary:hover{opacity:.92}
.btn-secondary{background:#fff;color:var(--label);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.confirm-header{margin-bottom:18px}.confirm-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}.confirm-sub{font-size:13px;color:var(--muted)}
.confirm-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.confirm-section-title{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:9px 14px;border-bottom:1px solid var(--border);gap:12px;align-items:center}.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:12px;color:var(--label);flex:1;font-weight:600}.confirm-val{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--text);flex-shrink:0}
.success-wrap{text-align:center;padding:56px 20px}
.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px;color:var(--bp-green-dark);font-weight:800}
.success-title{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--bp-green-dark)}.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:24px}
.success-actions{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:16px}.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--bp-green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#fff;font-family:var(--mono);font-weight:700}
@media(max-width:420px){.container{padding:18px 12px}.staff-row{grid-template-columns:1fr}.date-nav{gap:6px;padding:10px}.today-btn{padding:6px 8px}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Submitting…</div></div>

<div class="header">
  <div class="header-left">
    <div class="back-btn" onclick="goPortal()">
      <span style="font-size:15px">←</span>
      <span style="font-family:var(--mono);font-size:11px;letter-spacing:.04em" id="h-back">Portal</span>
    </div>
    <div><div class="header-title" id="h-title">Newspaper Returns</div><div class="header-sub" id="h-sub">DAILY RECORD</div></div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="no-station" id="no-station-bar"><div class="no-station-msg" id="ns-msg"></div><a class="no-station-link" href="index.html" id="ns-link"></a></div>
<div class="station-bar" id="station-bar"><div class="station-dot"></div><div class="station-name" id="station-display"></div><div class="daily-badge" id="daily-badge">DAILY</div></div>

<div class="container">
  <div class="screen active" id="screen-form">
    <div class="form-header"><div class="form-title" id="f-title">Newspaper Returns</div><div class="form-sub" id="f-sub">Enter today's return quantities for each title.</div></div>

    <div class="date-nav">
      <button class="nav-btn" onclick="shiftDay(-1)">←</button>
      <div class="date-center"><div class="date-main" id="date-main"></div><div class="date-sub" id="date-sub"></div><div id="today-chip-wrap"></div></div>
      <div class="today-btn" id="today-btn" onclick="goToday()"></div>
      <button class="nav-btn" onclick="shiftDay(1)">→</button>
    </div>

    <button class="week-toggle-btn" id="week-toggle-btn" onclick="toggleWeekPanel()"></button>
    <div class="week-panel" id="week-panel">
      <div class="week-panel-header">
        <button class="week-panel-nav" onclick="shiftWeekPanel(-1)">←</button>
        <div class="week-panel-title"><div class="week-panel-title-main" id="week-panel-label"></div><div class="week-panel-title-sub" id="week-panel-dates"></div></div>
        <div class="week-panel-this" id="week-panel-this-btn" onclick="weekPanelGoThis()"></div>
        <button class="week-panel-nav" onclick="shiftWeekPanel(1)">→</button>
      </div>
      <div class="week-grid"><table class="week-table" id="week-table"></table></div>
    </div>

    <div class="staff-row">
      <div class="field">
        <label id="l-staff">Staff Name *</label>
        <input type="text" id="f-staff" placeholder="Your name">
        <div id="staff-hint" class="staff-hint" style="display:none"></div>
      </div>
      <div class="field"><label id="l-notes">Notes</label><input type="text" id="f-notes" placeholder="Optional"></div>
    </div>

    <div class="toolbar"><div class="toolbar-label" id="toolbar-label"></div><button class="manage-btn" id="manage-btn" onclick="toggleManage()"></button></div>
    <div class="manage-banner" id="manage-banner"></div>

    <div class="section">
      <div class="section-header"><div class="section-header-left"><span class="section-icon">📰</span><span class="section-title" id="sec-title">Titles</span></div><span class="section-count" id="sec-count"></span></div>
      <div id="entry-list"></div>
      <div class="add-row" id="add-row"><input class="add-input" id="new-paper-input" type="text" onkeydown="if(event.key==='Enter')addPaper()"><button class="add-btn" id="add-btn" onclick="addPaper()">+ Add</button></div>
    </div>

    <div class="alert" id="alertBox"></div>
    <div class="btn-wrap"><button class="btn btn-primary" id="review-btn" onclick="goReview()"></button></div>
  </div>

  <div class="screen" id="screen-confirm">
    <div class="confirm-header"><div class="confirm-title" id="cf-title"></div><div class="confirm-sub" id="cf-sub"></div></div>
    <div class="confirm-section">
      <div class="confirm-section-title" id="cf-info-title"></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-date-label"></div><div class="confirm-val" id="cf-date-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-staff-label"></div><div class="confirm-val" id="cf-staff-val"></div></div>
      <div class="confirm-row"><div class="confirm-key" id="cf-station-label"></div><div class="confirm-val" id="cf-station-val"></div></div>
    </div>
    <div class="confirm-section"><div class="confirm-section-title" id="cf-returns-title"></div><div id="cf-returns-list"></div></div>
    <div class="alert" id="cf-alert"></div>
    <div class="btn-wrap"><button class="btn btn-secondary" id="cf-edit-btn" onclick="showScreen('form')"></button><button class="btn btn-primary" id="cf-submit-btn" onclick="submitForm()"></button></div>
    <p class="note" id="cf-note"></p>
  </div>

  <div class="screen" id="screen-success">
    <div class="success-wrap"><div class="success-icon">✓</div><div class="success-title" id="succ-title"></div><div class="success-sub" id="succ-msg"></div>
      <div class="success-actions"><button class="btn btn-secondary" id="succ-again" onclick="resetForm()"></button><button class="btn btn-secondary" id="succ-home" onclick="goPortal()"></button></div>
    </div>
  </div>
</div>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 14;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',

function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    // requestedAt = when this request was first created; retries keep it (the server refuses very old requests)
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), createdAt: Date.now(), extra: makeExtra ? makeExtra() : null };

async function apSubmit(url, payload, opts){
  opts = opts || {};

  const ctrl = new AbortController();

    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });

  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };

      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

  apEnsureUi();

  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);

    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId, requestedAt:req.createdAt });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}

function onQtyInput(pi,ds,input){if(input.value===''){delete qtyCache[`${pi}_${ds}`];input.className='qty-input';}else{const v=Math.max(0,parseInt(input.value)||0);input.value=v;input.className='qty-input filled';qtyCache[`${pi}_${ds}`]=v;}if(weekOpen)renderWeekPanel();}

// ── Add / Delete ──────────────────────────────────────────────────────────────
function addPaper(){const input=document.getElementById('new-paper-input');const name=input.value.trim();if(!name)return;const papers=loadPapers();if(papers.some(p=>p.name.toLowerCase()===name.toLowerCase())){input.style.borderColor='var(--danger)';setTimeout(()=>{input.style.borderColor='';},1500);return;}papers.push({name,custom:true});savePapers(papers);input.value='';renderList();if(weekOpen)renderWeekPanel();}
function deletePaper(pi){const papers=loadPapers();if(!confirm(t().deleteConfirm(papers[pi].name)))return;Object.keys(qtyCache).forEach(k=>{if(k.startsWith(`${pi}_`))delete qtyCache[k];});Object.keys(qtyCache).forEach(k=>{const[p,ds]=k.split('_');if(parseInt(p)>pi){qtyCache[`${parseInt(p)-1}_${ds}`]=qtyCache[k];delete qtyCache[k];}});papers.splice(pi,1);savePapers(papers);renderList();if(weekOpen)renderWeekPanel();}
function toggleManage(){manageMode=!manageMode;applyLang();}

// ── Review / Submit ───────────────────────────────────────────────────────────
function goReview(){
  const L=t();hideAlert('alertBox');const staff=document.getElementById('f-staff').value.trim();if(!staff){showAlert('alertBox',L.errStaff);return;}
  const papers=loadPapers();const ds=dateStr(getActiveDate());const hasData=papers.some((_,pi)=>getQty(pi,ds)!==null);if(!hasData){showAlert('alertBox',L.errNoData);return;}
  setText('cf-date-val',formatDisplay(getActiveDate()));setText('cf-staff-val',staff);setText('cf-station-val',station);
  let rows='';papers.forEach((p,pi)=>{const v=getQty(pi,ds);if(v!==null)rows+=`<div class="confirm-row"><div class="confirm-key">${escHtml(p.name)}</div><div class="confirm-val">${v}</div></div>`;});
  document.getElementById('cf-returns-list').innerHTML=rows;showScreen('confirm');
}
function submitForm(){
  const L=t();const papers=loadPapers();const d=getActiveDate();const ds=dateStr(d);const staff=document.getElementById('f-staff').value.trim();const notes=document.getElementById('f-notes').value.trim();
  const items=papers.map((p,pi)=>({paperName:p.name,isCustom:p.custom,qty:getQty(pi,ds)})).filter(x=>x.qty!==null);
  const payload={formType:'newspaperReturns',submittedAt:new Date().toISOString(),station,lang,date:ds,dayOfWeek:L.daysFull[d.getDay()===0?6:d.getDay()-1],staffName:staff,notes,items,totalReturns:items.reduce((s,x)=>s+x.qty,0)};
  apRun({ key:'newspaper', url:SHEET_URL, button:'cf-submit-btn', buildPayload:()=>payload, onSaved:()=>onSuccess() });
}
function onSuccess(){showScreen('success');}

function resetForm(){
  dayOffset=0;document.getElementById('f-notes').value='';hideAlert('alertBox');
  initStaffField();updateDateDisplay();renderList();if(weekOpen)renderWeekPanel();showScreen('form');
}

function showScreen(id){document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));document.getElementById(`screen-${id}`).classList.add('active');window.scrollTo(0,0);}
function showAlert(id,msg){const a=document.getElementById(id);Object.assign(a.style,{background:'var(--warn-bg)',borderColor:'var(--warn-border)',color:'var(--warn)'});a.textContent=msg;a.classList.add('show');a.scrollIntoView({behavior:'smooth',block:'center'});}
function hideAlert(id){const el=document.getElementById(id);if(el)el.classList.remove('show');}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function goPortal(){window.location.href='index.html';}

if(!station){document.getElementById('no-station-bar').classList.add('show');document.getElementById('station-bar').style.display='none';document.getElementById('screen-form').style.display='none';}
document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文'));});
initStaffField();
applyLang();
</script>
</body>
