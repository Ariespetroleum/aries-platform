<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Refund Record — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sinopec-red:#E60012;--sinopec-red-dark:#B8000E;--bp-green:#00A651;--bp-green-dark:#007A3D;--liberty-blue:#003DA5;--liberty-blue-dark:#002A73;--liberty-red:#CE1126;--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#EEF2F6;--border:#DDE3EA;--border2:#C9D2DD;--accent:var(--bp-green);--accent2:var(--liberty-blue);--warn:var(--sinopec-red);--danger:var(--sinopec-red);--text:#142033;--muted:#667085;--label:#344054;--mono:'DM Mono',monospace;--sans:'Sora',sans-serif;--ok-bg:#ECFDF3;--ok-border:#B7E4C7;--warn-bg:#EFF6FF;--warn-border:#BFDBFE;--danger-bg:#FFF1F2;--danger-border:#FDA4AF;--radius:16px;--radius-sm:10px;--shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.88);font-size:13px;cursor:pointer;padding:5px 10px 5px 0;border-right:1px solid rgba(255,255,255,.24);margin-right:2px;transition:opacity .15s;white-space:nowrap}
.back-btn:hover{opacity:.8}
.back-arrow{font-size:15px}.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.header-title{font-size:14px;font-weight:800;color:#fff}
.header-sub{font-size:10px;color:rgba(255,255,255,.82);font-family:var(--mono);margin-top:1px;letter-spacing:.08em}
.header-right{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.lang-btn{padding:5px 10px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:none;background:transparent;transition:all .15s}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.no-station{display:none;background:var(--danger-bg);border-bottom:1px solid var(--danger-border);padding:12px 16px;text-align:center}
.no-station.show{display:block}
.no-station-msg{font-size:13px;color:var(--sinopec-red-dark);margin-bottom:8px;font-weight:700}
.no-station-link{display:inline-block;background:var(--sinopec-red);color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:9px;text-decoration:none}
.station-bar{background:#fff;border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.station-dot{width:7px;height:7px;border-radius:50%;background:var(--sinopec-red);box-shadow:0 0 0 4px rgba(230,0,18,.12);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;color:var(--muted)}.station-name span{color:var(--text);font-weight:700}
.refund-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:#EFF6FF;color:var(--liberty-blue);border:1px solid #BFDBFE}
.container{max-width:540px;margin:0 auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}
.form-header{margin-bottom:20px}
.form-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}
.form-sub{font-size:13px;color:var(--muted);line-height:1.5}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.section-header{padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-icon{font-size:15px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.section-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono);font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}
.field input[readonly]{background:var(--surface2);color:var(--label)}
.field select option{background:#fff;color:var(--text)}
.field textarea{resize:vertical;min-height:78px;line-height:1.5}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.staff-hint{font-size:11px;color:var(--liberty-blue);margin-top:4px;cursor:pointer;font-family:var(--mono)}
.alert{display:none;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px;line-height:1.5;font-weight:700}.alert.show{display:block}
.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:800;padding:14px;cursor:pointer;letter-spacing:.02em;transition:opacity .18s,transform .1s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-warn{background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;box-shadow:0 4px 14px rgba(230,0,18,.22)}.btn-warn:hover{opacity:.92}
.btn-secondary{background:#fff;color:var(--label);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.confirm-header{margin-bottom:18px}
.confirm-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}
.confirm-sub{font-size:13px;color:var(--muted)}
.confirm-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.confirm-section-title{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:9px 14px;border-bottom:1px solid var(--border);gap:12px}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:11px;color:var(--muted);font-family:var(--mono);width:42%;flex-shrink:0;padding-top:1px;font-weight:700}
.confirm-val{font-size:13px;font-weight:600;flex:1;word-break:break-word;color:var(--text)}.confirm-val.warn{color:var(--sinopec-red)}
.success-wrap{text-align:center;padding:56px 20px}
.success-icon{width:64px;height:64px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px;color:var(--bp-green-dark);font-weight:800}
.success-title{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--bp-green-dark)}
.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}
.success-ref{font-family:var(--mono);font-size:16px;color:var(--liberty-blue);font-weight:800;margin:12px 0 24px}
.success-actions{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:16px}.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--sinopec-red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#fff;font-family:var(--mono);font-weight:700}
@media(max-width:520px){.container{padding:18px 12px}.section-body{grid-template-columns:1fr}}
</style>

<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Submitting…</div></div>

<div class="header">

    <div class="back-btn" onclick="goPortal()">
      <span class="back-arrow">←</span>
      <span class="back-label" id="h-back">Portal</span>
    </div>

</div>

<div class="no-station" id="no-station-bar"><div class="no-station-msg" id="ns-msg"></div><a class="no-station-link" href="index.html" id="ns-link"></a></div>
<div class="station-bar" id="station-bar"><div class="station-dot"></div><div class="station-name" id="station-display"></div><div class="refund-badge" id="refund-badge">REFUND</div></div>

        <div class="field full"><label id="l-notes">Notes</label><textarea id="f-notes"></textarea></div>

    </div>

    <div class="alert" id="alertBox"></div>

  </div>

  <div class="screen" id="screen-confirm">

      <div class="success-icon">✓</div>
      <div class="success-title" id="succ-title"></div>

      <div class="success-ref" id="succ-ref"></div>
      <div class="success-actions">
        <button class="btn btn-secondary" id="succ-another" onclick="resetForm()"></button>
        <button class="btn btn-secondary" id="succ-home" onclick="goPortal()"></button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 13;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    // requestedAt = when this request was first created; retries keep it (the server refuses very old requests)
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), createdAt: Date.now(), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'
   + '#ap-ui.show{display:flex}#ap-box{background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit}'
   + '#ap-title{font-weight:800;font-size:17px;margin-bottom:8px}#ap-msg{font-size:14px;line-height:1.6;white-space:pre-line}'
   + '#ap-detail{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-word}'
   + '#ap-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}'
   + '#ap-btns button{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}'
   + '.ap-primary{background:#E60012;color:#fff}.ap-ghost{background:#eef0f3;color:#333}'
   + '.ap-spin{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#E60012;border-radius:50%;animation:apspin .7s linear infinite;vertical-align:middle;margin-right:8px}'
   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId, requestedAt:req.createdAt });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}
</script>
<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';
let station=localStorage.getItem('ap_station')||'';
let lang=localStorage.getItem('ap_lang')||'en';
const openedAt=new Date();

const S={
  en:{pageTitle:'Refund Record — Aries Petroleum',hBack:'Portal',hTitle:'Refund Record',hSub:'REFUND LOG',nsMsg:'No station selected. Please return to the portal first.',nsLink:'← Go to Portal',badge:'REFUND',fTitle:'Refund Record',fSub:'Record refund details after the refund has been completed.',secBasic:'Basic Details',lDateTime:'Date & Time',lStaff:'Staff Name *',lPOS:'POS No. *',lAmount:'Refund Amount *',lPayment:'Payment Method *',lReceipt:'Receipt Number *',lReceiptTime:'Receipt Time *',lReasonType:'Reason Type *',lReason:'Refund Reason Details *',lNotes:'Notes',review:'Review & Submit →',cfTitle:'Review & Submit',cfSub:'Check refund details before submitting.',cfBasicTitle:'Refund Details',cfEdit:'← Edit',cfSubmit:'Submit Refund Record',cfNote:'Data will be saved to Google Sheets.',succTitle:'Refund Record Saved',succMsg:'The refund record has been submitted.',succAnother:'New Refund Record',succHome:'← Back to Portal',submitting:'Submitting…',errStaff:'Please enter staff name.',errPOS:'Please select POS number.',errAmount:'Please enter refund amount.',errPayment:'Please select payment method.',errReceipt:'Please enter receipt number.',errReceiptTime:'Please enter receipt time.',errReasonType:'Please select reason type.',errReason:'Please enter refund reason details.',fieldStation:'Station',fieldDateTime:'Date & Time',fieldStaff:'Staff',fieldPOS:'POS No.',fieldAmount:'Refund Amount',fieldPayment:'Payment Method',fieldReceipt:'Receipt Number',fieldReceiptTime:'Receipt Time',fieldReasonType:'Reason Type',fieldReason:'Reason Details',fieldNotes:'Notes',na:'—',staffHint:'✎ Not you? Tap to change'},
  zh:{pageTitle:'退款登记 — Aries Petroleum',hBack:'首页',hTitle:'退款登记',hSub:'退款记录',nsMsg:'未选择站点，请先返回首页选择站点。',nsLink:'← 返回首页',badge:'退款',fTitle:'退款登记',fSub:'退款完成后，在此记录退款信息。',secBasic:'基础信息',lDateTime:'日期与时间',lStaff:'员工姓名 *',lPOS:'POS 机号 *',lAmount:'退款金额 *',lPayment:'付款方式 *',lReceipt:'发票号码 *',lReceiptTime:'发票时间 *',lReasonType:'退款类型 *',lReason:'退款原因说明 *',lNotes:'备注',review:'核对并提交 →',cfTitle:'确认提交',cfSub:'提交前请核对退款信息。',cfBasicTitle:'退款信息',cfEdit:'← 返回修改',cfSubmit:'确认提交退款记录',cfNote:'数据将保存至 Google Sheets。',succTitle:'退款记录已保存',succMsg:'退款记录已提交。',succAnother:'新建退款记录',succHome:'← 返回首页',submitting:'提交中…',errStaff:'请填写员工姓名。',errPOS:'请选择 POS 机号。',errAmount:'请填写退款金额。',errPayment:'请选择付款方式。',errReceipt:'请填写发票号码。',errReceiptTime:'请填写发票时间。',errReasonType:'请选择退款类型。',errReason:'请填写退款原因说明。',fieldStation:'站点',fieldDateTime:'日期与时间',fieldStaff:'员工',fieldPOS:'POS 机号',fieldAmount:'退款金额',fieldPayment:'付款方式',fieldReceipt:'发票号码',fieldReceiptTime:'发票时间',fieldReasonType:'退款类型',fieldReason:'原因说明',fieldNotes:'备注',na:'—',staffHint:'✎ 不是你？点击更改'}
};
function t(){return S[lang];}

// ── Staff autofill ────────────────────────────────────────────────────────────
function getStaffName(){
  const name=localStorage.getItem('ap_staff_name')||'';
  const ts=parseInt(localStorage.getItem('ap_staff_name_ts')||'0');
  return(name&&ts&&(Date.now()-ts)<4*60*60*1000)?name:'';
}
function initStaffField(){
  const name=getStaffName();
  const inp=document.getElementById('f-staff');
  const hint=document.getElementById('staff-hint');
  if(name){
    inp.value=name;inp.readOnly=true;inp.style.background='var(--surface2)';inp.style.color='var(--muted)';
    hint.textContent=t().staffHint;hint.style.display='block';
    hint.onclick=()=>{inp.readOnly=false;inp.style.background='';inp.style.color='';inp.value='';hint.style.display='none';inp.focus();};
  } else {
    inp.readOnly=false;inp.style.background='';inp.style.color='';hint.style.display='none';
  }
}

function setLang(l){lang=l;localStorage.setItem('ap_lang',l);document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文'));});applyLang();}

function applyLang(){
  const L=t();document.title=L.pageTitle;
  setText('h-back',L.hBack);setText('h-title',L.hTitle);setText('h-sub',L.hSub);setText('ns-msg',L.nsMsg);setText('ns-link',L.nsLink);setText('refund-badge',L.badge);setText('f-title',L.fTitle);setText('f-sub',L.fSub);setText('sec-basic',L.secBasic);setText('l-datetime',L.lDateTime);setText('l-staff',L.lStaff);setText('l-pos',L.lPOS);setText('l-amount',L.lAmount);setText('l-payment',L.lPayment);setText('l-receipt',L.lReceipt);setText('l-receipttime',L.lReceiptTime);setText('l-reasontype',L.lReasonType);setText('l-reason',L.lReason);setText('l-notes',L.lNotes);setText('review-btn',L.review);setText('cf-title',L.cfTitle);setText('cf-sub',L.cfSub);setText('cf-basic-title',L.cfBasicTitle);setText('cf-edit-btn',L.cfEdit);setText('cf-submit-btn',L.cfSubmit);setText('cf-note',L.cfNote);setText('succ-title',L.succTitle);setText('succ-msg',L.succMsg);setText('succ-another',L.succAnother);setText('succ-home',L.succHome);
  if(station) document.getElementById('station-display').innerHTML=`<span>${station}</span>`;
  const hint=document.getElementById('staff-hint');if(hint&&hint.style.display!=='none') hint.textContent=L.staffHint;
  document.getElementById('f-datetime').value=formatDateTime(openedAt);
}

function setText(id,val){const el=document.getElementById(id);if(el&&val!==undefined)el.textContent=val;}

function setupPOSOptions(){
  const pos=document.getElementById('f-pos');
  const isSinopec=station.toLowerCase().startsWith('sinopec');
  pos.innerHTML='<option value="">—</option><option value="POS1">POS 1</option>'+(isSinopec?'<option value="POS2">POS 2</option>':'')+'<option value="POS1">POS 1</option><option value="POS2">POS 2</option>';
  pos.innerHTML='<option value="">—</option><option value="POS1">POS 1</option><option value="POS2">POS 2</option>';
}

function setDefaultReceiptTime(){const h=String(openedAt.getHours()).padStart(2,'0');const m=String(openedAt.getMinutes()).padStart(2,'0');document.getElementById('f-receipttime').value=`${h}:${m}`;}

function formatDateTime(d){return d.toLocaleDateString(lang==='en'?'en-AU':'zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' '+d.toLocaleTimeString(lang==='en'?'en-AU':'zh-CN',{hour:'2-digit',minute:'2-digit'});}

function val(id){return document.getElementById(id).value.trim();}

function goReview(){
  const L=t();hideAlert('alertBox');
  if(!val('f-staff')) return showAlert('alertBox',L.errStaff);
  if(!val('f-pos')) return showAlert('alertBox',L.errPOS);
  if(!val('f-amount')||Number(val('f-amount'))<=0) return showAlert('alertBox',L.errAmount);
  if(!val('f-payment')) return showAlert('alertBox',L.errPayment);
  if(!val('f-receipt')) return showAlert('alertBox',L.errReceipt);
  if(!val('f-receipttime')) return showAlert('alertBox',L.errReceiptTime);
  if(!val('f-reasontype')) return showAlert('alertBox',L.errReasonType);
  if(!val('f-reason')) return showAlert('alertBox',L.errReason);
  buildConfirm();showScreen('confirm');
}

function buildConfirm(){
  const L=t();
  const rows=[[L.fieldStation,station],[L.fieldDateTime,formatDateTime(openedAt)],[L.fieldStaff,val('f-staff')],[L.fieldPOS,val('f-pos')],[L.fieldAmount,'$'+Number(val('f-amount')).toFixed(2)],[L.fieldPayment,val('f-payment')],[L.fieldReceipt,val('f-receipt')],[L.fieldReceiptTime,val('f-receipttime')],[L.fieldReasonType,val('f-reasontype')],[L.fieldReason,val('f-reason')],[L.fieldNotes,val('f-notes')||L.na]];
  document.getElementById('confirm-body').innerHTML=rows.map(([k,v])=>`<div class="confirm-row"><div class="confirm-key">${escHtml(k)}</div><div class="confirm-val">${escHtml(v)}</div></div>`).join('');
}

function submitRefund(){
  apRun({ key:'refund', url:SHEET_URL, button:'cf-submit-btn',
    makeExtra:()=>({ referenceNo:'RF-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*9000+1000) }),
    buildPayload:(x)=>({formType:'refundRecord',submittedAt:new Date().toISOString(),openedAt:openedAt.toISOString(),referenceNo:x?x.referenceNo:undefined,station,lang,staffName:val('f-staff'),posNo:val('f-pos'),refundAmount:Number(val('f-amount')).toFixed(2),paymentMethod:val('f-payment'),receiptNumber:val('f-receipt'),receiptTime:val('f-receipttime'),reasonType:val('f-reasontype'),refundReason:val('f-reason'),notes:val('f-notes')}),
    onSaved:(data,x)=>onSuccess(x.referenceNo) });
}

function onSuccess(referenceNo){document.getElementById('succ-ref').textContent='Ref: '+referenceNo;showScreen('success');}

function resetForm(){
  ['f-staff','f-amount','f-receipt','f-reason','f-notes'].forEach(id=>{document.getElementById(id).value='';});
  ['f-pos','f-payment','f-reasontype'].forEach(id=>{document.getElementById(id).value='';});
  setDefaultReceiptTime();hideAlert('alertBox');
  initStaffField();
  showScreen('form');
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0);}
function showAlert(id,msg){const a=document.getElementById(id);Object.assign(a.style,{background:'var(--warn-bg)',borderColor:'var(--warn-border)',color:'var(--warn)'});a.textContent=msg;a.classList.add('show');a.scrollIntoView({behavior:'smooth',block:'center'});}
function hideAlert(id){const el=document.getElementById(id);if(el)el.classList.remove('show');}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function goPortal(){window.location.href='index.html';}

if(!station){document.getElementById('no-station-bar').classList.add('show');document.getElementById('station-bar').style.display='none';document.getElementById('screen-form').style.display='none';}
document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文'));});
setupPOSOptions();
setDefaultReceiptTime();
initStaffField();
applyLang();
</script>
