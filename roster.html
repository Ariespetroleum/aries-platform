<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Roster — Aries Petroleum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sinopec-red:#E60012;
  --sinopec-red-dark:#B8000E;
  --bp-green:#00A651;
  --bp-green-dark:#007A3D;
  --liberty-blue:#003DA5;
  --liberty-blue-dark:#002A73;
  --liberty-red:#CE1126;

  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --surface2:#F8FAFC;
  --surface3:#EEF2F6;
  --border:#DDE3EA;
  --border2:#C9D2DD;

  --accent:var(--bp-green);
  --accent2:var(--liberty-blue);
  --warn:var(--sinopec-red);
  --danger:var(--sinopec-red);
  --purple:var(--liberty-blue);

  --text:#142033;
  --muted:#667085;
  --label:#344054;

  --mono:'DM Mono',monospace;
  --sans:'Sora',sans-serif;

  --ok-bg:#ECFDF3;
  --ok-border:#B7E4C7;
  --warn-bg:#EFF6FF;
  --warn-border:#BFDBFE;
  --danger-bg:#FFF1F2;
  --danger-border:#FDA4AF;

  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 18px rgba(15,23,42,.08);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  min-height:100vh;
  padding-bottom:56px;
}

.header{
  background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);
  color:#fff;
  border-bottom:none;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.header-left{display:flex;align-items:center;gap:10px}

.back-btn{
  display:flex;
  align-items:center;
  gap:6px;
  color:rgba(255,255,255,.88);
  font-size:13px;
  cursor:pointer;
  padding:5px 10px 5px 0;
  border-right:1px solid rgba(255,255,255,.24);
  margin-right:2px;
  white-space:nowrap;
  transition:opacity .15s;
}

.back-btn:hover{opacity:.8}
.back-arrow{font-size:15px}
.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}

.header-title{
  font-size:14px;
  font-weight:800;
  color:#fff;
}

.header-sub{
  font-size:10px;
  color:rgba(255,255,255,.82);
  font-family:var(--mono);
  margin-top:1px;
  letter-spacing:.08em;
}

.lang-toggle{
  display:flex;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  border-radius:9px;
  overflow:hidden;
}

.lang-btn{
  padding:5px 10px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
  border:none;
  background:transparent;
}

.lang-btn.active{
  background:#fff;
  color:var(--liberty-blue);
}

.no-station{
  display:none;
  background:var(--danger-bg);
  border-bottom:1px solid var(--danger-border);
  padding:12px 16px;
  text-align:center;
}

.no-station.show{display:block}

.no-station-msg{
  font-size:13px;
  color:var(--sinopec-red-dark);
  margin-bottom:8px;
  font-weight:700;
}

.no-station-link{
  display:inline-block;
  background:var(--sinopec-red);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:8px 16px;
  border-radius:9px;
  text-decoration:none;
}

.station-bar{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:9px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:var(--shadow-sm);
}

.station-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--bp-green);
  box-shadow:0 0 0 4px rgba(0,166,81,.12);
}

.station-name{font-family:var(--mono);font-size:11px;color:var(--muted)}
.station-name span{color:var(--text);font-weight:700}

.badge{
  margin-left:auto;
  font-family:var(--mono);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  padding:3px 8px;
  border-radius:6px;
  background:#EFF6FF;
  color:var(--liberty-blue);
  border:1px solid #BFDBFE;
}

.container{
  max-width:700px;
  margin:0 auto;
  padding:20px 16px 40px;
}

.hero{margin-bottom:16px}

.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:6px;
  font-weight:700;
}

.title{
  font-size:24px;
  font-weight:800;
  line-height:1.3;
  color:var(--text);
}

.title span{color:var(--liberty-blue)}

.sub{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.week-nav{
  display:flex;
  gap:8px;
  margin:14px 0;
}

.week-btn{
  flex:1;
  border:none;
  border-radius:12px;
  background:#fff;
  color:var(--label);
  border:1.5px solid var(--border);
  padding:11px 10px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
}

.week-btn.primary{
  background:#EFF6FF;
  color:var(--liberty-blue);
  border-color:#BFDBFE;
}

.manager-strip{
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:var(--radius);
  padding:13px 14px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  box-shadow:var(--shadow-sm);

.manager-strip-title{

  font-weight:800;
  color:var(--liberty-blue);
}

.manager-strip-sub{

  color:var(--label);
  margin-top:3px;
  line-height:1.4;
}

.small-btn{
  border:none;
  border-radius:10px;
  background:#fff;
  color:var(--label);
  border:1.5px solid var(--border);
  padding:8px 11px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

.small-btn.primary{
  background:var(--liberty-blue);
  color:#fff;
  border-color:var(--liberty-blue);
  font-weight:800;
  box-shadow:0 4px 14px rgba(0,61,165,.18);
}

.small-btn.danger{

}

.day-card{

  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:12px;

}

.day-header{
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.day-name{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.day-date{
  font-family:var(--mono);
  font-size:10px;
  color:var(--muted);
  font-weight:700;
}

.shift-list{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.shift-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  box-shadow:var(--shadow-sm);
}

.shift-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.shift-name{
  font-size:13px;
  font-weight:800;
  color:var(--text);
}

.shift-time{
  font-family:var(--mono);
  font-size:11px;
  color:var(--liberty-blue);
  margin-top:3px;
  font-weight:700;
}

.staff-name{
  font-size:14px;
  font-weight:800;
  color:var(--bp-green-dark);
}

.role{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.shift-notes{
  font-size:11px;
  color:var(--label);
  line-height:1.5;
  border-top:1px solid var(--border);
  padding-top:8px;
  margin-top:8px;
}

.empty{
  padding:14px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}

.admin-panel{display:none;margin-top:18px}
.admin-panel.show{display:block}

.section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}

.section-header{
  padding:11px 14px;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-title{
  font-size:11px;
  font-family:var(--mono);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--label);
  font-weight:800;
}

.section-body{padding:14px}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field.full{grid-column:1/-1}

.field label{
  display:block;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.07em;
  text-transform:uppercase;
  margin-bottom:5px;
  font-family:var(--mono);
  font-weight:700;
}

.field input,.field select,.field textarea{
  width:100%;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  font-family:var(--sans);
  font-size:13px;
  padding:10px 12px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}

.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--liberty-blue);
  box-shadow:0 0 0 3px rgba(0,61,165,.10);
}

.field textarea{
  resize:vertical;
  min-height:70px;
  line-height:1.5;
}

.field select option{background:#fff;color:var(--text)}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.btn{
  width:100%;
  border:none;
  border-radius:12px;
  font-family:var(--sans);
  font-size:14px;
  font-weight:800;
  padding:14px;
  cursor:pointer;
  transition:opacity .18s,transform .1s;
}

.btn:active{transform:scale(.985)}

.btn-primary{
  background:linear-gradient(135deg,var(--liberty-blue),var(--liberty-blue-dark));
  color:#fff;
  box-shadow:0 4px 14px rgba(0,61,165,.22);
}

.btn-secondary{
  background:#fff;
  color:var(--label);
  border:1.5px solid var(--border);
}

.staff-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.staff-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:var(--shadow-sm);
}

.staff-item-name{
  font-weight:800;
  font-size:13px;
  color:var(--text);
}

.staff-item-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.alert{
  display:none;
  border-radius:10px;
  padding:10px 12px;
  font-size:12px;
  line-height:1.5;
  margin-bottom:12px;
  font-weight:700;
}

.alert.warn{
  display:block;
  background:var(--danger-bg);
  border:1px solid var(--danger-border);
  color:var(--sinopec-red-dark);
}

.alert.ok{
  display:block;
  background:var(--ok-bg);
  border:1px solid var(--ok-border);
  color:var(--bp-green-dark);
}

.loading{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(4px);
  z-index:999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
}

.loading.show{display:flex}

.spinner{
  width:36px;
  height:36px;
  border:3px solid var(--border2);
  border-top-color:var(--liberty-blue);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.loading-text{
  font-family:var(--mono);
  font-size:12px;
  color:#fff;
  font-weight:700;
}

@media(max-width:520px){
  .container{padding:18px 12px}
  .form-grid{grid-template-columns:1fr}
  .manager-strip{flex-direction:column;align-items:stretch}
  .actions{flex-direction:column}
  .week-nav{gap:6px}
  .week-btn{font-size:10px;padding:10px 6px}
}

</div>

<div class="station-bar" id="stationBar">

          <div class="field full"><label id="lStaffPhone">Phone / Notes</label><input type="text" id="staffPhone"></div>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 10;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'
   + '#ap-ui.show{display:flex}#ap-box{background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit}'
   + '#ap-title{font-weight:800;font-size:17px;margin-bottom:8px}#ap-msg{font-size:14px;line-height:1.6;white-space:pre-line}'
   + '#ap-detail{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-word}'
   + '#ap-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}'
   + '#ap-btns button{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}'
   + '.ap-primary{background:#E60012;color:#fff}.ap-ghost{background:#eef0f3;color:#333}'
   + '.ap-spin{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#E60012;border-radius:50%;animation:apspin .7s linear infinite;vertical-align:middle;margin-right:8px}'
   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}
</script>
<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';
let station = localStorage.getItem('ap_station') || '';
let lang = localStorage.getItem('ap_lang') || 'en';
let weekOffset = 0;
let editingShiftId = '';
let staff = [];
let roster = [];

const TEXT = {

    staffSection:'Staff List',rosterSection:'Add / Edit Shift',
    staffName:'Staff Name',staffRole:'Role',staffPhone:'Phone / Notes',addStaff:'Add Staff',
    date:'Date',shift:'Shift',start:'Start Time',finish:'Finish Time',staff:'Staff',role:'Role',notes:'Notes',
    saveShift:'Save Shift',clear:'Clear',noRoster:'No roster entered for this day.',noStaff:'No staff added yet.',
    edit:'Edit',remove:'Remove',savedLocal:'Saved locally. Google Sheet URL not connected yet.',savedSheet:'Saved to Google Sheet.',savingSheet:'Saving to Google Sheet…',notSavedSheet:'NOT saved to Google Sheet — the change is only on this device.',unknownSheet:'Save not confirmed (connection timed out). It may be saved — tap Retry; it cannot be recorded twice.',retrySave:'Retry',
    loading:'Loading…',saving:'Saving…',fillRequired:'Please complete date, staff, start time and finish time.',
    weekStarting:'Week starting',removeConfirm:'Remove this shift?'
  },
  zh: {
    pageTitle:'排班表 — Aries Petroleum',hBack:'首页',hTitle:'每周排班',hSub:'查看上班时间',
    noStationMsg:'未选择站点，请先返回首页选择站点。',noStationLink:'← 返回首页',badge:'排班',
    eyebrow:'每周排班',title:'本周<span>排班表</span>',sub:'查看本站员工本周上班时间。',
    prev:'← 上一周',thisWeek:'本周',next:'下一周 →',
    managerTitle:'排班管理权限',
    managerSub:'站长可以添加员工并编辑本站排班，仅限排班功能。',
    managerLogin:'站长排班登录',managerLogout:'退出',
    pinPrompt:'请输入站长排班 PIN',wrongPin:'PIN 不正确。',
    staffSection:'员工名单',rosterSection:'添加 / 修改班次',
    staffName:'员工姓名',staffRole:'职位',staffPhone:'电话 / 备注',addStaff:'添加员工',
    date:'日期',shift:'班次',start:'开始时间',finish:'结束时间',staff:'员工',role:'职位',notes:'备注',
    saveShift:'保存班次',clear:'清空',noRoster:'当天还没有排班。',noStaff:'还没有添加员工。',
    edit:'修改',remove:'删除',savedLocal:'已保存到本机。Google Sheet 网址还未连接。',savedSheet:'已保存到 Google Sheet。',savingSheet:'正在保存到 Google Sheet…',notSavedSheet:'未保存到 Google Sheet，修改目前只在这台设备上。',unknownSheet:'保存结果未确认（网络超时），可能已经保存。请点"重试"，系统不会重复记录。',retrySave:'重试',
    loading:'加载中…',saving:'保存中…',fillRequired:'请填写日期、员工、开始时间和结束时间。',
    weekStarting:'本周开始',removeConfirm:'确定删除这个班次吗？'
  }
};

function T(){return TEXT[lang]}
function setText(id,value){const el=document.getElementById(id);if(el)el.textContent=value}

function applyLang(){
  const t=T();
  document.title=t.pageTitle;
  setText('h-back',t.hBack);setText('h-title',t.hTitle);setText('h-sub',t.hSub);
  setText('noStationMsg',t.noStationMsg);setText('noStationLink',t.noStationLink);setText('badge',t.badge);
  setText('eyebrow',t.eyebrow);document.getElementById('pageTitle').innerHTML=t.title;setText('pageSub',t.sub);
  setText('prevWeekBtn',t.prev);setText('thisWeekBtn',t.thisWeek);setText('nextWeekBtn',t.next);
  setText('managerTitle',t.managerTitle);setText('managerSub',t.managerSub);setText('managerBtn',isManager()?t.managerLogout:t.managerLogin);
  setText('staffSectionTitle',t.staffSection);setText('rosterSectionTitle',t.rosterSection);
  setText('lStaffName',t.staffName);setText('lStaffRole',t.staffRole);setText('lStaffPhone',t.staffPhone);setText('addStaffBtn',t.addStaff);
  setText('lDate',t.date);setText('lShiftName',t.shift);setText('lStart',t.start);setText('lFinish',t.finish);
  setText('lStaff',t.staff);setText('lRole',t.role);setText('lNotes',t.notes);setText('saveShiftBtn',t.saveShift);setText('clearShiftBtn',t.clear);setText('logoutBtn',t.managerLogout);
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文')));
  if(station)document.getElementById('stationDisplay').innerHTML=`<span>${escapeHtml(station)}</span>`;
  renderAll();
}

function setLang(l){lang=l;localStorage.setItem('ap_lang',l);applyLang()}
function goPortal(){window.location.href='index.html'}
function isManager(){return localStorage.getItem('ap_roster_manager_login')==='true'}

async function managerLogin(){
  if(isManager()){managerLogout();return}
  const pin=prompt(T().pinPrompt);
  if(pin===null) return;
  showLoading(T().loading);
  try{
    const url=`${WEB_APP_URL}?action=verifyRosterManager&pin=${encodeURIComponent(pin)}`;
    const res=await fetch(url,{signal:AbortSignal.timeout(5000)});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('ap_roster_manager_login','true');
      document.getElementById('adminPanel').classList.add('show');
      applyLang();
    }else{
      showStatus(T().wrongPin,'warn');
    }
  }catch(e){
    showStatus(T().wrongPin,'warn');
  }finally{
    hideLoading();
  }
}

function managerLogout(){
  localStorage.removeItem('ap_roster_manager_login');
  document.getElementById('adminPanel').classList.remove('show');
  applyLang();
}

function storageKey(type){return `ap_${type}_${station}`}

function loadLocal(){
  staff=JSON.parse(localStorage.getItem(storageKey('staff'))||'[]');
  roster=JSON.parse(localStorage.getItem(storageKey('roster'))||'[]');
  if(staff.length===0){
    staff=[
      {id:makeId(),name:'Sample Staff 1',role:'Cashier',phone:''},
      {id:makeId(),name:'Sample Staff 2',role:'Cashier',phone:''}
    ];
    saveLocalOnly();
  }
}

function saveLocalOnly(){
  localStorage.setItem(storageKey('staff'),JSON.stringify(staff));
  localStorage.setItem(storageKey('roster'),JSON.stringify(roster));
}

async function loadFromSheet(){
  if(!WEB_APP_URL){loadLocal();return}
  showLoading(T().loading);
  try{
    const url=`${WEB_APP_URL}?action=getRosterData&station=${encodeURIComponent(station)}`;
    const res=await fetch(url,{signal:AbortSignal.timeout(5000)});
    const data=await res.json();
    staff=Array.isArray(data.staff)?data.staff:[];
    roster=Array.isArray(data.roster)?data.roster:[];
    saveLocalOnly();
  }catch(e){
    loadLocal();
    showStatus('Could not load from Google Sheet. Local data shown.','warn');
  }finally{hideLoading()}
}

// Saves go to the Sheet one at a time. Each payload is the whole staff list or the
// whole roster, so only the latest one per type needs sending. "Saved to Google Sheet"
// is shown only after the Apps Script confirms; until then the change exists on this
// device only and the warning stays on screen with a retry button.
const rosterSync = { running:false, queued:{}, failed:{} };
function saveToSheet(payload){
  saveLocalOnly();
  if(!WEB_APP_URL){showStatus(T().savedLocal,'warn');return}
  rosterSync.queued[payload.formType] = payload;
  delete rosterSync.failed[payload.formType];
  if(!rosterSync.running) runRosterSync();
}
async function runRosterSync(){
  rosterSync.running = true;
  try{
    let types;
    while((types = Object.keys(rosterSync.queued)).length){
      const ft = types[0]; const p = rosterSync.queued[ft]; delete rosterSync.queued[ft];
      showStatus(T().savingSheet,'warn',true);
      const req = apRequestFor(ft, { station:p.station, staff:p.staff, roster:p.roster });
      const r = await apSubmit(WEB_APP_URL, Object.assign({}, p, { requestId:req.requestId }));
      if(r.status === 'ok'){ apDone(ft); }
      else if(!rosterSync.queued[ft]){ rosterSync.failed[ft] = { payload:p, result:r }; }
    }
  }finally{
    rosterSync.running = false;
    const failedTypes = Object.keys(rosterSync.failed);
    if(failedTypes.length){
      const r = rosterSync.failed[failedTypes[0]].result;
      showStatus((r.status==='unknown' ? T().unknownSheet : T().notSavedSheet) + (r.status==='failed' && r.error && !r.offline ? ' ('+r.error+')' : ''), 'warn', true, retryRosterSync);
    } else {
      showStatus(T().savedSheet,'ok');
    }
  }
}
function retryRosterSync(){
  Object.keys(rosterSync.failed).forEach(ft => { rosterSync.queued[ft] = rosterSync.failed[ft].payload; });
  rosterSync.failed = {};
  if(!rosterSync.running) runRosterSync();
}
window.addEventListener('beforeunload', e => {
  if(rosterSync.running || Object.keys(rosterSync.failed).length){ e.preventDefault(); e.returnValue=''; }
});

function addStaff(){
  const name=document.getElementById('staffName').value.trim();
  const role=document.getElementById('staffRole').value;
  const phone=document.getElementById('staffPhone').value.trim();
  if(!name){showStatus(T().fillRequired,'warn');return}
  staff.push({id:makeId(),station,name,role,phone,active:true});
  document.getElementById('staffName').value='';
  document.getElementById('staffPhone').value='';
  renderAll();
  saveToSheet({formType:'rosterStaffSave',station,staff,updatedAt:new Date().toISOString()});
}

function removeStaff(id){
  staff=staff.filter(s=>s.id!==id);
  renderAll();
  saveToSheet({formType:'rosterStaffSave',station,staff,updatedAt:new Date().toISOString()});
}

function saveShift(){
  const date=document.getElementById('shiftDate').value;
  const shiftName=document.getElementById('shiftName').value;
  const startTime=document.getElementById('startTime').value;
  const finishTime=document.getElementById('finishTime').value;
  const staffName=document.getElementById('shiftStaff').value;
  const role=document.getElementById('shiftRole').value;
  const notes=document.getElementById('shiftNotes').value.trim();
  if(!date||!staffName||!startTime||!finishTime){showStatus(T().fillRequired,'warn');return}
  const item={id:editingShiftId||makeId(),station,date,shiftName,startTime,finishTime,staffName,role,notes,updatedAt:new Date().toISOString()};
  if(editingShiftId){roster=roster.map(r=>r.id===editingShiftId?item:r)}else{roster.push(item)}
  clearShiftForm();renderAll();
  saveToSheet({formType:'rosterShiftSave',station,roster,updatedAt:new Date().toISOString()});
}

function editShift(id){
  const r=roster.find(x=>x.id===id);if(!r)return;
  editingShiftId=id;
  document.getElementById('shiftDate').value=r.date;
  document.getElementById('shiftName').value=r.shiftName;
  document.getElementById('startTime').value=r.startTime;
  document.getElementById('finishTime').value=r.finishTime;
  document.getElementById('shiftStaff').value=r.staffName;
  document.getElementById('shiftRole').value=r.role;
  document.getElementById('shiftNotes').value=r.notes||'';
  document.getElementById('adminPanel').scrollIntoView({behavior:'smooth'});
}

function removeShift(id){
  if(!confirm(T().removeConfirm))return;
  roster=roster.filter(r=>r.id!==id);
  renderAll();
  saveToSheet({formType:'rosterShiftSave',station,roster,updatedAt:new Date().toISOString()});
}

function clearShiftForm(){
  editingShiftId='';
  document.getElementById('shiftDate').value='';
  document.getElementById('startTime').value='';
  document.getElementById('finishTime').value='';
  document.getElementById('shiftNotes').value='';
}

function renderAll(){
  renderRoster();renderStaff();renderStaffSelect();
  document.getElementById('adminPanel').classList.toggle('show',isManager());
}

function renderStaff(){
  const box=document.getElementById('staffList');if(!box)return;
  if(staff.length===0){box.innerHTML=`<div class="empty">${T().noStaff}</div>`;return}
  box.innerHTML=staff.map(s=>`
    <div class="staff-item">
      <div><div class="staff-item-name">${escapeHtml(s.name)}</div><div class="staff-item-meta">${escapeHtml(s.role||'')}${s.phone?' · '+escapeHtml(s.phone):''}</div></div>
      <button class="small-btn danger" onclick="removeStaff('${s.id}')">${T().remove}</button>
    </div>`).join('');
}

function renderStaffSelect(){
  const sel=document.getElementById('shiftStaff');if(!sel)return;
  sel.innerHTML=`<option value="">—</option>`+staff.map(s=>`<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
}

function renderRoster(){
  const weekStart=getWeekStart(new Date(),weekOffset);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);days.push(d)}
  document.getElementById('pageSub').textContent=`${T().weekStarting}: ${formatDate(days[0])} · ${station||''}`;
  document.getElementById('rosterView').innerHTML=days.map(day=>{
    const dateKey=toDateKey(day);
    const items=roster.filter(r=>r.date===dateKey).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    return `<div class="day-card"><div class="day-header"><div class="day-name">${formatDayName(day)}</div><div class="day-date">${formatDate(day)}</div></div><div class="shift-list">${items.length?items.map(item=>shiftHtml(item)).join(''):`<div class="empty">${T().noRoster}</div>`}</div></div>`;
  }).join('');
}

function shiftHtml(item){
  const managerBtns=isManager()?`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="small-btn" onclick="editShift('${item.id}')">${T().edit}</button><button class="small-btn danger" onclick="removeShift('${item.id}')">${T().remove}</button></div>`:'';
  return `<div class="shift-card"><div class="shift-top"><div><div class="shift-name">${escapeHtml(item.shiftName)}</div><div class="shift-time">${escapeHtml(item.startTime)} - ${escapeHtml(item.finishTime)}</div></div>${managerBtns}</div><div class="staff-name">${escapeHtml(item.staffName)}</div><div class="role">${escapeHtml(item.role||'')}</div>${item.notes?`<div class="shift-notes">${escapeHtml(item.notes)}</div>`:''}</div>`;
}

function changeWeek(delta){weekOffset+=delta;renderRoster()}
function goThisWeek(){weekOffset=0;renderRoster()}

function getWeekStart(date,offset){
  const d=new Date(date);const day=d.getDay();const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff+offset*7);d.setHours(0,0,0,0);return d;
}

function toDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d){return d.toLocaleDateString(lang==='zh'?'zh-CN':'en-AU',{month:'short',day:'numeric',year:'numeric'})}
function formatDayName(d){return d.toLocaleDateString(lang==='zh'?'zh-CN':'en-AU',{weekday:'long'})}
function makeId(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
let statusTimer=null;
function showStatus(msg,type,sticky,onRetry){
  const box=document.getElementById('statusBox');
  if(statusTimer){clearTimeout(statusTimer);statusTimer=null}
  box.innerHTML=`<div class="alert ${type==='ok'?'ok':'warn'}">${escapeHtml(msg)}${onRetry?` <button type="button" id="roster-retry" style="margin-left:8px;border:none;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer">${escapeHtml(T().retrySave)}</button>`:''}</div>`;
  if(onRetry){document.getElementById('roster-retry').onclick=onRetry}
  if(!sticky){statusTimer=setTimeout(()=>{box.innerHTML=''},3500)}
}
function showLoading(msg){document.getElementById('loadingText').textContent=msg;document.getElementById('loading').classList.add('show')}
function hideLoading(){document.getElementById('loading').classList.remove('show')}
function escapeHtml(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function init(){
  if(!station){
    document.getElementById('noStation').classList.add('show');
    document.getElementById('stationBar').style.display='none';
    return;
  }
  await loadFromSheet();
  applyLang();
}

document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文')));
init();
</script>
