<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Drive Off Report — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sinopec-red:#E60012;--sinopec-red-dark:#B8000E;--bp-green:#00A651;--bp-green-dark:#007A3D;--liberty-blue:#003DA5;--liberty-blue-dark:#002A73;--liberty-red:#CE1126;--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#EEF3FF;--border:#DDE3EA;--border2:#C9D2DD;--text:#142033;--muted:#667085;--label:#344054;--accent:var(--bp-green);--accent2:var(--liberty-blue);--warn:#D97706;--danger:var(--sinopec-red);--purple:var(--liberty-blue);--mono:'DM Mono',monospace;--sans:'Sora',sans-serif;--danger-bg:#FFF1F2;--danger-border:#FDA4AF;--warn-bg:#FFF7ED;--warn-border:#FDBA74;--ok-bg:#ECFDF3;--ok-border:#86EFAC;--blue-bg:#EFF6FF;--blue-border:#BFDBFE;--radius:16px;--radius-sm:10px;--shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding-bottom:56px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.86);font-size:13px;cursor:pointer;padding:5px 10px 5px 0;border-right:1px solid rgba(255,255,255,.22);margin-right:2px;transition:color .15s;white-space:nowrap}
.back-btn:hover{color:#fff}
.back-arrow{font-size:15px}.back-label{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.header-title{font-size:14px;font-weight:700;color:#fff}
.header-sub{font-size:10px;color:rgba(255,255,255,.80);font-family:var(--mono);margin-top:2px;letter-spacing:.08em}
.header-right{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.lang-btn{padding:5px 10px;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;cursor:pointer;border:none;background:transparent;transition:all .15s}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.no-station{display:none;background:var(--danger-bg);border-bottom:1px solid var(--danger-border);padding:12px 16px;text-align:center}
.no-station.show{display:block}
.no-station-msg{font-size:13px;color:var(--sinopec-red-dark);margin-bottom:8px;font-weight:600}
.no-station-link{display:inline-block;background:var(--sinopec-red);color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:9px;text-decoration:none}
.station-bar{background:#fff;border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.station-dot{width:7px;height:7px;border-radius:50%;background:var(--sinopec-red);box-shadow:0 0 0 4px rgba(230,0,18,.10);flex-shrink:0}
.station-name{font-family:var(--mono);font-size:11px;color:var(--muted)}.station-name span{color:var(--text);font-weight:700}
.incident-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--danger-bg);color:var(--sinopec-red);border:1px solid var(--danger-border)}
.container{max-width:560px;margin:0 auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}
.form-header{margin-bottom:18px}
.form-title{font-size:20px;font-weight:800;margin-bottom:5px;color:var(--text)}
.form-sub{font-size:13px;color:var(--muted);line-height:1.55}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.section-header{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.section-icon{font-size:15px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.section-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.section-body.single{grid-template-columns:1fr}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;font-family:var(--mono);font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.10)}
.field select option{background:#fff;color:var(--text)}
.field textarea{resize:vertical;min-height:72px;line-height:1.55}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.staff-hint{font-size:11px;color:var(--liberty-blue);margin-top:4px;cursor:pointer;font-family:var(--mono)}
.check-list{padding:4px 0}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.check-row:last-child{border-bottom:none}.check-row:hover{background:var(--surface2)}
.check-row input[type=checkbox],.check-row input[type=radio]{width:17px;height:17px;flex-shrink:0;cursor:pointer;accent-color:var(--liberty-blue)}
.check-row-text{font-size:13px;color:var(--text);font-weight:500}
.alert{display:none;border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin-bottom:14px;line-height:1.5;font-weight:600}
.alert.show{display:block}
.btn-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{width:100%;border:none;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:800;padding:14px;cursor:pointer;letter-spacing:.01em;transition:opacity .18s,transform .1s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--liberty-blue),var(--liberty-blue-dark));color:#fff;box-shadow:0 4px 14px rgba(0,61,165,.22)}.btn-primary:hover{opacity:.94}
.btn-danger{background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;box-shadow:0 4px 14px rgba(230,0,18,.22)}.btn-danger:hover{opacity:.94}
.btn-secondary{background:#fff;color:var(--label);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.confirm-header{margin-bottom:18px}
.confirm-title{font-size:20px;font-weight:800;margin-bottom:5px;color:var(--text)}
.confirm-sub{font-size:13px;color:var(--muted)}
.confirm-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.confirm-section-title{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--label)}
.confirm-row{display:flex;padding:10px 14px;border-bottom:1px solid var(--border);gap:12px}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:11px;color:var(--muted);font-family:var(--mono);width:40%;flex-shrink:0;padding-top:1px;letter-spacing:.03em}
.confirm-val{font-size:13px;font-weight:600;flex:1;word-break:break-word;color:var(--text)}.confirm-val.danger{color:var(--sinopec-red)}
.success-wrap{text-align:center;padding:56px 20px}
.success-icon{width:66px;height:66px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;color:var(--bp-green-dark)}
.success-title{font-size:21px;font-weight:800;margin-bottom:8px;color:var(--bp-green-dark)}
.success-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:24px}
.success-actions{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}
.loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.55);border-top-color:var(--sinopec-red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#fff;font-family:var(--mono);font-weight:600}
@media(max-width:480px){.container{padding:18px 12px 48px}.section-body{gap:12px}.header-title{font-size:13px}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Submitting…</div></div>

<div class="header">
  <div class="header-left">
    <div class="back-btn" onclick="goPortal()"><span class="back-arrow">←</span><span class="back-label" id="h-back">Portal</span></div>
    <div><div class="header-title" id="h-title">Drive Off Report</div><div class="header-sub" id="h-sub">INCIDENT REPORT</div></div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="no-station" id="no-station-bar"><div class="no-station-msg" id="ns-msg"></div><a class="no-station-link" href="index.html" id="ns-link"></a></div>
<div class="station-bar" id="station-bar"><div class="station-dot"></div><div class="station-name" id="station-display"></div><div class="incident-badge" id="incident-badge">INCIDENT</div></div>

<div class="container">
  <div class="screen active" id="screen-form">
    <div class="form-header"><div class="form-title" id="f-title"></div><div class="form-sub" id="f-sub"></div></div>

    <!-- Section 1: Incident -->
    <div class="section">
      <div class="section-header"><span class="section-icon">📋</span><span class="section-title" id="sec1-title"></span></div>
      <div class="section-body">
        <div class="field"><label id="l-date"></label><input type="date" id="f-date"></div>
        <div class="field"><label id="l-time"></label><input type="time" id="f-time"></div>
        <div class="field"><label id="l-pump"></label><input type="number" id="f-pump" placeholder="e.g. 3" min="1" max="20"></div>
        <div class="field"><label id="l-fueltype"></label>
          <select id="f-fueltype"><option value="">—</option><option>91 Unleaded</option><option>95 Unleaded</option><option>98 Unleaded</option><option>E10</option><option>Diesel</option><option>LPG</option></select>
        </div>
        <div class="field"><label id="l-litres"></label><input type="number" id="f-litres" placeholder="e.g. 45.2" step="0.1" min="0"></div>
        <div class="field"><label id="l-amount"></label><input type="number" id="f-amount" placeholder="e.g. 82.50" step="0.01" min="0"></div>
      </div>
    </div>

    <!-- Section 2: Vehicle -->
    <div class="section">
      <div class="section-header"><span class="section-icon">🚗</span><span class="section-title" id="sec2-title"></span></div>
      <div class="section-body">
        <div class="field full"><label id="l-plate"></label><input type="text" id="f-plate" placeholder="e.g. ABC 123" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="field"><label id="l-state"></label>
          <select id="f-state"><option value="">—</option><option>VIC</option><option>NSW</option><option>QLD</option><option>WA</option><option>SA</option><option>TAS</option><option>NT</option></select>
        </div>
        <div class="field"><label id="l-vtype"></label>
          <select id="f-vtype"><option value="">—</option><option id="vt-sedan"></option><option id="vt-suv"></option><option id="vt-ute"></option><option id="vt-van"></option><option id="vt-truck"></option><option id="vt-moto"></option></select>
        </div>
        <div class="field"><label id="l-colour"></label><input type="text" id="f-colour" placeholder="e.g. Silver"></div>
        <div class="field"><label id="l-make"></label><input type="text" id="f-make" placeholder="e.g. Toyota Camry"></div>
        <div class="field full"><label id="l-direction"></label><input type="text" id="f-direction" placeholder="e.g. Northbound on High St"></div>
      </div>
    </div>

    <!-- Section 3: Driver -->
    <div class="section">
      <div class="section-header"><span class="section-icon">👤</span><span class="section-title" id="sec3-title"></span></div>
      <div class="section-body">
        <div class="field"><label id="l-gender"></label>
          <select id="f-gender"><option value="">—</option><option id="g-male"></option><option id="g-female"></option><option id="g-unknown"></option></select>
        </div>
        <div class="field"><label id="l-age"></label>
          <select id="f-age"><option value="">—</option><option>&lt;18</option><option>18–25</option><option>25–40</option><option>40–60</option><option>60+</option><option id="a-unknown"></option></select>
        </div>
        <div class="field full"><label id="l-appearance"></label><textarea id="f-appearance" rows="2" placeholder="e.g. Blue hoodie, dark jeans"></textarea></div>
        <div class="field full"><label id="l-passengers"></label>
          <select id="f-passengers"><option value="">—</option><option id="p-yes"></option><option id="p-no"></option><option id="p-unknown"></option></select>
        </div>
      </div>
    </div>

    <!-- Section 4: Evidence -->
    <div class="section">
      <div class="section-header"><span class="section-icon">📹</span><span class="section-title" id="sec4-title"></span></div>
      <div class="check-list">
        <label class="check-row"><input type="checkbox" id="ev-cctv"><div><div class="check-row-text" id="ev-cctv-l"></div></div></label>
        <label class="check-row"><input type="checkbox" id="ev-pos"><div><div class="check-row-text" id="ev-pos-l"></div></div></label>
        <label class="check-row"><input type="checkbox" id="ev-plate"><div><div class="check-row-text" id="ev-plate-l"></div></div></label>
        <label class="check-row"><input type="checkbox" id="ev-staff"><div><div class="check-row-text" id="ev-staff-l"></div></div></label>
      </div>
    </div>

    <!-- Section 5: Store interaction -->
    <div class="section">
      <div class="section-header"><span class="section-icon">🏪</span><span class="section-title" id="sec5-title"></span></div>
      <div class="section-body">
        <div class="field"><label id="l-entered"></label>
          <select id="f-entered"><option value="">—</option><option id="entered-yes"></option><option id="entered-no"></option></select>
        </div>
        <div class="field"><label id="l-attempted"></label>
          <select id="f-attempted"><option value="">—</option><option id="attempted-yes"></option><option id="attempted-no"></option></select>
        </div>
        <div class="field full"><label id="l-conversation"></label><textarea id="f-conversation" rows="2" placeholder="e.g. Said they forgot wallet, would come back"></textarea></div>
      </div>
    </div>

    <!-- Section 6: Police -->
    <div class="section">
      <div class="section-header"><span class="section-icon">🚔</span><span class="section-title" id="sec6-title"></span></div>
      <div class="section-body">
        <div class="field"><label id="l-police"></label>
          <select id="f-police"><option value="">—</option><option id="pol-yes"></option><option id="pol-no"></option><option id="pol-notyet"></option></select>
        </div>
        <div class="field"><label id="l-policeref"></label><input type="text" id="f-policeref" placeholder="Optional"></div>
        <div class="field"><label id="l-policedate"></label><input type="date" id="f-policedate"></div>
        <div class="field"><label id="l-policeofficer"></label><input type="text" id="f-policeofficer" placeholder="Optional"></div>
      </div>
    </div>

    <!-- Section 7: Staff -->
    <div class="section">
      <div class="section-header"><span class="section-icon">👔</span><span class="section-title" id="sec7-title"></span></div>
      <div class="section-body">
        <div class="field">
          <label id="l-staff"></label>
          <input type="text" id="f-staff" placeholder="Your name">
          <div id="staff-hint" class="staff-hint" style="display:none"></div>
        </div>
        <div class="field"><label id="l-shift"></label>
          <select id="f-shift"><option value="">—</option><option id="sh-morning"></option><option id="sh-afternoon"></option><option id="sh-night"></option></select>
        </div>
        <div class="field full"><label id="l-notes"></label><textarea id="f-notes" rows="2" placeholder="Any additional details…"></textarea></div>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>
    <div class="btn-wrap"><button class="btn btn-danger" id="review-btn" onclick="goReview()"></button></div>
  </div>

  <div class="screen" id="screen-confirm">
    <div class="confirm-header"><div class="confirm-title" id="cf-title"></div><div class="confirm-sub" id="cf-sub"></div></div>
    <div id="confirm-body"></div>
    <div class="alert" id="cf-alert"></div>
    <div class="btn-wrap">
      <button class="btn btn-secondary" id="cf-edit-btn" onclick="showScreen('form')"></button>
      <button class="btn btn-danger" id="cf-submit-btn" onclick="submitReport()"></button>
    </div>
    <p class="note" id="cf-note"></p>
  </div>

  <div class="screen" id="screen-success">
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <div class="success-title" id="succ-title"></div>
      <div class="success-sub" id="succ-msg"></div>
      <div class="success-actions">
        <button class="btn btn-secondary" id="succ-another" onclick="resetForm()"></button>
        <button class="btn btn-secondary" id="succ-home" onclick="goPortal()"></button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── AP reliable submit v1 ─────────────────────────────────────────────
   Shared by every staff-portal form. Shows "saved" ONLY when the Apps
   Script (API v9+) confirms the write for this exact requestId.
     apSubmit(url, payload) → { status:'ok'|'failed'|'unknown', data, error }
       ok      – written to Google Sheet (or already written earlier: duplicate)
       failed  – definitely NOT written (server said so, or never sent: offline)
       unknown – sent but no confirmation (timeout / connection lost / bad reply /
                 server reports "uncertain"):
                 it may have been written. Re-send with the SAME requestId only.
   The same payload keeps the same requestId until it succeeds, so a retry
   can never create a second row.
──────────────────────────────────────────────────────────────────────── */
const AP_MIN_API_VERSION = 15;
const AP_TIMEOUT_MS = 45000;
const AP_TXT = {
  en:{ saving:'Saving to Google Sheet…', failedTitle:'Not saved',
       failed:'Nothing was saved. Your entries are kept — check and submit again.',
       offline:'No internet connection — nothing was sent. Your entries are kept. Reconnect and submit again.',
       unknownTitle:'Save not confirmed',
       unknown:'The connection timed out or dropped, so we could not confirm the save. It MAY already be saved. Do not fill the form in again. Tap "Send again" — it uses the same reference, so it can never be recorded twice.',
       version:'The Google Sheet script is an older version and cannot confirm saves. Please tell the manager.',
       retry:'Send again', close:'Close', busy:'Already saving — please wait.' },
  zh:{ saving:'正在保存到 Google Sheet…', failedTitle:'未保存',
       failed:'没有保存成功。您填写的内容都还在，请检查后重新提交。',
       offline:'网络未连接，数据没有发出。您填写的内容都还在，请联网后重新提交。',
       unknownTitle:'保存结果未确认',
       unknown:'网络超时或中断，无法确认是否已保存，数据可能已经保存。请不要重新填写；点"再次提交"会使用同一编号，系统不会重复记录。',
       version:'Google Sheet 后台脚本版本过旧，无法确认保存结果，请联系经理。',
       retry:'再次提交', close:'关闭', busy:'正在保存，请稍候。' }
};
function apT(){ const l=(typeof lang!=='undefined'&&lang==='zh')?'zh':'en'; return AP_TXT[l]; }
function apNewRequestId(prefix){ return (prefix||'REQ')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }

const apPendingBySig = {};
// Same content → same requestId (and same extra data, e.g. a reference no) until it succeeds
function apRequestFor(key, stablePayload, makeExtra){
  const sig = key + '|' + JSON.stringify(stablePayload);
  if (!apPendingBySig[key] || apPendingBySig[key].sig !== sig) {
    // requestedAt = when this request was first created; retries keep it (the server refuses very old requests)
    apPendingBySig[key] = { sig, requestId: apNewRequestId(key), createdAt: Date.now(), extra: makeExtra ? makeExtra() : null };
  }
  return apPendingBySig[key];
}
function apDone(key){ delete apPendingBySig[key]; }

async function apSubmit(url, payload, opts){
  opts = opts || {};
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { status:'failed', error:apT().offline, offline:true };
  }
  const ctrl = new AbortController();
  const ms = opts.timeoutMs || (typeof window!=='undefined' && window.AP_TIMEOUT_OVERRIDE) || AP_TIMEOUT_MS;
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '';
  try {
    // No custom headers and no "no-cors": a plain text/plain POST is readable from Apps Script
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, cache:'no-store', redirect:'follow' });
    text = await res.text();
  } catch (e) {
    clearTimeout(timer);
    return { status:'unknown', error:(e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }
  clearTimeout(timer);
  let data = null;
  try { data = JSON.parse(text); } catch (e) { return { status:'unknown', error:'bad-response' }; }
  if (!data || typeof data !== 'object') return { status:'unknown', error:'bad-response' };
  // The server says the outcome is uncertain (rows may be written) → never report "not saved"
  if (data.uncertain === true || data.saved === null) return { status:'unknown', data, error:'unconfirmed' };
  if (data.success === false) return { status:'failed', data, error:String(data.error || 'error') };
  if (data.success === true && data.saved === true && data.requestId === payload.requestId &&
      Number(data.apiVersion) >= AP_MIN_API_VERSION) {
    return { status:'ok', data };
  }
  if (data.success === true && !(Number(data.apiVersion) >= AP_MIN_API_VERSION)) return { status:'unknown', error:'old-api', data };
  return { status:'unknown', error:'unconfirmed', data };
}

// Full-screen "saving" layer + result dialog (fixed overlay: page layout untouched)
function apEnsureUi(){
  if (document.getElementById('ap-ui')) return;
  const css = document.createElement('style');
  css.textContent = '#ap-ui{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:16px}'
   + '#ap-ui.show{display:flex}#ap-box{background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit}'
   + '#ap-title{font-weight:800;font-size:17px;margin-bottom:8px}#ap-msg{font-size:14px;line-height:1.6;white-space:pre-line}'
   + '#ap-detail{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-word}'
   + '#ap-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}'
   + '#ap-btns button{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}'
   + '.ap-primary{background:#E60012;color:#fff}.ap-ghost{background:#eef0f3;color:#333}'
   + '.ap-spin{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#E60012;border-radius:50%;animation:apspin .7s linear infinite;vertical-align:middle;margin-right:8px}'
   + '@keyframes apspin{to{transform:rotate(360deg)}}#ap-box.warn #ap-title{color:#B45309}#ap-box.err #ap-title{color:#B91C1C}';
  document.head.appendChild(css);
  const ui = document.createElement('div');
  ui.id = 'ap-ui';
  ui.innerHTML = '<div id="ap-box"><div id="ap-title"></div><div id="ap-msg"></div><div id="ap-detail"></div><div id="ap-btns"></div></div>';
  document.body.appendChild(ui);
}
function apShowSaving(){
  apEnsureUi();
  document.getElementById('ap-box').className = '';
  document.getElementById('ap-title').innerHTML = '<span class="ap-spin"></span>' + apT().saving;
  document.getElementById('ap-msg').textContent = '';
  document.getElementById('ap-detail').textContent = '';
  document.getElementById('ap-btns').innerHTML = '';
  document.getElementById('ap-ui').classList.add('show');
}
function apHideUi(){ const u=document.getElementById('ap-ui'); if(u) u.classList.remove('show'); }
function apShowResult(result, onRetry){
  apEnsureUi();
  const L = apT();
  const unknown = result.status === 'unknown';
  document.getElementById('ap-box').className = unknown ? 'warn' : 'err';
  document.getElementById('ap-title').textContent = unknown ? ('⚠️ ' + L.unknownTitle) : ('❌ ' + L.failedTitle);
  let msg = unknown ? L.unknown : (result.offline ? L.offline : L.failed);
  if (unknown && result.error === 'old-api') msg = L.version;
  document.getElementById('ap-msg').textContent = msg;
  document.getElementById('ap-detail').textContent = (!unknown && !result.offline && result.error) ? result.error : '';
  const btns = document.getElementById('ap-btns');
  btns.innerHTML = '';
  const close = document.createElement('button'); close.className='ap-ghost'; close.textContent=L.close;
  close.onclick = apHideUi; btns.appendChild(close);
  if (onRetry) {
    const again = document.createElement('button'); again.className='ap-primary'; again.textContent=L.retry;
    again.onclick = () => { apHideUi(); onRetry(); }; btns.appendChild(again);
  }
  document.getElementById('ap-ui').classList.add('show');
}

/* One-call helper for a whole form:
   apRun({ key, url, buildPayload, makeExtra, onSaved, button })
   - blocks double clicks, keeps entries on failure/unknown, retries with the same requestId */
const apBusy = {};
async function apRun(o){
  if (apBusy[o.key]) { return; }
  apBusy[o.key] = true;
  const btn = o.button ? (typeof o.button === 'string' ? document.getElementById(o.button) : o.button) : null;
  const btnWasDisabled = btn ? btn.disabled : false;
  if (btn) btn.disabled = true;
  try {
    // Content signature: timestamps change on every click, so they don't count
    const stable = Object.assign({}, o.buildPayload(null));
    ['submittedAt','completedAt','updatedAt','openedAt','requestId'].forEach(k => delete stable[k]);
    const req = apRequestFor(o.key, stable, o.makeExtra);
    const payload = Object.assign({}, o.buildPayload(req.extra), { requestId:req.requestId, requestedAt:req.createdAt });
    apShowSaving();
    const result = await apSubmit(o.url, payload);
    if (result.status === 'ok') {
      apHideUi();
      apDone(o.key);
      o.onSaved(result.data, req.extra, payload);
    } else {
      apShowResult(result, () => apRun(o));
    }
    return result;
  } finally {
    apBusy[o.key] = false;
    if (btn) btn.disabled = btnWasDisabled;
  }
}
</script>
