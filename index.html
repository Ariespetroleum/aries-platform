<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff Portal — Aries Petroleum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --sinopec-red:#E60012;
  --sinopec-red-dark:#B8000E;
  --bp-green:#00A651;
  --bp-green-dark:#007A3D;
  --liberty-blue:#003DA5;
  --liberty-blue-dark:#002A73;
  --liberty-red:#CE1126;

  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --surface-soft:#F8FAFC;
  --border:#DDE3EA;
  --border-strong:#C9D2DD;

  --text:#142033;
  --muted:#667085;
  --label:#344054;

  --danger-light:#FFF1F2;
  --green-light:#ECFDF3;
  --blue-light:#EFF6FF;
  --orange-light:#FFF7ED;
  --purple-light:#FAF5FF;

  --radius:16px;
  --radius-sm:10px;
  --sans:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --shadow:0 4px 18px rgba(15,23,42,.08);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  font-family:var(--sans);
  background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);
  color:var(--text);
  min-height:100vh;
  padding-bottom:48px;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.header-left{display:flex;align-items:center;gap:10px}

.header-logo{
  width:32px;height:32px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}

.brand{
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  color:#fff;
}
.brand span{color:rgba(255,255,255,.7)}

.lang-toggle{
  display:flex;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  border-radius:9px;
  overflow:hidden;
}

.lang-btn{
  padding:6px 10px;
  font-family:var(--mono);
  font-size:11px;
  color:#fff;
  cursor:pointer;
  border:none;
  background:transparent;
  font-weight:600;
}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}

/* ── SCREENS ── */
.screen{display:none}
.screen.active{display:block}

/* ── WRAPPERS ── */
.confirm-wrap,
.station-wrap,
.menu-wrap{
  max-width:480px;
  margin:0 auto;
  padding:24px 16px 20px;
}

/* ── EYEBROW / HEADING ── */
.confirm-eyebrow,
.station-eyebrow,
.menu-date,
.section-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
  font-weight:700;
}

.confirm-heading,
.station-heading{
  font-size:22px;
  font-weight:800;
  line-height:1.3;
  margin-bottom:24px;
  color:var(--text);
}

.confirm-heading span,
.station-heading span,
.menu-greeting span{color:var(--sinopec-red)}

/* ── CONFIRM CARD ── */
.confirm-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}

.confirm-card-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
  font-weight:600;
}

.confirm-station-name{
  font-size:17px;
  font-weight:800;
  margin-bottom:4px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
}

.confirm-station-dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--bp-green);
  box-shadow:0 0 6px var(--bp-green);
  flex-shrink:0;
}

.confirm-station-loc{
  font-size:12px;
  color:var(--muted);
  margin-left:16px;
}

/* ── BUTTONS ── */
.btn-row{display:flex;flex-direction:column;gap:10px}

.btn{
  width:100%;
  border:none;
  border-radius:var(--radius-sm);
  font-family:var(--sans);
  font-size:14px;
  font-weight:800;
  padding:14px;
  cursor:pointer;
  transition:opacity .15s,transform .1s;
  text-align:center;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}

.btn-primary{
  background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));
  color:#fff;
  box-shadow:0 4px 14px rgba(230,0,18,.22);
}

.btn-secondary{
  background:var(--surface);
  color:var(--label);
  border:1.5px solid var(--border);
}

/* ── STATION SCREEN ── */
.station-sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
}

.station-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.station-opt{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:13px 16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:all .18s;
  box-shadow:var(--shadow-sm);
}

.station-opt:hover{
  border-color:var(--sinopec-red);
  box-shadow:0 0 0 3px rgba(230,0,18,.08);
  transform:translateX(2px);
}

.station-opt-left{display:flex;align-items:center;gap:12px}

.station-brand-dot{
  width:36px;height:36px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.dot-sinopec{background:#FFF1F2;color:var(--sinopec-red)}
.dot-bp{background:#ECFDF3;color:var(--bp-green-dark)}
.dot-liberty{background:#EFF6FF;color:var(--liberty-blue)}

.station-opt-name{font-size:14px;font-weight:700;color:var(--text)}
.station-opt-loc{font-size:11px;color:var(--muted);margin-top:2px}
.station-opt-arrow{color:var(--border-strong);font-size:16px;font-weight:700}

/* ── STATION BAR ── */
.station-bar{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  box-shadow:var(--shadow-sm);
}

.sbar-left{display:flex;align-items:center;gap:10px}

.sbar-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--bp-green);
  box-shadow:0 0 6px var(--bp-green);
  flex-shrink:0;
}

.sbar-name{font-size:13px;font-weight:700;color:var(--text)}
.sbar-date{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}

.sbar-change{
  font-size:11px;
  color:var(--liberty-blue);
  cursor:pointer;
  border:1px solid rgba(0,61,165,.25);
  padding:5px 12px;
  border-radius:7px;
  font-family:var(--mono);
  background:var(--blue-light);
  white-space:nowrap;
  font-weight:600;
}

/* ── MENU ── */
.menu-greeting{
  font-size:20px;
  font-weight:800;
  margin-bottom:20px;
  line-height:1.3;
  color:var(--text);
}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:22px;
}

.menu-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:15px 13px 13px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .18s;
  box-shadow:var(--shadow-sm);
}

.menu-card:hover{
  border-color:var(--border-strong);
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}

.menu-card:active{transform:scale(.98)}

.card-stripe{
  position:absolute;top:0;left:0;
  width:100%;height:4px;
}

.stripe-green{background:var(--bp-green)}
.stripe-red{background:var(--sinopec-red)}
.stripe-orange{background:#F97316}
.stripe-blue{background:var(--liberty-blue)}
.stripe-purple{background:#7C3AED}
.stripe-pink{background:#DB2777}

.card-icon{font-size:24px;margin-bottom:10px;display:block}

.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--muted);line-height:1.4}

.card-badge{
  position:absolute;top:10px;right:9px;
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.06em;padding:2px 6px;border-radius:4px;
}

.badge-daily{background:#ECFDF3;color:var(--bp-green-dark);border:1px solid #BBF7D0}
.badge-incident{background:#FFF1F2;color:var(--sinopec-red);border:1px solid #FECDD3}
.badge-ops{background:var(--purple-light);color:#7C3AED;border:1px solid #DDD6FE}

/* ── MAINTENANCE ALERT ── */
.maintenance-alert{
  background:var(--orange-light);
  border:1.5px solid #FED7AA;
  border-radius:var(--radius-sm);
  padding:13px;
  margin-bottom:14px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
}

.maintenance-alert-top{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}

.maintenance-alert-icon{
  width:24px;height:24px;border-radius:50%;
  background:#F97316;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex-shrink:0;
}

.maintenance-alert-title{
  font-size:12px;font-weight:800;
  color:#C2410C;
  letter-spacing:.04em;text-transform:uppercase;
}

.maintenance-alert-body{
  font-size:13px;color:var(--label);line-height:1.55;
}

.maintenance-alert-time{
  margin-top:4px;font-size:11px;
  color:var(--muted);font-family:var(--mono);
}

/* ── FOOTER ── */
.footer{
  text-align:center;
  padding:24px 20px 0;
  font-family:var(--mono);
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">⛽</div>
    <div class="brand">ARIES <span>STAFF</span></div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('zh')">中文</button>
  </div>
</div>

<div class="screen" id="screen-confirm">
  <div class="confirm-wrap">
    <div class="confirm-eyebrow" id="cf-eyebrow"></div>

      <div class="confirm-card-label" id="cf-label"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="cf-continue-btn" onclick="confirmStation()"></button>
      <button class="btn btn-secondary" id="cf-change-btn" onclick="showScreen('station')"></button>
    </div>
  </div>
</div>

<div class="screen" id="screen-station">
  <div class="station-wrap">
    <div class="station-eyebrow" id="s-eyebrow"></div>
    <div class="station-heading" id="s-heading"></div>
    <div class="station-sub" id="s-sub"></div>
    <div class="station-list" id="station-list"></div>

</div>

<div class="screen" id="screen-menu">

        <div class="card-title" id="c-cash-t"></div>
        <div class="card-sub" id="c-cash-s"></div>
      </div>

        <div class="card-stripe stripe-blue"></div>
        <span class="card-badge badge-daily" id="b-d5"></span>
        <span class="card-icon">⛽</span>
        <div class="card-title" id="c-fuel-t"></div>
        <div class="card-sub" id="c-fuel-s"></div>
      </div>
    </div>

    <!-- INCIDENT REPORTS -->
    <!-- Row 1: Refund | Complaint -->
    <!-- Row 2: Unpaid Fuel | Drive Off -->
    <div class="section-label" id="m-label-incident"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('refund.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-incident" id="b-i1"></span>
        <span class="card-icon">↩️</span>
        <div class="card-title" id="c-refund-t"></div>
        <div class="card-sub" id="c-refund-s"></div>
      </div>
      <div class="menu-card" onclick="go('complaint.html')">
        <div class="card-stripe stripe-pink"></div>
        <span class="card-badge badge-incident" id="b-i4"></span>
        <span class="card-icon">📋</span>
        <div class="card-title" id="c-cmp-t"></div>
        <div class="card-sub" id="c-cmp-s"></div>
      </div>
      <div class="menu-card" onclick="go('unpaid-fuel.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i2"></span>
        <span class="card-icon">⛽</span>
        <div class="card-title" id="c-uf-t"></div>
        <div class="card-sub" id="c-uf-s"></div>
      </div>
      <div class="menu-card" onclick="go('driveoff.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i3"></span>
        <span class="card-icon">🚗</span>
        <div class="card-title" id="c-do-t"></div>
        <div class="card-sub" id="c-do-s"></div>
      </div>
    </div>

    <!-- OPERATIONS -->
    <div class="section-label" id="m-label-ops"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('maintenance.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-ops" id="b-o1"></span>
        <span class="card-icon">🛠️</span>
        <div class="card-title" id="c-maint-t"></div>
        <div class="card-sub" id="c-maint-s"></div>
      </div>
      <div class="menu-card" onclick="go('roster.html')">
        <div class="card-stripe stripe-purple"></div>
        <span class="card-badge badge-ops" id="b-o2"></span>
        <span class="card-icon">📅</span>
        <div class="card-title" id="c-roster-t"></div>
        <div class="card-sub" id="c-roster-s"></div>
      </div>
    </div>

  </div>
</div>

      news:        { t:'报纸退货记录',   s:'每日退回登记' },
      cash:        { t:'收银对账',       s:'班次结算' },
      fuel:        { t:'Fuel & Dips',   s:'每日油量测量与燃油管理' },
      refund:      { t:'退款登记',       s:'退款原因与小票照片' },
      complaint:   { t:'投诉记录',       s:'客人投诉或员工发现的问题' },
      uf:          { t:'欠款燃油登记',   s:'客户留下了信息' },
      do:          { t:'Drive Off 登记', s:'逃单——无客户信息' },
      maintenance: { t:'维修登记',       s:'维修到场与离场完成记录' },
      roster:      { t:'查看排班',       s:'查看自己接下来的上班时间' }
    },
    footer: 'ARIES PETROLEUM · 员工端'
  }
};

let lang    = localStorage.getItem('ap_lang')    || 'en';
let station = localStorage.getItem('ap_station') || '';
let openMaintenanceJobs = [];

function t()            { return STRINGS[lang]; }
function stationData(n) { return STATIONS.find(s => s.name === n) || null; }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function setLang(l) {
  lang = l;
  localStorage.setItem('ap_lang', l);
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active',
      (l === 'en' && b.textContent === 'EN') ||
      (l === 'zh' && b.textContent === '中文')
    );
  });
  applyLang();
}

function applyLang() {
  const s = t();
  document.title = s.pageTitle;

  document.getElementById('cf-eyebrow').textContent      = s.cfEyebrow;
  document.getElementById('cf-heading').innerHTML        = s.cfHeading(station || '—');
  document.getElementById('cf-label').textContent        = s.cfLabel;
  document.getElementById('cf-continue-btn').textContent = s.cfContinue;
  document.getElementById('cf-change-btn').textContent   = s.cfChange;

  const sd = stationData(station);
  document.getElementById('cf-name').textContent = station || '—';
  document.getElementById('cf-loc').textContent  = sd ? sd.loc : '';

  document.getElementById('s-eyebrow').textContent = s.sEyebrow;
  document.getElementById('s-heading').innerHTML   = s.sHeading;
  document.getElementById('s-sub').textContent     = s.sSub;

  buildStationList();

  document.getElementById('sbar-change').textContent = s.sbarChange;
  document.getElementById('sbar-name').textContent   = station || '—';

  document.getElementById('m-label-daily').textContent    = s.mLabelDaily;
  document.getElementById('m-label-incident').textContent = s.mLabelIncident;
  document.getElementById('m-label-ops').textContent      = s.mLabelOps;

  ['b-d1','b-d2','b-d3','b-d4','b-d5'].forEach(id => document.getElementById(id).textContent = s.bDaily);
  ['b-i1','b-i2','b-i3','b-i4'].forEach(id => document.getElementById(id).textContent = s.bIncident);
  ['b-o1','b-o2'].forEach(id => document.getElementById(id).textContent = s.bOps);

  setCard('temp',        'c-temp-t',   'c-temp-s');
  setCard('cig',         'c-cig-t',    'c-cig-s');
  setCard('news',        'c-news-t',   'c-news-s');
  setCard('cash',        'c-cash-t',   'c-cash-s');
  setCard('fuel',        'c-fuel-t',   'c-fuel-s');
  setCard('refund',      'c-refund-t', 'c-refund-s');
  setCard('complaint',   'c-cmp-t',    'c-cmp-s');
  setCard('uf',          'c-uf-t',     'c-uf-s');
  setCard('do',          'c-do-t',     'c-do-s');
  setCard('maintenance', 'c-maint-t',  'c-maint-s');
  setCard('roster',      'c-roster-t', 'c-roster-s');

  document.getElementById('footer-txt').textContent = s.footer;

  updateDateGreeting();
  renderMaintenanceAlerts();
}

function setCard(key, titleId, subId) {
  const c = t().cards[key];
  document.getElementById(titleId).textContent = c.t;
  document.getElementById(subId).textContent   = c.s;
}

function buildStationList() {
  const box = document.getElementById('station-list');
  box.innerHTML = '';
  STATIONS.forEach(st => {
    const div = document.createElement('div');
    div.className = 'station-opt';
    div.onclick = () => selectStation(st.name);
    div.innerHTML = `
      <div class="station-opt-left">
        <div class="station-brand-dot ${st.cls}">${st.icon}</div>
        <div>
          <div class="station-opt-name">${st.name}</div>
          <div class="station-opt-loc">${st.loc}</div>
        </div>
      </div>
      <div class="station-opt-arrow">›</div>
    `;
    box.appendChild(div);
  });
}

function selectStation(name) {
  station = name;
  localStorage.setItem('ap_station', name);
  applyLang();
  showScreen('menu');
  loadOpenMaintenance();
}

function confirmStation() {
  showScreen('menu');
  loadOpenMaintenance();
}

function go(page)        { window.location.href = page; }
function goExternal(url) { window.location.href = url; }

function updateDateGreeting() {
  const now = new Date();
  const dateStr = now.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-AU', {
    weekday:'long', year:'numeric', month:'short', day:'numeric'
  });
  document.getElementById('sbar-date').textContent = dateStr;
  document.getElementById('m-date').textContent    = dateStr.toUpperCase();

  const hour = now.getHours();
  let g = 'morning';
  if (hour >= 12 && hour < 18) g = 'afternoon';
  if (hour >= 18 || hour < 5)  g = 'evening';
  document.getElementById('m-greeting').innerHTML = t().greeting(t().greet[g]);
}

async function loadOpenMaintenance() {
  if (!station || !WEB_APP_URL) {
    openMaintenanceJobs = getLocalOpenMaintenanceJobs();
    renderMaintenanceAlerts();
    return;
  }
  try {
    const url = `${WEB_APP_URL}?action=getOpenMaintenance&station=${encodeURIComponent(station)}&t=${Date.now()}`;
    const res  = await fetch(url, { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    openMaintenanceJobs = (data && data.success && Array.isArray(data.jobs))
      ? data.jobs
      : getLocalOpenMaintenanceJobs();
  } catch(e) {
    openMaintenanceJobs = getLocalOpenMaintenanceJobs();
  }
  renderMaintenanceAlerts();
}

function getLocalOpenMaintenanceJobs() {
  if (!station) return [];
  const jobs = [];
  Object.keys(localStorage).forEach(key => {
    if (!key.startsWith('ap_open_maintenance_')) return;
    try {
      const job = JSON.parse(localStorage.getItem(key));
      if (job && (job.station === station || key === 'ap_open_maintenance_' + station)) jobs.push(job);
    } catch(e) {}
  });
  return jobs;
}

function renderMaintenanceAlerts() {
  const box = document.getElementById('maintenance-alerts');
  if (!box) return;
  const jobs = openMaintenanceJobs || [];
  const s = t();
  if (!jobs.length) { box.innerHTML = ''; return; }
  box.innerHTML = jobs.map(job => `
    <div class="maintenance-alert" onclick="go('maintenance.html')">
      <div class="maintenance-alert-top">
        <div class="maintenance-alert-icon">!</div>
        <div class="maintenance-alert-title">${s.maintenanceAlert}</div>
      </div>
      <div class="maintenance-alert-body">
        <div><strong>${escapeHtml(job.companyName||job.CompanyName||'Contractor')}</strong>
        — ${escapeHtml(job.equipmentDisplay||job.EquipmentDisplay||job.equipment||job.Equipment||'Equipment')}</div>
        <div class="maintenance-alert-time">Arrived ${escapeHtml(job.arrivalTime||job.ArrivalTime||'--:--')}</div>
        <div class="maintenance-alert-time">${s.maintenanceAlertClick}</div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return String(str||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
document.querySelectorAll('.lang-btn').forEach(b => {
  b.classList.toggle('active',
    (lang === 'en' && b.textContent === 'EN') ||
    (lang === 'zh' && b.textContent === '中文')
  );
});

applyLang();

if (station) {
  showScreen('confirm');
  loadOpenMaintenance();
} else {
  showScreen('station');
}

setInterval(() => { if (station) loadOpenMaintenance(); }, 60000);
</script>

</body>
</html>
