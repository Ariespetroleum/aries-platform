<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff Portal — Aries Petroleum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f1117;
  --surface: #181c25;
  --surface2: #1f2433;
  --border: #2a3044;
  --border2: #353f58;
  --accent: #4ade80;
  --accent2: #22d3ee;
  --warn: #fb923c;
  --danger: #f87171;
  --purple: #a78bfa;
  --text: #e8eaf0;
  --muted: #7a8299;
  --mono: 'DM Mono', monospace;
  --sans: 'Sora', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  padding-bottom: 48px;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left { display: flex; align-items: center; gap: 10px; }

.logo-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2.5s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.brand { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
.brand span { color: var(--muted); font-weight: 400; }

.lang-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.lang-btn {
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: transparent;
  transition: all .15s;
  letter-spacing: .04em;
}

.lang-btn.active { background: var(--border2); color: var(--text); }

.screen { display: none; }
.screen.active { display: block; }

.confirm-wrap,
.station-wrap,
.menu-wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 16px 20px;
}

.confirm-eyebrow,
.station-eyebrow,
.menu-date,
.section-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.confirm-heading,
.station-heading {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 28px;
}

.confirm-heading span,
.station-heading span,
.menu-greeting span { color: var(--accent2); }

.confirm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 14px;
}

.confirm-card-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

.confirm-station-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.confirm-station-loc {
  font-size: 12px;
  color: var(--muted);
}

.confirm-station-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  margin-right: 8px;
}

.btn-row { display: flex; flex-direction: column; gap: 10px; }

.btn {
  width: 100%;
  border: none;
  border-radius: 10px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  padding: 14px;
  cursor: pointer;
  letter-spacing: .02em;
  transition: opacity .18s, transform .1s;
}

.btn:active { transform: scale(.98); }

.btn-primary { background: var(--accent); color: #071a0d; }

.btn-secondary {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}

.station-sub {
  font-size: 13px;
  color: var(--muted);
}

.station-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.station-opt {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all .18s;
}

.station-opt:hover {
  background: var(--surface2);
  border-color: var(--border2);
  transform: translateX(3px);
}

.station-opt-left { display: flex; align-items: center; gap: 12px; }

.station-brand-dot {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.dot-sinopec { background: rgba(34,211,238,.1); }
.dot-bp { background: rgba(74,222,128,.1); }
.dot-liberty { background: rgba(251,146,60,.1); }

.station-opt-name {
  font-size: 14px;
  font-weight: 600;
}

.station-opt-loc {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.station-opt-arrow {
  color: var(--border2);
  font-size: 16px;
}

.station-bar {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.sbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sbar-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

.sbar-name {
  font-size: 13px;
  font-weight: 600;
}

.sbar-date {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-family: var(--mono);
}

.sbar-change {
  font-size: 11px;
  color: var(--accent2);
  cursor: pointer;
  border: 1px solid rgba(34,211,238,.2);
  padding: 5px 11px;
  border-radius: 6px;
  font-family: var(--mono);
  background: rgba(34,211,238,.06);
  white-space: nowrap;
}

.menu-greeting {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 22px;
  line-height: 1.3;
}

.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.menu-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 14px 14px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all .18s;
}

.menu-card:hover {
  background: var(--surface2);
  border-color: var(--border2);
  transform: translateY(-2px);
}

.card-stripe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  border-radius: 12px 12px 0 0;
}

.stripe-green { background: linear-gradient(90deg, var(--accent), transparent); }
.stripe-red { background: linear-gradient(90deg, var(--danger), transparent); }
.stripe-orange { background: linear-gradient(90deg, var(--warn), transparent); }
.stripe-blue { background: linear-gradient(90deg, var(--accent2), transparent); }
.stripe-purple { background: linear-gradient(90deg, var(--purple), transparent); }

.card-icon {
  font-size: 24px;
  margin-bottom: 10px;
  display: block;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 3px;
}

.card-sub {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

.card-badge {
  position: absolute;
  top: 12px;
  right: 10px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .06em;
  padding: 2px 6px;
  border-radius: 4px;
}

.badge-daily {
  background: rgba(74,222,128,.1);
  color: var(--accent);
  border: 1px solid rgba(74,222,128,.2);
}

.badge-incident {
  background: rgba(248,113,113,.1);
  color: var(--danger);
  border: 1px solid rgba(248,113,113,.2);
}

.badge-ops {
  background: rgba(167,139,250,.1);
  color: var(--purple);
  border: 1px solid rgba(167,139,250,.2);
}

.maintenance-alert {
  background: rgba(251,146,60,.08);
  border: 1px solid rgba(251,146,60,.25);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  cursor: pointer;
}

.maintenance-alert-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.maintenance-alert-icon {
  color: var(--warn);
  font-weight: 700;
}

.maintenance-alert-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--warn);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.maintenance-alert-body {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
}

.maintenance-alert-time {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
}

.footer {
  text-align: center;
  padding: 24px 20px 0;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--border2);
  letter-spacing: .06em;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-left">
    <div class="logo-dot"></div>
    <div class="brand">ARIES <span>STAFF</span></div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('zh')">中文</button>
  </div>
</div>

<div class="screen" id="screen-confirm">
  <div class="confirm-wrap">
    <div class="confirm-eyebrow" id="cf-eyebrow"></div>
    <div class="confirm-heading" id="cf-heading"></div>

    <div class="confirm-card">
      <div class="confirm-card-label" id="cf-label"></div>
      <div class="confirm-station-name">
        <span class="confirm-station-dot"></span>
        <span id="cf-name">—</span>
      </div>
      <div class="confirm-station-loc" id="cf-loc">—</div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="cf-continue-btn" onclick="confirmStation()"></button>
      <button class="btn btn-secondary" id="cf-change-btn" onclick="showScreen('station')"></button>
    </div>
  </div>
</div>

<div class="screen" id="screen-station">
  <div class="station-wrap">
    <div class="station-hero">
      <div class="station-eyebrow" id="s-eyebrow"></div>
      <div class="station-heading" id="s-heading"></div>
      <div class="station-sub" id="s-sub"></div>
    </div>
    <div class="station-list" id="station-list"></div>
  </div>
</div>

<div class="screen" id="screen-menu">
  <div class="menu-wrap">

    <div class="station-bar">
      <div class="sbar-left">
        <div class="sbar-dot"></div>
        <div>
          <div class="sbar-name" id="sbar-name">—</div>
          <div class="sbar-date" id="sbar-date">—</div>
        </div>
      </div>
      <div class="sbar-change" id="sbar-change" onclick="showScreen('station')"></div>
    </div>

    <div id="maintenance-alerts"></div>

    <div class="menu-date" id="m-date"></div>
    <div class="menu-greeting" id="m-greeting"></div>

    <div class="section-label" id="m-label-daily"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('temperature.html')">
        <div class="card-stripe stripe-green"></div>
        <span class="card-badge badge-daily" id="b-d1"></span>
        <span class="card-icon">🌡️</span>
        <div class="card-title" id="c-temp-t"></div>
        <div class="card-sub" id="c-temp-s"></div>
      </div>

      <div class="menu-card" onclick="go('cigarette.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-daily" id="b-d2"></span>
        <span class="card-icon">🚬</span>
        <div class="card-title" id="c-cig-t"></div>
        <div class="card-sub" id="c-cig-s"></div>
      </div>

      <div class="menu-card" onclick="go('newspaper.html')">
        <div class="card-stripe stripe-blue"></div>
        <span class="card-badge badge-daily" id="b-d3"></span>
        <span class="card-icon">📰</span>
        <div class="card-title" id="c-news-t"></div>
        <div class="card-sub" id="c-news-s"></div>
      </div>

      <div class="menu-card" onclick="go('cash.html')">
        <div class="card-stripe stripe-purple"></div>
        <span class="card-badge badge-daily" id="b-d4"></span>
        <span class="card-icon">💰</span>
        <div class="card-title" id="c-cash-t"></div>
        <div class="card-sub" id="c-cash-s"></div>
      </div>
    </div>

    <div class="section-label" id="m-label-incident"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('refund.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-incident" id="b-i1"></span>
        <span class="card-icon">↩️</span>
        <div class="card-title" id="c-refund-t"></div>
        <div class="card-sub" id="c-refund-s"></div>
      </div>

      <div class="menu-card" onclick="go('unpaid-fuel.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i2"></span>
        <span class="card-icon">⛽</span>
        <div class="card-title" id="c-uf-t"></div>
        <div class="card-sub" id="c-uf-s"></div>
      </div>

      <div class="menu-card" onclick="go('driveoff.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i3"></span>
        <span class="card-icon">🚗</span>
        <div class="card-title" id="c-do-t"></div>
        <div class="card-sub" id="c-do-s"></div>
      </div>
    </div>

    <div class="section-label" id="m-label-ops"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('maintenance.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-ops" id="b-o1"></span>
        <span class="card-icon">🛠️</span>
        <div class="card-title" id="c-maint-t"></div>
        <div class="card-sub" id="c-maint-s"></div>
      </div>

      <div class="menu-card" onclick="go('roster.html')">
        <div class="card-stripe stripe-purple"></div>
        <span class="card-badge badge-ops" id="b-o2"></span>
        <span class="card-icon">📅</span>
        <div class="card-title" id="c-roster-t"></div>
        <div class="card-sub" id="c-roster-s"></div>
      </div>
    </div>

  </div>
</div>

<div class="footer" id="footer-txt"></div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';

const STATIONS = [
  { name:'Sinopec Frankston', loc:'Frankston, VIC', cls:'dot-sinopec', icon:'⛽' },
  { name:'Sinopec Thomastown', loc:'Thomastown, VIC', cls:'dot-sinopec', icon:'⛽' },
  { name:'Sinopec Shepparton', loc:'Shepparton, VIC', cls:'dot-sinopec', icon:'⛽' },
  { name:'Sinopec Ballarat', loc:'Ballarat, VIC', cls:'dot-sinopec', icon:'⛽' },
  { name:'BP Clayton South', loc:'Clayton South, VIC', cls:'dot-bp', icon:'⛽' },
  { name:'BP Flemington', loc:'Flemington, VIC', cls:'dot-bp', icon:'⛽' },
  { name:'Liberty Golden Square', loc:'Golden Square, VIC', cls:'dot-liberty', icon:'⛽' }
];

const STRINGS = {
  en: {
    pageTitle: 'Staff Portal — Aries Petroleum',
    cfEyebrow: 'Welcome back',
    cfHeading: s => `Are you working at<br><span>${s}</span> today?`,
    cfLabel: 'Current station',
    cfContinue: 'Yes, continue →',
    cfChange: 'No, change station',
    sEyebrow: 'Select your station',
    sHeading: 'Where are you<br><span>working today?</span>',
    sSub: 'Tap your site to continue.',
    sbarChange: 'Change',
    mLabelDaily: '📋 Daily Forms',
    mLabelIncident: '🚨 Incident Reports',
    mLabelOps: '🧩 Operations',
    bDaily: 'DAILY',
    bIncident: 'INCIDENT',
    bOps: 'OPS',
    greeting: g => `Good ${g} — <span>what are you filing today?</span>`,
    greet: { morning:'morning', afternoon:'afternoon', evening:'evening' },
    maintenanceAlert: 'Maintenance In Progress',
    maintenanceAlertClick: 'Tap here to complete final record',
    maintenanceSyncFail: 'Could not sync maintenance status. Local reminder may still appear.',
    cards: {
      temp: { t:'Temperature Log', s:'Morning / Afternoon / Night' },
      cig: { t:'Cigarette Stock', s:'End of shift count' },
      news: { t:'Newspaper Returns', s:'Daily return record' },
      cash: { t:'Cash Reconciliation', s:'Shift end settlement' },
      refund: { t:'Refund Record', s:'Refund reason & receipt photo' },
      uf: { t:'Unpaid Fuel', s:'Customer left details' },
      do: { t:'Drive Off', s:'Unpaid fuel — no ID left' },
      maintenance: { t:'Maintenance Record', s:'Contractor arrival & completion' },
      roster: { t:'View Roster', s:'Check your upcoming shifts' }
    },
    footer: 'ARIES PETROLEUM · STAFF PORTAL'
  },
  zh: {
    pageTitle: '员工端 — Aries Petroleum',
    cfEyebrow: '欢迎回来',
    cfHeading: s => `今天在 <span>${s}</span> 上班吗？`,
    cfLabel: '当前站点',
    cfContinue: '是，继续 →',
    cfChange: '不，更换站点',
    sEyebrow: '选择站点',
    sHeading: '今天在哪里<br><span>上班？</span>',
    sSub: '点击选择站点以继续。',
    sbarChange: '更改',
    mLabelDaily: '📋 每日表单',
    mLabelIncident: '🚨 事故报告',
    mLabelOps: '🧩 运营功能',
    bDaily: '每日',
    bIncident: '事故',
    bOps: '运营',
    greeting: () => `您好 — <span>今天填哪个表？</span>`,
    greet: { morning:'', afternoon:'', evening:'' },
    maintenanceAlert: '维修仍在进行中',
    maintenanceAlertClick: '点击这里完成最终登记',
    maintenanceSyncFail: '无法同步维修状态，可能只显示本机提醒。',
    cards: {
      temp: { t:'温度记录', s:'早班 / 午班 / 夜班' },
      cig: { t:'香烟库存盘点', s:'班次结束时填写' },
      news: { t:'报纸退货记录', s:'每日退回登记' },
      cash: { t:'收银对账', s:'班次结算' },
      refund: { t:'退款登记', s:'退款原因与小票照片' },
      uf: { t:'欠款燃油登记', s:'客户留下了信息' },
      do: { t:'Drive Off 登记', s:'逃单——无客户信息' },
      maintenance: { t:'维修登记', s:'维修到场与离场完成记录' },
      roster: { t:'查看排班', s:'查看自己接下来的上班时间' }
    },
    footer: 'ARIES PETROLEUM · 员工端'
  }
};

let lang = localStorage.getItem('ap_lang') || 'en';
let station = localStorage.getItem('ap_station') || '';
let openMaintenanceJobs = [];

function t() { return STRINGS[lang]; }

function stationData(name) {
  return STATIONS.find(s => s.name === name) || null;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function setLang(l) {
  lang = l;
  localStorage.setItem('ap_lang', l);

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle(
      'active',
      (l === 'en' && b.textContent === 'EN') ||
      (l === 'zh' && b.textContent === '中文')
    );
  });

  applyLang();
}

function applyLang() {
  const s = t();

  document.title = s.pageTitle;

  document.getElementById('cf-eyebrow').textContent = s.cfEyebrow;
  document.getElementById('cf-heading').innerHTML = s.cfHeading(station || '—');
  document.getElementById('cf-label').textContent = s.cfLabel;
  document.getElementById('cf-continue-btn').textContent = s.cfContinue;
  document.getElementById('cf-change-btn').textContent = s.cfChange;

  const sd = stationData(station);
  document.getElementById('cf-name').textContent = station || '—';
  document.getElementById('cf-loc').textContent = sd ? sd.loc : '';

  document.getElementById('s-eyebrow').textContent = s.sEyebrow;
  document.getElementById('s-heading').innerHTML = s.sHeading;
  document.getElementById('s-sub').textContent = s.sSub;

  buildStationList();

  document.getElementById('sbar-change').textContent = s.sbarChange;
  document.getElementById('sbar-name').textContent = station || '—';

  document.getElementById('m-label-daily').textContent = s.mLabelDaily;
  document.getElementById('m-label-incident').textContent = s.mLabelIncident;
  document.getElementById('m-label-ops').textContent = s.mLabelOps;

  ['b-d1','b-d2','b-d3','b-d4'].forEach(id => document.getElementById(id).textContent = s.bDaily);
  ['b-i1','b-i2','b-i3'].forEach(id => document.getElementById(id).textContent = s.bIncident);
  ['b-o1','b-o2'].forEach(id => document.getElementById(id).textContent = s.bOps);

  setCard('temp', 'c-temp-t', 'c-temp-s');
  setCard('cig', 'c-cig-t', 'c-cig-s');
  setCard('news', 'c-news-t', 'c-news-s');
  setCard('cash', 'c-cash-t', 'c-cash-s');
  setCard('refund', 'c-refund-t', 'c-refund-s');
  setCard('uf', 'c-uf-t', 'c-uf-s');
  setCard('do', 'c-do-t', 'c-do-s');
  setCard('maintenance', 'c-maint-t', 'c-maint-s');
  setCard('roster', 'c-roster-t', 'c-roster-s');

  document.getElementById('footer-txt').textContent = s.footer;

  updateDateGreeting();
  renderMaintenanceAlerts();
}

function setCard(key, titleId, subId) {
  const c = t().cards[key];
  document.getElementById(titleId).textContent = c.t;
  document.getElementById(subId).textContent = c.s;
}

function buildStationList() {
  const box = document.getElementById('station-list');
  box.innerHTML = '';

  STATIONS.forEach(st => {
    const div = document.createElement('div');
    div.className = 'station-opt';
    div.onclick = () => selectStation(st.name);

    div.innerHTML = `
      <div class="station-opt-left">
        <div class="station-brand-dot ${st.cls}">${st.icon}</div>
        <div>
          <div class="station-opt-name">${st.name}</div>
          <div class="station-opt-loc">${st.loc}</div>
        </div>
      </div>
      <div class="station-opt-arrow">›</div>
    `;

    box.appendChild(div);
  });
}

function selectStation(name) {
  station = name;
  localStorage.setItem('ap_station', name);
  applyLang();
  showScreen('menu');
  loadOpenMaintenance();
}

function confirmStation() {
  showScreen('menu');
  loadOpenMaintenance();
}

function go(page) {
  window.location.href = page;
}

function updateDateGreeting() {
  const now = new Date();

  const dateStr = now.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-AU', {
    weekday: 'long',
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });

  document.getElementById('sbar-date').textContent = dateStr;
  document.getElementById('m-date').textContent = dateStr.toUpperCase();

  const hour = now.getHours();
  let g = 'morning';

  if (hour >= 12 && hour < 18) g = 'afternoon';
  if (hour >= 18 || hour < 5) g = 'evening';

  document.getElementById('m-greeting').innerHTML = t().greeting(t().greet[g]);
}

async function loadOpenMaintenance() {
  if (!station || !WEB_APP_URL) {
    openMaintenanceJobs = getLocalOpenMaintenanceJobs();
    renderMaintenanceAlerts();
    return;
  }

  try {
    const url = `${WEB_APP_URL}?action=getOpenMaintenance&station=${encodeURIComponent(station)}&t=${Date.now()}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
    const data = await res.json();

    if (data && data.success && Array.isArray(data.jobs)) {
      openMaintenanceJobs = data.jobs;
    } else {
      openMaintenanceJobs = getLocalOpenMaintenanceJobs();
    }

  } catch (e) {
    openMaintenanceJobs = getLocalOpenMaintenanceJobs();
  }

  renderMaintenanceAlerts();
}

function getLocalOpenMaintenanceJobs() {
  if (!station) return [];

  const jobs = [];

  Object.keys(localStorage).forEach(key => {
    if (!key.startsWith('ap_open_maintenance_')) return;

    try {
      const job = JSON.parse(localStorage.getItem(key));
      if (!job) return;

      if (job.station === station || key === 'ap_open_maintenance_' + station) {
        jobs.push(job);
      }
    } catch (e) {}
  });

  return jobs;
}

function renderMaintenanceAlerts() {
  const box = document.getElementById('maintenance-alerts');
  if (!box) return;

  const jobs = openMaintenanceJobs || [];
  const s = t();

  if (!jobs.length) {
    box.innerHTML = '';
    return;
  }

  box.innerHTML = jobs.map(job => `
    <div class="maintenance-alert" onclick="go('maintenance.html')">
      <div class="maintenance-alert-top">
        <div class="maintenance-alert-icon">!</div>
        <div class="maintenance-alert-title">${s.maintenanceAlert}</div>
      </div>

      <div class="maintenance-alert-body">
        <div>
          <strong>${escapeHtml(job.companyName || job.CompanyName || 'Contractor')}</strong>
          — ${escapeHtml(job.equipmentDisplay || job.EquipmentDisplay || job.equipment || job.Equipment || 'Equipment')}
        </div>

        <div class="maintenance-alert-time">
          Arrived ${escapeHtml(job.arrivalTime || job.ArrivalTime || '--:--')}
        </div>

        <div class="maintenance-alert-time">
          ${s.maintenanceAlertClick}
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

document.querySelectorAll('.lang-btn').forEach(b => {
  b.classList.toggle(
    'active',
    (lang === 'en' && b.textContent === 'EN') ||
    (lang === 'zh' && b.textContent === '中文')
  );
});

applyLang();

if (station) {
  showScreen('confirm');
  loadOpenMaintenance();
} else {
  showScreen('station');
}

setInterval(() => {
  if (station) {
    loadOpenMaintenance();
  }
}, 60000);
</script>

</body>
</html>
