<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff Portal — Aries Petroleum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sinopec-red:#E60012;--sinopec-red-dark:#B8000E;
  --bp-green:#00A651;--bp-green-dark:#007A3D;
  --liberty-blue:#003DA5;--liberty-blue-dark:#002A73;
  --liberty-red:#CE1126;
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-soft:#F8FAFC;
  --border:#DDE3EA;--border-strong:#C9D2DD;
  --text:#142033;--muted:#667085;--label:#344054;
  --danger-light:#FFF1F2;--green-light:#ECFDF3;--blue-light:#EFF6FF;
  --orange-light:#FFF7ED;--purple-light:#FAF5FF;
  --radius:16px;--radius-sm:10px;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);min-height:100vh;padding-bottom:48px}
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:32px;height:32px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;color:#fff}
.brand span{color:rgba(255,255,255,.7)}
.header-right{display:flex;align-items:center;gap:8px}
.staff-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 10px 4px 4px;cursor:pointer;transition:background .2s}
.staff-chip:hover{background:rgba(255,255,255,.25)}
.staff-chip-avatar{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--sinopec-red);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.staff-chip-name{font-family:var(--mono);font-size:11px;color:#fff;font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.lang-btn{padding:6px 10px;font-family:var(--mono);font-size:11px;color:#fff;cursor:pointer;border:none;background:transparent;font-weight:600}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}
.screen{display:none}.screen.active{display:block}
.confirm-wrap,.station-wrap,.menu-wrap{max-width:480px;margin:0 auto;padding:24px 16px 20px}
.confirm-eyebrow,.station-eyebrow,.menu-date,.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
.confirm-heading,.station-heading{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:24px;color:var(--text)}
.confirm-heading span,.station-heading span,.menu-greeting span{color:var(--sinopec-red)}
.confirm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.confirm-card-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.confirm-station-name{font-size:17px;font-weight:800;margin-bottom:4px;color:var(--text);display:flex;align-items:center;gap:8px}
.confirm-station-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 6px var(--bp-green);flex-shrink:0}
.confirm-station-loc{font-size:12px;color:var(--muted);margin-left:16px}
.btn-row{display:flex;flex-direction:column;gap:10px}
.btn{width:100%;border:none;border-radius:var(--radius-sm);font-family:var(--sans);font-size:14px;font-weight:800;padding:14px;cursor:pointer;transition:opacity .15s,transform .1s;text-align:center}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;box-shadow:0 4px 14px rgba(230,0,18,.22)}
.btn-secondary{background:var(--surface);color:var(--label);border:1.5px solid var(--border)}
.station-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.station-list{display:flex;flex-direction:column;gap:8px}
.station-opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .18s;box-shadow:var(--shadow-sm)}
.station-opt:hover{border-color:var(--sinopec-red);box-shadow:0 0 0 3px rgba(230,0,18,.08);transform:translateX(2px)}
.station-opt-left{display:flex;align-items:center;gap:12px}
.station-brand-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dot-sinopec{background:#FFF1F2;color:var(--sinopec-red)}
.dot-bp{background:#ECFDF3;color:var(--bp-green-dark)}
.dot-liberty{background:#EFF6FF;color:var(--liberty-blue)}
.station-opt-name{font-size:14px;font-weight:700;color:var(--text)}
.station-opt-loc{font-size:11px;color:var(--muted);margin-top:2px}
.station-opt-arrow{color:var(--border-strong);font-size:16px;font-weight:700}
.station-bar{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.sbar-left{display:flex;align-items:center;gap:10px}
.sbar-dot{width:8px;height:8px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 6px var(--bp-green);flex-shrink:0}
.sbar-name{font-size:13px;font-weight:700;color:var(--text)}
.sbar-date{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.sbar-change{font-size:11px;color:var(--liberty-blue);cursor:pointer;border:1px solid rgba(0,61,165,.25);padding:5px 12px;border-radius:7px;font-family:var(--mono);background:var(--blue-light);white-space:nowrap;font-weight:600}
.menu-greeting{font-size:20px;font-weight:800;margin-bottom:20px;line-height:1.4;color:var(--text)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.menu-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:15px 13px 13px;cursor:pointer;position:relative;overflow:hidden;transition:all .18s;box-shadow:var(--shadow-sm)}
.menu-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-2px)}
.menu-card:active{transform:scale(.98)}
.card-stripe{position:absolute;top:0;left:0;width:100%;height:4px}
.stripe-green{background:var(--bp-green)}.stripe-red{background:var(--sinopec-red)}
.stripe-orange{background:#F97316}.stripe-blue{background:var(--liberty-blue)}
.stripe-purple{background:#7C3AED}.stripe-pink{background:#DB2777}
.stripe-teal{background:#0D9488}
.card-icon{font-size:24px;margin-bottom:10px;display:block}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--muted);line-height:1.4}
.card-badge{position:absolute;top:10px;right:9px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px}
.badge-daily{background:#ECFDF3;color:var(--bp-green-dark);border:1px solid #BBF7D0}
.badge-incident{background:#FFF1F2;color:var(--sinopec-red);border:1px solid #FECDD3}
.badge-ops{background:var(--purple-light);color:#7C3AED;border:1px solid #DDD6FE}
.badge-reward{background:#EFF6FF;color:var(--liberty-blue);border:1px solid #BFDBFE}
.maintenance-alert{background:var(--orange-light);border:1.5px solid #FED7AA;border-radius:var(--radius-sm);padding:13px;margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow-sm)}
.maintenance-alert-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.maintenance-alert-icon{width:24px;height:24px;border-radius:50%;background:#F97316;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.maintenance-alert-title{font-size:12px;font-weight:800;color:#C2410C;letter-spacing:.04em;text-transform:uppercase}
.maintenance-alert-body{font-size:13px;color:var(--label);line-height:1.55}
.maintenance-alert-time{margin-top:4px;font-size:11px;color:var(--muted);font-family:var(--mono)}
/* Name modal */
.name-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.name-card{background:var(--surface);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}
.name-card-icon{font-size:36px;margin-bottom:12px}
.name-card-title{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--text)}
.name-card-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.name-input{width:100%;background:var(--surface-soft);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;font-family:var(--sans);color:var(--text);outline:none;text-align:center;margin-bottom:14px;transition:border-color .2s}
.name-input:focus{border-color:var(--sinopec-red);box-shadow:0 0 0 3px rgba(230,0,18,.1)}
.name-input::placeholder{color:var(--muted)}
.name-btn{width:100%;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));color:#fff;font-family:var(--sans);font-size:14px;font-weight:800;padding:13px;cursor:pointer;transition:opacity .15s}
.name-btn:hover{opacity:.9}
.name-btn:disabled{opacity:.45;cursor:not-allowed}
.name-skip{display:block;margin-top:10px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:none;width:100%;font-family:var(--sans)}
.footer{text-align:center;padding:24px 20px 0;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>

<!-- Name modal -->
<div class="name-overlay" id="name-overlay" style="display:none">
  <div class="name-card">
    <div class="name-card-icon">👋</div>
    <div class="name-card-title" id="nm-title">What's your name?</div>
    <div class="name-card-sub" id="nm-sub">We'll remember you for this session so you don't have to type it every time.</div>
    <input class="name-input" id="name-input" type="text" placeholder="Your name..." autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="name-btn" id="name-btn" onclick="saveName()">Let's go →</button>
    <button class="name-skip" id="name-skip" onclick="skipName()">Skip for now</button>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <div class="header-logo">⛽</div>
    <div class="brand">ARIES <span>STAFF</span></div>
  </div>
  <div class="header-right">
    <div class="staff-chip" id="staff-chip" onclick="promptName()" style="display:none">
      <div class="staff-chip-avatar" id="staff-chip-avatar">?</div>
      <span class="staff-chip-name" id="staff-chip-name">—</span>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-confirm">
  <div class="confirm-wrap">
    <div class="confirm-eyebrow" id="cf-eyebrow"></div>
    <div class="confirm-heading" id="cf-heading"></div>
    <div class="confirm-card">
      <div class="confirm-card-label" id="cf-label"></div>
      <div class="confirm-station-name">
        <span class="confirm-station-dot"></span>
        <span id="cf-name">—</span>
      </div>
      <div class="confirm-station-loc" id="cf-loc">—</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="cf-continue-btn" onclick="confirmStation()"></button>
      <button class="btn btn-secondary" id="cf-change-btn" onclick="showScreen('station')"></button>
    </div>
  </div>
</div>

<div class="screen" id="screen-station">
  <div class="station-wrap">
    <div class="station-eyebrow" id="s-eyebrow"></div>
    <div class="station-heading" id="s-heading"></div>
    <div class="station-sub" id="s-sub"></div>
    <div class="station-list" id="station-list"></div>
  </div>
</div>

<div class="screen" id="screen-menu">
  <div class="menu-wrap">
    <div class="station-bar">
      <div class="sbar-left">
        <div class="sbar-dot"></div>
        <div>
          <div class="sbar-name" id="sbar-name">—</div>
          <div class="sbar-date" id="sbar-date">—</div>
        </div>
      </div>
      <div class="sbar-change" id="sbar-change" onclick="showScreen('station')"></div>
    </div>

    <div id="maintenance-alerts"></div>

    <div class="menu-date" id="m-date"></div>
    <div class="menu-greeting" id="m-greeting"></div>

    <div class="section-label" id="m-label-reward"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('rewards.html')">
        <div class="card-stripe stripe-teal"></div>
        <span class="card-badge badge-reward" id="b-r1"></span>
        <span class="card-icon">🎁</span>
        <div class="card-title" id="c-reward-t"></div>
        <div class="card-sub" id="c-reward-s"></div>
      </div>
    </div>

    <div class="section-label" id="m-label-daily"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('temperature.html')">
        <div class="card-stripe stripe-green"></div>
        <span class="card-badge badge-daily" id="b-d1"></span>
        <span class="card-icon">🌡️</span>
        <div class="card-title" id="c-temp-t"></div>
        <div class="card-sub" id="c-temp-s"></div>
      </div>
      <div class="menu-card" onclick="go('cigarette.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-daily" id="b-d2"></span>
        <span class="card-icon">🚬</span>
        <div class="card-title" id="c-cig-t"></div>
        <div class="card-sub" id="c-cig-s"></div>
      </div>
      <div class="menu-card" onclick="go('newspaper.html')">
        <div class="card-stripe stripe-blue"></div>
        <span class="card-badge badge-daily" id="b-d3"></span>
        <span class="card-icon">📰</span>
        <div class="card-title" id="c-news-t"></div>
        <div class="card-sub" id="c-news-s"></div>
      </div>
      <div class="menu-card" onclick="go('cash.html')">
        <div class="card-stripe stripe-purple"></div>
        <span class="card-badge badge-daily" id="b-d4"></span>
        <span class="card-icon">💰</span>
        <div class="card-title" id="c-cash-t"></div>
        <div class="card-sub" id="c-cash-s"></div>
      </div>
      <div class="menu-card" onclick="goExternal('https://fuel.ariespetroleum.com.au/')">
        <div class="card-stripe stripe-blue"></div>
        <span class="card-badge badge-daily" id="b-d5"></span>
        <span class="card-icon">⛽</span>
        <div class="card-title" id="c-fuel-t"></div>
        <div class="card-sub" id="c-fuel-s"></div>
      </div>
    </div>

    <div class="section-label" id="m-label-incident"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('refund.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-incident" id="b-i1"></span>
        <span class="card-icon">↩️</span>
        <div class="card-title" id="c-refund-t"></div>
        <div class="card-sub" id="c-refund-s"></div>
      </div>
      <div class="menu-card" onclick="go('complaint.html')">
        <div class="card-stripe stripe-pink"></div>
        <span class="card-badge badge-incident" id="b-i4"></span>
        <span class="card-icon">📋</span>
        <div class="card-title" id="c-cmp-t"></div>
        <div class="card-sub" id="c-cmp-s"></div>
      </div>
      <div class="menu-card" onclick="go('unpaid-fuel.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i2"></span>
        <span class="card-icon">⛽</span>
        <div class="card-title" id="c-uf-t"></div>
        <div class="card-sub" id="c-uf-s"></div>
      </div>
      <div class="menu-card" onclick="go('driveoff.html')">
        <div class="card-stripe stripe-red"></div>
        <span class="card-badge badge-incident" id="b-i3"></span>
        <span class="card-icon">🚗</span>
        <div class="card-title" id="c-do-t"></div>
        <div class="card-sub" id="c-do-s"></div>
      </div>
    </div>

    <div class="section-label" id="m-label-ops"></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="go('maintenance.html')">
        <div class="card-stripe stripe-orange"></div>
        <span class="card-badge badge-ops" id="b-o1"></span>
        <span class="card-icon">🛠️</span>
        <div class="card-title" id="c-maint-t"></div>
        <div class="card-sub" id="c-maint-s"></div>
      </div>
      <div class="menu-card" onclick="go('roster.html')">
        <div class="card-stripe stripe-purple"></div>
        <span class="card-badge badge-ops" id="b-o2"></span>
        <span class="card-icon">📅</span>
        <div class="card-title" id="c-roster-t"></div>
        <div class="card-sub" id="c-roster-s"></div>
      </div>
    </div>

  </div>
</div>

<div class="footer" id="footer-txt"></div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxs-f95f6JwrxA-U0uVFwSj90Es1s43hS4hs20U5DGSIKRlQJVgP4oaXIbTe4smZ6Ex/exec';

const STATIONS = [
  { key:'Frankston',     display:'Frankston',      loc:'Frankston, VIC',      cls:'dot-sinopec', icon:'⛽' },
  { key:'Thomastown',    display:'Thomastown',     loc:'Thomastown, VIC',     cls:'dot-sinopec', icon:'⛽' },
  { key:'Shepparton',    display:'Shepparton',     loc:'Shepparton, VIC',     cls:'dot-sinopec', icon:'⛽' },
  { key:'Ballarat',      display:'Ballarat',       loc:'Ballarat, VIC',       cls:'dot-sinopec', icon:'⛽' },
  { key:'Clayton South', display:'Clayton South',  loc:'Clayton South, VIC',  cls:'dot-bp',      icon:'⛽' },
  { key:'Flemington',    display:'Flemington',     loc:'Flemington, VIC',     cls:'dot-bp',      icon:'⛽' },
  { key:'Bendigo',       display:'Bendigo',        loc:'Golden Square, VIC',  cls:'dot-liberty', icon:'⛽' }
];

// ── Greeting messages — varied by time of day ─────────────────────────────────
const GREETINGS = {
  en: {
    morning: n => [
      `Good morning, ${n}! ☀️ Hope you have a great shift today.`,
      `Rise and shine, ${n}! 🌅 Let's have a good one.`,
      `Morning ${n}! ☕ Ready to get things done?`,
    ],
    afternoon: n => [
      `Hey ${n}! 👋 How's the afternoon going?`,
      `Good afternoon, ${n}! 🌤️ Keep up the great work.`,
      `Hi ${n}! 😊 Hope the day's treating you well.`,
    ],
    evening: n => [
      `Evening, ${n}! 🌙 Thanks for the hard work today.`,
      `Hey ${n}! 🌆 Almost done — you've got this.`,
      `Good evening, ${n}! ⭐ Nearly there, hang in there!`,
    ],
    noname: [
      `👋 Hey there! What are you filing today?`,
      `Welcome back! 😊 What's on the agenda?`,
      `Hi! Ready to get things done? 💪`,
    ]
  },
  zh: {
    morning: n => [
      `早上好，${n}！☀️ 祝你今天班上得顺顺利利～`,
      `${n}，早安！🌅 今天也要加油哦！`,
      `早上好 ${n}！☕ 准备好开始了吗？`,
    ],
    afternoon: n => [
      `下午好，${n}！👋 今天怎么样？`,
      `嗨 ${n}！🌤️ 继续加油，干得不错！`,
      `${n}，你好！😊 下午也要加油！`,
    ],
    evening: n => [
      `晚上好，${n}！🌙 辛苦了，今天干得好！`,
      `嗨 ${n}！🌆 快结束啦，坚持一下！`,
      `${n}，晚上好！⭐ 快收工了，加油！`,
    ],
    noname: [
      `👋 你好！今天填哪个表？`,
      `欢迎回来！😊 今天怎么样？`,
      `嗨！准备好了吗？💪`,
    ]
  }
};

let lang    = localStorage.getItem('ap_lang')    || 'en';
let station = localStorage.getItem('ap_station') || '';
// Staff name expires after 6 hours
function getStaffName(){
  const name = localStorage.getItem('ap_staff_name') || '';
  const ts   = parseInt(localStorage.getItem('ap_staff_name_ts') || '0');
  if (name && ts && (Date.now() - ts) < 4 * 60 * 60 * 1000) return name;
  // Expired or missing — clear it
  localStorage.removeItem('ap_staff_name');
  localStorage.removeItem('ap_staff_name_ts');
  return '';
}
let staffName = getStaffName();
let openMaintenanceJobs = [];

function t()   { return STRINGS[lang]; }
function stationByKey(k) { return STATIONS.find(s=>s.key===k)||null; }

// ── Staff name ────────────────────────────────────────────────────────────────

function updateChip(){
  const chip = document.getElementById('staff-chip');
  const avatar = document.getElementById('staff-chip-avatar');
  const nameEl = document.getElementById('staff-chip-name');
  if (staffName) {
    chip.style.display = 'flex';
    avatar.textContent = staffName.charAt(0).toUpperCase();
    nameEl.textContent = staffName;
  } else {
    chip.style.display = 'none';
  }
}

function promptName(){
  const s = t();
  document.getElementById('nm-title').textContent = s.nmTitle;
  document.getElementById('nm-sub').textContent   = s.nmSub;
  const inp = document.getElementById('name-input');
  inp.placeholder = s.nmPlaceholder;
  inp.value = staffName || '';
  document.getElementById('name-btn').textContent  = s.nmBtn;
  document.getElementById('name-skip').textContent = s.nmSkip;
  document.getElementById('name-overlay').style.display = 'flex';
  setTimeout(()=>inp.focus(), 100);
}

function saveName(){
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  staffName = val;
  localStorage.setItem('ap_staff_name', val);
  localStorage.setItem('ap_staff_name_ts', String(Date.now()));
  document.getElementById('name-overlay').style.display = 'none';
  updateChip();
  updateDateGreeting();
}

function skipName(){
  document.getElementById('name-overlay').style.display = 'none';
  updateDateGreeting();
}

document.getElementById('name-input').addEventListener('keydown', e=>{
  if (e.key === 'Enter') saveName();
});

// ── Screens ───────────────────────────────────────────────────────────────────

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function setLang(l){
  lang=l; localStorage.setItem('ap_lang',l);
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='中文'));
  });
  applyLang();
}

function applyLang(){
  const s=t();
  document.title=s.pageTitle;
  const sd=stationByKey(station);
  const displayName=sd?sd.display:station||'—';

  document.getElementById('cf-eyebrow').textContent     =s.cfEyebrow;
  document.getElementById('cf-heading').innerHTML       =s.cfHeading(displayName);
  document.getElementById('cf-label').textContent       =s.cfLabel;
  document.getElementById('cf-continue-btn').textContent=s.cfContinue;
  document.getElementById('cf-change-btn').textContent  =s.cfChange;
  document.getElementById('cf-name').textContent        =displayName;
  document.getElementById('cf-loc').textContent         =sd?sd.loc:'';

  document.getElementById('s-eyebrow').textContent=s.sEyebrow;
  document.getElementById('s-heading').innerHTML  =s.sHeading;
  document.getElementById('s-sub').textContent    =s.sSub;
  buildStationList();

  document.getElementById('sbar-change').textContent=s.sbarChange;
  document.getElementById('sbar-name').textContent  =displayName;

  document.getElementById('m-label-daily').textContent   =s.mLabelDaily;
  document.getElementById('m-label-incident').textContent=s.mLabelIncident;
  document.getElementById('m-label-ops').textContent     =s.mLabelOps;
  document.getElementById('m-label-reward').textContent  =s.mLabelReward;

  ['b-d1','b-d2','b-d3','b-d4','b-d5'].forEach(id=>document.getElementById(id).textContent=s.bDaily);
  ['b-i1','b-i2','b-i3','b-i4'].forEach(id=>document.getElementById(id).textContent=s.bIncident);
  ['b-o1','b-o2'].forEach(id=>document.getElementById(id).textContent=s.bOps);
  document.getElementById('b-r1').textContent=s.bReward;

  setCard('temp','c-temp-t','c-temp-s'); setCard('cig','c-cig-t','c-cig-s');
  setCard('news','c-news-t','c-news-s'); setCard('cash','c-cash-t','c-cash-s');
  setCard('fuel','c-fuel-t','c-fuel-s'); setCard('refund','c-refund-t','c-refund-s');
  setCard('complaint','c-cmp-t','c-cmp-s'); setCard('uf','c-uf-t','c-uf-s');
  setCard('do','c-do-t','c-do-s'); setCard('maintenance','c-maint-t','c-maint-s');
  setCard('roster','c-roster-t','c-roster-s'); setCard('reward','c-reward-t','c-reward-s');

  document.getElementById('footer-txt').textContent=s.footer;
  updateDateGreeting();
  renderMaintenanceAlerts();
}

function setCard(key,titleId,subId){
  const c=t().cards[key];
  document.getElementById(titleId).textContent=c.t;
  document.getElementById(subId).textContent  =c.s;
}

function buildStationList(){
  const box=document.getElementById('station-list');
  box.innerHTML='';
  STATIONS.forEach(st=>{
    const div=document.createElement('div');
    div.className='station-opt';
    div.onclick=()=>selectStation(st.key);
    div.innerHTML=`
      <div class="station-opt-left">
        <div class="station-brand-dot ${st.cls}">${st.icon}</div>
        <div>
          <div class="station-opt-name">${st.display}</div>
          <div class="station-opt-loc">${st.loc}</div>
        </div>
      </div>
      <div class="station-opt-arrow">›</div>`;
    box.appendChild(div);
  });
}

function selectStation(key){
  station=key; localStorage.setItem('ap_station',key);
  applyLang(); showScreen('menu'); loadOpenMaintenance();
  // Ask for name if not set yet
  if (!staffName) setTimeout(promptName, 400);
}

function confirmStation(){
  showScreen('menu'); loadOpenMaintenance();
  if (!staffName) setTimeout(promptName, 400);
}

function go(page)        { window.location.href=page; }
function goExternal(url) { window.location.href=url;  }

function updateDateGreeting(){
  const now=new Date();
  const dateStr=now.toLocaleDateString(lang==='zh'?'zh-CN':'en-AU',{weekday:'long',year:'numeric',month:'short',day:'numeric'});
  document.getElementById('sbar-date').textContent=dateStr;
  document.getElementById('m-date').textContent   =dateStr.toUpperCase();

  const hour=now.getHours();
  const period = hour>=5&&hour<12 ? 'morning' : hour>=12&&hour<18 ? 'afternoon' : 'evening';
  const G = GREETINGS[lang];
  let msg;
  if (staffName) {
    const options = G[period](staffName);
    msg = options[Math.floor(Math.random() * options.length)];
  } else {
    const options = G.noname;
    msg = options[Math.floor(Math.random() * options.length)];
  }
  document.getElementById('m-greeting').innerHTML = msg;
}

async function loadOpenMaintenance(){
  if(!station||!WEB_APP_URL){ openMaintenanceJobs=getLocalJobs(); renderMaintenanceAlerts(); return; }
  try{
    const url=`${WEB_APP_URL}?action=getOpenMaintenance&station=${encodeURIComponent(station)}&t=${Date.now()}`;
    const res=await fetch(url,{signal:AbortSignal.timeout(5000)});
    const data=await res.json();
    openMaintenanceJobs=(data&&data.success&&Array.isArray(data.jobs))?data.jobs:getLocalJobs();
  }catch(e){ openMaintenanceJobs=getLocalJobs(); }
  renderMaintenanceAlerts();
}

function getLocalJobs(){
  if(!station) return [];
  const jobs=[];
  Object.keys(localStorage).forEach(key=>{
    if(!key.startsWith('ap_open_maintenance_')) return;
    try{ const job=JSON.parse(localStorage.getItem(key)); if(job&&job.station===station) jobs.push(job); }catch(e){}
  });
  return jobs;
}

function renderMaintenanceAlerts(){
  const box=document.getElementById('maintenance-alerts');
  if(!box) return;
  const jobs=openMaintenanceJobs||[];
  const s=t();
  if(!jobs.length){ box.innerHTML=''; return; }
  box.innerHTML=jobs.map(job=>`
    <div class="maintenance-alert" onclick="go('maintenance.html')">
      <div class="maintenance-alert-top">
        <div class="maintenance-alert-icon">!</div>
        <div class="maintenance-alert-title">${s.maintenanceAlert}</div>
      </div>
      <div class="maintenance-alert-body">
        <div><strong>${esc(job.companyName||job.CompanyName||'Contractor')}</strong>
        — ${esc(job.equipmentDisplay||job.EquipmentDisplay||job.equipment||job.Equipment||'Equipment')}</div>
        <div class="maintenance-alert-time">Arrived ${esc(job.arrivalTime||job.ArrivalTime||'--:--')}</div>
        <div class="maintenance-alert-time">${s.maintenanceAlertClick}</div>
      </div>
    </div>`).join('');
}

function esc(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(b=>{
  b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='中文'));
});
updateChip();
applyLang();
if(station){ showScreen('confirm'); loadOpenMaintenance(); }
else         showScreen('station');
setInterval(()=>{ if(station) loadOpenMaintenance(); },60000);
</script>
