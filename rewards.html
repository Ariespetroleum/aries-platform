<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rewards Portal — Aries Petroleum Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sinopec-red:#E60012;--sinopec-red-dark:#B8000E;
  --bp-green:#00A651;--bp-green-dark:#007A3D;
  --liberty-blue:#003DA5;--liberty-blue-dark:#002A73;
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-soft:#F8FAFC;
  --border:#DDE3EA;--border-strong:#C9D2DD;
  --text:#142033;--muted:#667085;--label:#344054;
  --danger-light:#FFF1F2;--green-light:#ECFDF3;--blue-light:#EFF6FF;
  --orange-light:#FFF7ED;
  --radius:16px;--radius-sm:10px;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 4px 18px rgba(15,23,42,.08);--shadow-sm:0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:linear-gradient(180deg,#F8FAFC 0%,#EEF2F6 100%);color:var(--text);min-height:100vh;padding-bottom:48px}

/* header */
.header{background:linear-gradient(135deg,var(--sinopec-red) 0%,var(--liberty-blue) 100%);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{width:32px;height:32px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:#fff;flex-shrink:0;border:none}
.brand{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;color:#fff}
.brand span{color:rgba(255,255,255,.7)}
.staff-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 9px 3px 3px;cursor:pointer}
.staff-chip-avatar{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--sinopec-red);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.staff-chip-name{font-family:var(--mono);font-size:10px;color:#fff;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-btn{padding:6px 10px;font-family:var(--mono);font-size:11px;color:#fff;cursor:pointer;border:none;background:transparent;font-weight:600}
.lang-btn.active{background:#fff;color:var(--liberty-blue)}

.screen{display:none}.screen.active{display:block}

.station-wrap{max-width:480px;margin:0 auto;padding:24px 16px}
.page-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
.page-heading{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:6px;color:var(--text)}
.page-heading span{color:var(--sinopec-red)}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.station-list{display:flex;flex-direction:column;gap:8px}
.station-opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .18s;box-shadow:var(--shadow-sm)}
.station-opt:hover{border-color:var(--sinopec-red);box-shadow:0 0 0 3px rgba(230,0,18,.08);transform:translateX(2px)}
.station-opt-left{display:flex;align-items:center;gap:12px}
.station-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#FFF1F2;color:var(--sinopec-red)}
.station-opt-name{font-size:14px;font-weight:700;color:var(--text)}
.station-opt-loc{font-size:11px;color:var(--muted);margin-top:2px}
.station-opt-arrow{color:var(--border-strong);font-size:16px;font-weight:700}

.portal-wrap{max-width:520px;margin:0 auto;padding:0 12px 24px}

.station-bar{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;margin:14px 0;box-shadow:var(--shadow-sm)}
.sbar-left{display:flex;align-items:center;gap:10px}
.sbar-dot{width:8px;height:8px;border-radius:50%;background:var(--bp-green);box-shadow:0 0 6px var(--bp-green);flex-shrink:0}
.sbar-name{font-size:13px;font-weight:700;color:var(--text)}
.sbar-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.sbar-change{font-size:11px;color:var(--liberty-blue);cursor:pointer;border:1px solid rgba(0,61,165,.25);padding:5px 12px;border-radius:7px;font-family:var(--mono);background:var(--blue-light);white-space:nowrap;font-weight:600}

.tabs{display:flex;gap:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.tab{flex:1;padding:11px 8px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:var(--sans);transition:all .18s;border-right:1px solid var(--border)}
.tab:last-child{border-right:none}
.tab.active{background:var(--liberty-blue);color:#fff}
.tab-count{display:inline-block;background:var(--sinopec-red);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:1px 5px;margin-left:4px;vertical-align:middle;font-family:var(--mono)}

.section-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}

.pending-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm);animation:slideUp .25s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pending-stripe{height:4px;width:100%}
.stripe-coffee{background:linear-gradient(90deg,var(--bp-green),var(--sinopec-red))}
.stripe-wash{background:linear-gradient(90deg,var(--sinopec-red),var(--liberty-blue))}
.stripe-monthly{background:linear-gradient(90deg,var(--liberty-blue),var(--liberty-blue-dark))}
.pending-body{padding:13px 14px 10px}
.pending-type-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pending-type-badge{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.badge-coffee{background:#ECFDF3;color:var(--bp-green-dark);border:1px solid #BBF7D0}
.badge-wash{background:#FFF1F2;color:var(--sinopec-red);border:1px solid #FECDD3}
.badge-monthly{background:#EFF6FF;color:var(--liberty-blue);border:1px solid #BFDBFE}
.pending-date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.pending-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pending-field{font-size:12px;color:var(--label)}
.pending-field strong{color:var(--text);font-weight:700}
.pending-notes{font-size:12px;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.5}
.receipt-link{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;color:var(--liberty-blue);font-weight:700;text-decoration:none;background:var(--blue-light);border:1px solid #BFDBFE;padding:5px 11px;border-radius:7px}
.pending-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface-soft)}
.action-btn{flex:1;padding:10px 8px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:var(--sans);transition:all .15s}
.action-btn:disabled{opacity:.45;cursor:not-allowed}
.btn-confirm{background:linear-gradient(135deg,var(--bp-green),var(--bp-green-dark));color:#fff;box-shadow:0 3px 10px rgba(0,166,81,.2)}
.btn-reject{background:var(--surface);color:var(--sinopec-red);border:1.5px solid #FECDD3}
.btn-done{background:var(--green-light);color:var(--bp-green-dark);border:1.5px solid #BBF7D0;cursor:default}
.btn-rejected-done{background:#FFF1F2;color:var(--muted);border:1.5px solid var(--border);cursor:default}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:700;color:var(--label);margin-bottom:4px}
.empty-sub{font-size:13px}

.loading{text-align:center;padding:32px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--liberty-blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--bp-green)}
.toast.error{background:var(--sinopec-red)}

.search-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.search-box-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:12px}
.fg{margin-bottom:12px}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-family:var(--mono)}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;color:var(--text);font-family:var(--sans);outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--liberty-blue);box-shadow:0 0 0 3px rgba(0,61,165,.09)}
.search-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;font-family:var(--sans);background:linear-gradient(135deg,var(--liberty-blue),var(--liberty-blue-dark));color:#fff;box-shadow:0 4px 14px rgba(0,61,165,.2)}
.search-btn:disabled{opacity:.5;cursor:not-allowed}

.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;box-shadow:var(--shadow-sm);animation:slideUp .25s ease both}
.result-card-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border-bottom:none;padding-bottom:0}
.result-key{font-size:12px;color:var(--muted)}
.result-val{font-size:13px;font-weight:700;color:var(--text);font-family:var(--mono)}
.result-val.green{color:var(--bp-green-dark)}
.result-val.red{color:var(--sinopec-red)}
.result-val.blue{color:var(--liberty-blue)}

.prog-track{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:10px}
.prog-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono);color:var(--muted)}
.prog-dot.lit-green{background:var(--bp-green);border-color:var(--bp-green);color:#fff}
.prog-dot.lit-red{background:var(--sinopec-red);border-color:var(--sinopec-red);color:#fff}
.prog-arrow{color:var(--border-strong);font-size:12px}
.prog-free{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;font-family:var(--mono);border:2px solid}
.prog-free-green{background:var(--green-light);border-color:var(--bp-green);color:var(--bp-green-dark)}
.prog-free-red{background:var(--danger-light);border-color:var(--sinopec-red);color:var(--sinopec-red)}
.prog-lbl{font-size:12px;color:var(--label);margin-top:8px;line-height:1.55}
.prog-free-banner{background:var(--green-light);border:1.5px solid #BBF7D0;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--bp-green-dark);margin-top:10px;text-align:center}

.err-inline{background:var(--danger-light);border:1px solid #FECDD3;border-radius:8px;padding:9px 12px;font-size:12px;color:var(--sinopec-red);font-weight:600;margin-top:10px}
.redeem-btn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--bp-green),var(--bp-green-dark));color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--sans);box-shadow:0 4px 12px rgba(0,166,81,.22);transition:opacity .15s}
.redeem-btn:hover{opacity:.9}
.redeem-btn:disabled{opacity:.45;cursor:not-allowed}
.redeem-btn-red{background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark));box-shadow:0 4px 12px rgba(230,0,18,.22)}
.pending-alert{background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;display:none;align-items:center;gap:10px;cursor:pointer}
.pending-alert.show{display:flex}
.pending-alert-dot{width:8px;height:8px;border-radius:50%;background:var(--sinopec-red);flex-shrink:0;animation:pulseDot 1.4s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(230,0,18,.4)}50%{box-shadow:0 0 0 6px rgba(230,0,18,.0)}}
.pending-alert-text{font-size:13px;color:#92400E;font-weight:700;flex:1}
.pending-alert-cta{font-size:11px;font-weight:800;color:var(--sinopec-red);font-family:var(--mono);white-space:nowrap}
.history-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.history-row:last-child{border-bottom:none}
.history-icon{font-size:18px;flex-shrink:0}
.history-info{flex:1;min-width:0}
.history-date{font-size:12px;font-weight:700;color:var(--text)}
.history-loc{font-size:10px;color:var(--muted);font-family:var(--mono)}
.history-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.hb-pending{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.hb-done{background:var(--green-light);color:var(--bp-green-dark);border:1px solid #BBF7D0}
.hb-rejected{background:var(--danger-light);color:var(--sinopec-red);border:1px solid #FECDD3}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="brand">ARIES <span>REWARDS</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="staff-chip" id="staff-chip" onclick="clearCachedName()" style="display:none" title="Tap to change name">
      <div class="staff-chip-avatar" id="staff-chip-avatar">?</div>
      <span class="staff-chip-name" id="staff-chip-name">—</span>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-station">
  <div class="station-wrap">
    <div class="page-eyebrow" id="s-eyebrow">Rewards Portal</div>
    <div class="page-heading" id="s-heading">Select your <span>station</span></div>
    <div class="page-sub" id="s-sub">You will only see pending items from your station.</div>
    <div class="station-list" id="station-list"></div>
  </div>
</div>

<div class="screen" id="screen-portal">
  <div class="portal-wrap">

    <div class="station-bar">
      <div class="sbar-left">
        <div class="sbar-dot"></div>
        <div>
          <div class="sbar-name" id="sbar-name">—</div>
          <div class="sbar-sub" id="sbar-sub">Rewards Portal</div>
        </div>
      </div>
      <div class="sbar-change" id="sbar-change" onclick="showScreen('station')"></div>
    </div>

    <div class="tabs">
      <button class="tab" id="tab-pending" onclick="switchTab('pending')">
        <span id="tab-pending-lbl">Pending</span>
        <span class="tab-count" id="pending-count" style="display:none">0</span>
      </button>
      <button class="tab active" id="tab-search" onclick="switchTab('search')">
        <span id="tab-search-lbl">Search</span>
      </button>
    </div>

    <div class="pending-alert" id="pending-alert" onclick="switchTab('pending')">
      <div class="pending-alert-dot"></div>
      <div class="pending-alert-text" id="pending-alert-text">3 items pending confirmation</div>
      <div class="pending-alert-cta" id="pending-alert-cta">View →</div>
    </div>

    <div id="pane-pending" style="display:none">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
        <button id="refresh-btn" onclick="refreshPending()" style="font-size:11px;font-weight:700;font-family:var(--mono);padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--liberty-blue);cursor:pointer">
          ↺ <span id="refresh-lbl">Refresh</span>
        </button>
      </div>
      <div id="pending-loading" class="loading">
        <span class="spinner"></span><span id="loading-txt">Loading…</span>
      </div>
      <div id="pending-content" style="display:none"></div>
    </div>

    <div id="pane-search">

      <div class="search-box">
        <div class="search-box-title" id="search-coffee-title">☕ Coffee Progress</div>
        <div class="fg">
          <label class="flabel" id="lbl-coffee-phone">Customer Mobile</label>
          <input type="tel" id="coffee-phone" placeholder="04xx xxx xxx" inputmode="tel" maxlength="13" onkeydown="if(event.key==='Enter')searchCoffee()">
        </div>
        <button class="search-btn" id="coffee-search-btn" onclick="searchCoffee()">
          <span id="coffee-search-lbl">Search</span>
        </button>
        <div id="coffee-result"></div>
      </div>

      <div class="search-box">
        <div class="search-box-title" id="search-wash-title">🚗 Wash Reward Progress</div>
        <div class="fg">
          <label class="flabel" id="lbl-wash-search-label">Plate Number or Mobile</label>
          <input type="text" id="wash-search-input" placeholder="e.g. ABC123 or 04xx xxx xxx"
            style="font-family:var(--mono);font-size:14px;font-weight:700;text-transform:uppercase"
            autocomplete="off"
            oninput="this.value=this.value.toUpperCase()"
            onkeydown="if(event.key==='Enter')searchWash()">
        </div>
        <button class="search-btn" id="wash-search-btn" onclick="searchWash()">
          <span id="wash-search-lbl">Search</span>
        </button>
        <div id="wash-result"></div>
      </div>

      <div class="search-box">
        <div class="search-box-title" id="search-monthly-title">💳 Monthly Membership</div>
        <div class="fg">
          <label class="flabel" id="lbl-monthly-search-label">Plate Number or Mobile</label>
          <input type="text" id="monthly-search-input" placeholder="e.g. ABC123 or 04xx xxx xxx"
            style="font-family:var(--mono);font-size:14px;font-weight:700;text-transform:uppercase"
            autocomplete="off"
            oninput="this.value=this.value.toUpperCase()"
            onkeydown="if(event.key==='Enter')searchPlate()">
        </div>
        <button class="search-btn" id="plate-search-btn" onclick="searchPlate()">
          <span id="plate-search-lbl">Search</span>
        </button>
        <div id="plate-result"></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="name-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.2)">
    <div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px" id="modal-title">Your Name</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px" id="modal-sub">Enter your name for the record</div>
    <input type="text" id="modal-name-input" placeholder="e.g. Sarah"
      autocomplete="name"
      style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--sans);outline:none;margin-bottom:12px"
      onkeydown="if(event.key==='Enter') resolveNameModal()">
    <div id="modal-err" style="display:none;color:var(--sinopec-red);font-size:12px;font-weight:600;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="cancelNameModal()" style="flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)" id="modal-cancel">Cancel</button>

let lang      = localStorage.getItem('ap_lang') || 'en';
let station   = localStorage.getItem('ap_station') || '';
let activeTab = 'search';

function t(){ return S[lang]; }

function setLang(l){
  lang=l; localStorage.setItem('ap_lang',l);
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active',(l==='en'&&b.textContent==='EN')||(l==='zh'&&b.textContent==='\u4E2D\u6587'));
  });
  applyLang();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function applyLang(){
  const L=t();
  document.getElementById('s-eyebrow').textContent  = L.sEyebrow;
  document.getElementById('s-heading').innerHTML    = L.sHeading;
  document.getElementById('s-sub').textContent      = L.sSub;
  buildStationList();
  const sd = STATIONS.find(s=>s.key===station);
  document.getElementById('sbar-name').textContent  = sd?sd.display:(station||'\u2014');
  document.getElementById('sbar-sub').textContent   = L.sbarSub;
  document.getElementById('sbar-change').textContent= L.sbarChange;
  document.getElementById('tab-pending-lbl').textContent = L.tabPending;
  document.getElementById('tab-search-lbl').textContent  = L.tabSearch;
  document.getElementById('loading-txt').textContent     = L.loading;
  const rl=document.getElementById('refresh-lbl'); if(rl) rl.textContent=L.refreshLbl;
  document.getElementById('search-coffee-title').textContent  = L.searchCoffeeTitle;
  document.getElementById('search-wash-title').textContent    = L.searchWashTitle;
  document.getElementById('search-monthly-title').textContent = L.searchMonthlyTitle;
  document.getElementById('lbl-coffee-phone').textContent      = L.lblCoffeePhone;
  document.getElementById('lbl-wash-search-label').textContent  = L.lblWashSearchLabel;
  document.getElementById('lbl-monthly-search-label').textContent = L.lblMonthlySearchLabel||'Plate Number or Mobile';
  document.getElementById('coffee-search-lbl').textContent      = L.searchBtn;
  document.getElementById('wash-search-lbl').textContent        = L.searchBtn;
  document.getElementById('plate-search-lbl').textContent       = L.searchBtn;
  document.getElementById('pending-alert-cta').textContent      = L.pendingAlertCta||'View \u2192';
  updateChip();
}

function buildStationList(){
  const box=document.getElementById('station-list');
  box.innerHTML='';
  STATIONS.forEach(st=>{
    const div=document.createElement('div');
    div.className='station-opt';
    div.onclick=()=>selectStation(st.key);
    div.innerHTML=`
      <div class="station-opt-left">
        <div class="station-icon">\u26FD</div>
        <div>
          <div class="station-opt-name">${st.display}</div>
          <div class="station-opt-loc">${st.loc}</div>
        </div>
      </div>
      <div class="station-opt-arrow">\u203A</div>`;
    box.appendChild(div);
  });
}

function selectStation(key){
  station=key; localStorage.setItem('ap_station',key);
  applyLang();
  showScreen('portal');
  loadPending();
}

function switchTab(tab){
  activeTab=tab;
  document.getElementById('tab-pending').classList.toggle('active', tab==='pending');
  document.getElementById('tab-search').classList.toggle('active',  tab==='search');
  document.getElementById('pane-pending').style.display = tab==='pending' ? 'block' : 'none';
  document.getElementById('pane-search').style.display  = tab==='search'  ? 'block' : 'none';
  if(tab==='pending') document.getElementById('pending-alert').classList.remove('show');
}

function refreshPending(){
  const rb=document.getElementById('refresh-btn');
  if(rb) rb.disabled=true;
  loadPending();
}

async function loadPending(){
  document.getElementById('pending-loading').style.display='block';
  document.getElementById('pending-content').style.display='none';
  try{
    const url=`${API_URL}?action=getPendingAll&location=${encodeURIComponent(station)}&token=${API_TOKEN}&t=${Date.now()}`;
    const res=await fetch(url);
    const data=await res.json();
    renderPending(data);
  }catch(e){
    document.getElementById('pending-loading').innerHTML=`<span style="color:var(--sinopec-red)">${t().toastErr}</span>`;
  }
}

function renderPending(data){
  const L=t();
  const coffees = (data.coffeePending||[]);
  const washes  = (data.washPending||[]);
  const total   = coffees.length+washes.length;
  const rb=document.getElementById('refresh-btn');
  if(rb) rb.disabled=false;

  const countEl=document.getElementById('pending-count');
  countEl.textContent=total;
  countEl.style.display=total?'inline':'none';

  const alertEl  =document.getElementById('pending-alert');
  const alertText=document.getElementById('pending-alert-text');
  if(total>0 && activeTab==='search'){
    alertText.textContent=L.pendingAlertText(total);
    alertEl.classList.add('show');
  } else {
    alertEl.classList.remove('show');
  }

  document.getElementById('pending-loading').style.display='none';

        <div class="pending-body">
          <div class="pending-type-row">

      const stripeClass=isMonthly?'stripe-monthly':'stripe-wash';
      const badgeClass=isMonthly?'badge-monthly':'badge-wash';

      html+=`
      <div class="pending-card" id="card-${r.id}">
        <div class="pending-stripe ${stripeClass}"></div>

            <span class="pending-date">${r.washDate||''}</span>
          </div>
          <div class="pending-row">
            <div class="pending-field"><strong>${esc(r.plate||'')}</strong></div>
            <div class="pending-field">${esc(r.phone||'')}</div>
          </div>
          <div class="pending-row">
            <div class="pending-field">${esc(r.email||'')}</div>
            ${isMonthly?`<div class="pending-field" style="color:var(--liberty-blue);font-weight:700">${esc(r.monthlyTier||'')}</div>`:''}
            <div class="pending-field" style="color:var(--liberty-blue);font-weight:700">${esc(r.location||'')}</div>
          </div>
          ${isMonthly&&r.startDate?`<div class="pending-field" style="font-size:11px;color:var(--muted);margin-top:3px">Start: ${r.startDate}</div>`:''}
          ${r.notes?`<div class="pending-notes">${esc(r.notes)}</div>`:''}
          ${r.receiptUrl?`<a class="receipt-link" href="${r.receiptUrl}" target="_blank">\uD83D\uDCF7 View Receipt</a>`:''}
        </div>
        <div class="pending-actions" id="actions-${r.id}">
          <button class="action-btn btn-confirm" onclick="confirmWash('${r.id}')">${L.confirmBtn}</button>
          <button class="action-btn btn-reject"  onclick="rejectWash('${r.id}')">${L.rejectBtn}</button>
        </div>
      </div>`;
    });
  }

  box.innerHTML=html;
}

async function searchCoffee(){
  const L=t();
  const phone=normalizePhone(document.getElementById('coffee-phone').value);
  const box=document.getElementById('coffee-result');
  if(!phone){ box.innerHTML=`<div class="err-inline">${L.lblCoffeePhone}?</div>`; return; }
  box.innerHTML=`<div class="loading"><span class="spinner"></span>${L.loading}</div>`;
  try{
    const url=`${API_URL}?action=searchCoffee&phone=${encodeURIComponent(phone)}&token=${API_TOKEN}`;
    const res=await fetch(url); const data=await res.json();
    const histData=await fetchHistory(phone,'');
    const histHtml=renderHistory(histData?.history||[], L);
    if(!data.found){
      box.innerHTML=`
        <div class="result-card">
          <div class="result-card-title">${L.searchCoffeeTitle}</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:12px">${L.notFoundAddCoffee}</div>
          <button class="redeem-btn" onclick="staffAddCoffee('${esc(phone)}',this)">${L.addCoffeeBtn}</button>
          ${histHtml}
        </div>`;
      return;
    }
    const c=data.confirmedPurchases||0;
    const mod=c%5; const remaining=5-mod;
    const rewardReady=data.rewardReady||false;
    const freePending=data.freePending||0;
    let track='';
    for(let i=0;i<5;i++){
      track+=`<div class="prog-dot${i<mod?' lit-green':''}">${i<mod?'\u2713':i+1}</div>`;
      if(i<4) track+='<span class="prog-arrow">\u203A</span>';
    }
    track+=`<span class="prog-arrow">\u203A</span><div class="prog-free prog-free-green">FREE</div>`;
    box.innerHTML=`
      <div class="result-card">
        <div class="result-card-title">${L.searchCoffeeTitle}</div>
        <div class="result-row"><span class="result-key">${L.rfName}</span><span class="result-val">${esc(data.name||'\u2014')}</span></div>
        <div class="result-row"><span class="result-key">${L.rfPhone}</span><span class="result-val">${esc(data.phone||'')}</span></div>
        <div class="result-row"><span class="result-key">${L.rfConfirmed}</span><span class="result-val blue">${c}</span></div>
        <div class="result-row"><span class="result-key">${L.rfRedeemed}</span><span class="result-val">${data.freeRedeemed||0}</span></div>
        <div class="prog-track">${track}</div>
        <div class="prog-lbl">${rewardReady?'':L.coffeeProgressLbl(mod,remaining)}</div>
        ${rewardReady
          ? `<div class="prog-free-banner">
               ${L.freeCoffeeReady}
               ${freePending>1?`<span style="font-size:11px;display:block;margin-top:4px;opacity:.8">(${freePending} ${L.freePendingCount})</span>`:''}
             </div>
             <button class="redeem-btn" onclick="redeemCoffee('${esc(phone)}',this)">${L.redeemCoffeeBtn}</button>`
          : ''}
        <button class="redeem-btn" style="margin-top:10px;background:linear-gradient(135deg,#0369a1,#075985)"
          onclick="staffAddCoffee('${esc(phone)}',this)">${L.addCoffeeBtn}</button>
        ${histHtml}
      </div>`;
  }catch(e){ box.innerHTML=`<div class="err-inline">${L.toastErr}</div>`; }
}

function renderHistory(history, L){
  if(!history||!history.length) return '';
  const rows=history.slice(0,15).map(item=>{
    const icon=item.type==='coffee'?'\u2615':item.type==='monthly'?'\uD83D\uDCB3':'\uD83D\uDE97';
    const st=(item.status||'pending').toLowerCase();
    const cls=st==='done'?'hb-done':st==='rejected'?'hb-rejected':'hb-pending';
    const lbl=st==='done'?(L.hbDone||'\u2705 Confirmed'):st==='rejected'?(L.hbRejected||'\u2717 Rejected'):(L.hbPending||'\u23F3 Pending');
    return `<div class="history-row">
      <div class="history-icon">${icon}</div>
      <div class="history-info">
        <div class="history-date">${item.date||'\u2014'}</div>
        <div class="history-loc">${esc(item.location||'')}</div>
      </div>
      <div class="history-badge ${cls}">${lbl}</div>
    </div>`;
  }).join('');
  return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
    <div style="font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700">${L.historyTitle||'Recent History'}</div>
    ${rows}
  </div>`;
}

async function fetchHistory(phone, plate){
  try{
    const url=`${API_URL}?action=getCustomerProgress&phone=${encodeURIComponent(phone)}&plate=${encodeURIComponent(plate||'')}&token=${API_TOKEN}`;
    return await (await fetch(url)).json();
  }catch(e){ return null; }
}

async function searchWash(){
  const L=t();
  const raw=document.getElementById('wash-search-input').value.trim().toUpperCase().replace(/\s/g,'');
  const box=document.getElementById('wash-result');
  if(!raw){ box.innerHTML=`<div class="err-inline">${L.lblWashSearchLabel||'Plate or Mobile'}?</div>`; return; }
  box.innerHTML=`<div class="loading"><span class="spinner"></span>${L.loading}</div>`;
  const isPhone=/^(04|4)\d{8}$/.test(raw);
  const phone=isPhone?normalizePhone(raw):'';
  const plate=isPhone?'':raw;
  try{
    let data, histData;
    if(isPhone){
      const url=`${API_URL}?action=searchWashReward&phone=${encodeURIComponent(phone)}&token=${API_TOKEN}`;
      data=await (await fetch(url)).json();
      histData=await fetchHistory(phone,'');
    } else {
      const url=`${API_URL}?action=searchWashByPlate&plate=${encodeURIComponent(plate)}&token=${API_TOKEN}`;
      data=await (await fetch(url)).json();
      histData=data.phone?await fetchHistory(normalizePhone(data.phone),plate):null;
    }
    const histHtml=renderHistory(histData?.history||[], L);
    if(!data.found){
      box.innerHTML=`
        <div class="result-card">
          <div class="result-card-title">${L.searchWashTitle}</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:12px">${L.notFoundAddWash}</div>
          ${plate?`<div style="font-size:12px;color:var(--label);margin-bottom:10px">Plate: <strong style="font-family:var(--mono)">${esc(plate)}</strong></div>`:''}
          <button class="redeem-btn redeem-btn-red" onclick="staffAddWashFromSearch('${esc(plate)}','${esc(phone)}',this)">${L.addWashBtn}</button>
          ${histHtml}
        </div>`;
      return;
    }
    const c=data.confirmedWashes||0;
    const mod=c%3; const remaining=3-mod;
    const rewardReady=data.rewardReady||false; const freePending=data.freePending||0;
    let track='';
    for(let i=0;i<3;i++){
      track+=`<div class="prog-dot${i<mod?' lit-red':''}">${i<mod?'\u2713':i+1}</div>`;
      if(i<2) track+='<span class="prog-arrow">\u203A</span>';
    }
    track+=`<span class="prog-arrow">\u203A</span><div class="prog-free prog-free-red">FREE</div>`;
    const addPhone=data.phone||phone;
    box.innerHTML=`
      <div class="result-card">
        <div class="result-card-title">${L.searchWashTitle}</div>
        ${data.phone?`<div class="result-row"><span class="result-key">${L.rfPhone}</span><span class="result-val">${esc(data.phone)}</span></div>`:''}
        ${plate?`<div class="result-row"><span class="result-key">${L.rfPlate}</span><span class="result-val">${esc(plate)}</span></div>`:''}
        <div class="result-row"><span class="result-key">${L.rfWashes}</span><span class="result-val red">${c}</span></div>
        <div class="result-row"><span class="result-key">${L.rfRedeemed}</span><span class="result-val">${data.freeRedeemed||0}</span></div>
        <div class="prog-track">${track}</div>
        <div class="prog-lbl">${rewardReady?'':L.washProgressLbl(mod,remaining)}</div>
        ${rewardReady?`<div class="prog-free-banner">${L.freeWashReady}${freePending>1?`<span style="font-size:11px;display:block;margin-top:4px;opacity:.8">(${freePending} ${L.freePendingCount})</span>`:''}</div><button class="redeem-btn redeem-btn-red" onclick="redeemWash('${esc(addPhone)}',this)">${L.redeemWashBtn}</button>`:''}
        <button class="redeem-btn redeem-btn-red" style="margin-top:10px;background:linear-gradient(135deg,#b91c1c,#991b1b)"
          onclick="staffAddWashFromSearch('${esc(plate)}','${esc(addPhone)}',this)">${L.addWashBtn}</button>
        ${histHtml}
      </div>`;
  }catch(e){ box.innerHTML=`<div class="err-inline">${L.toastErr}</div>`; }
}

async function staffAddWashFromSearch(plate, phone, btn){
  const L=t();
  const name=await promptStaffName(); if(!name) return;
  btn.disabled=true; btn.textContent='\u2026';
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({
      action:'staffAddWash',phone,plate,station,staffName:name,token:API_TOKEN,date:todayStr()
    })});

  }catch(e){ btn.disabled=false; btn.textContent=L.addWashBtn; showToast(L.addErr,'error'); }
}

async function searchPlate(){
  const L=t();
  const raw=document.getElementById('monthly-search-input').value.trim().toUpperCase().replace(/\s/g,'');
  const box=document.getElementById('plate-result');
  if(!raw){ box.innerHTML=`<div class="err-inline">${L.lblMonthlySearchLabel||'Plate or Mobile'}?</div>`; return; }
  box.innerHTML=`<div class="loading"><span class="spinner"></span>${L.loading}</div>`;
  const isPhone=/^(04|4)\d{8}$/.test(raw);
  const plate=isPhone?'':raw;
  const phone=isPhone?normalizePhone(raw):'';
  try{
    let data;
    if(isPhone){
      const url=`${API_URL}?action=searchMonthlyByPhone&phone=${encodeURIComponent(phone)}&token=${API_TOKEN}`;
      const res=await fetch(url); data=await res.json();
    } else {
      const url=`${API_URL}?action=searchPlate&plate=${encodeURIComponent(plate)}&token=${API_TOKEN}`;
      const res=await fetch(url); data=await res.json();
    }
    const resolvedPlate = data.plate || plate;

          <div class="result-card-title">${L.searchMonthlyTitle}</div>

          ${renderMonthlyForm(resolvedPlate, resolvedPhone)}

    const todayDate=new Date().toISOString().slice(0,10);
    const expired=data.expiryDate && data.expiryDate < todayDate;
    const washedToday=data.washedToday||false;
    const expiredLabel=lang==='zh'?'\u4F1A\u5458\u5DF2\u5230\u671F\uFF0C\u5728\u4E0B\u65B9\u7EED\u8D39\uFF1A':'Membership expired \u2014 renew below:';
    const renewLabel  =lang==='zh'?'\u7EED\u8D39\u6216\u66F4\u6539\u5957\u9910\uFF1A':'Renew or update membership:';
    const washBtnHtml = expired
      ? `<div class="err-inline" style="margin-top:12px">${L.membershipExpiredErr||'Membership expired.'}</div>`
      : washedToday
        ? `<button class="redeem-btn" style="margin-top:12px;background:var(--bp-green-dark);opacity:.7;cursor:default" disabled>${L.alreadyWashedToday}</button>`
        : `<button class="redeem-btn" style="margin-top:12px;background:linear-gradient(135deg,var(--sinopec-red),var(--sinopec-red-dark))"
             onclick="confirmMonthlyWash('${esc(data.plate||resolvedPlate)}','${esc(data.phone||resolvedPhone)}',this)"
           >${L.confirmMonthlyWashBtn}</button>`;
    box.innerHTML=`
      <div class="result-card">
        <div class="result-card-title">${L.searchMonthlyTitle}</div>
        <div class="result-row"><span class="result-key">${L.rfPlate}</span><span class="result-val">${esc(data.plate||'')}</span></div>
        <div class="result-row"><span class="result-key">${L.rfPhone}</span><span class="result-val">${esc(data.phone||'\u2014')}</span></div>
        <div class="result-row"><span class="result-key">${L.rfTier}</span><span class="result-val blue">${esc(data.monthlyTier||'Monthly')}</span></div>
        <div class="result-row"><span class="result-key">${L.rfExpiry}</span>
          <span class="result-val ${expired?'red':'green'}">${data.expiryDate||'\u2014'}${expired?' \u26A0\uFE0F':''}</span></div>
        <div class="result-row"><span class="result-key">${L.rfTotalWashes}</span><span class="result-val">${data.confirmedWashes||0}</span></div>
        ${washBtnHtml}
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${expired?expiredLabel:renewLabel}</div>
          ${renderMonthlyForm(data.plate||resolvedPlate, data.phone||resolvedPhone)}
        </div>
      </div>`;
  }catch(e){ box.innerHTML=`<div class="err-inline">${L.toastErr}</div>`; }
}

async function confirmMonthlyWash(plate, phone, btn){
  const L=t();
  if(!confirm(L.confirmMonthlyWashConfirm(plate))) return;
  const name=await promptStaffName(); if(!name) return;
  btn.disabled=true; btn.textContent='\u2026';
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({
      action:'staffConfirmMonthlyWash', plate, phone, station,
      staffName:name, token:API_TOKEN, date:todayStr()
    })});
    const data=await res.json();
    if(data.success){
      showToast(L.confirmMonthlyWashSuccess,'success');
      await searchPlate();
    } else if(data.error==='already_washed'){
      btn.disabled=false;
      btn.textContent=L.alreadyWashedToday;
      btn.style.background='var(--bp-green-dark)';
      btn.style.opacity='.7';
      btn.style.cursor='default';
      showToast(L.alreadyWashedToday,'success');
    } else {
      btn.disabled=false; btn.textContent=L.confirmMonthlyWashBtn;
      showToast(data.error||L.confirmMonthlyWashErr,'error');
    }
  }catch(e){
    btn.disabled=false; btn.textContent=L.confirmMonthlyWashBtn;
    showToast(L.confirmMonthlyWashErr,'error');
  }
}

      </div>
      <input type="hidden" id="mf-tier" value="">
      <div id="mf-err" style="display:none;font-size:12px;color:var(--sinopec-red);font-weight:600;padding:6px 10px;background:var(--danger-light);border-radius:7px"></div>
      <button class="redeem-btn" style="background:linear-gradient(135deg,var(--liberty-blue),var(--liberty-blue-dark))"
        onclick="staffAddMonthly(this)">${L.addMonthlyBtn}</button>
    </div>`;
}

function selectMonthlyTier(which, btn){
  document.getElementById('mf-tier').value = which==='standard' ? '$49 Standard' : '$69 Premium';
  ['mf-tier-std','mf-tier-prm'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.style.borderColor = 'var(--border)';
      el.style.background  = '#fff';
      el.style.color       = 'var(--label)';
    }
  });
  btn.style.borderColor = 'var(--liberty-blue)';
  btn.style.background  = 'var(--blue-light)';
  btn.style.color       = 'var(--liberty-blue)';
  const errEl = document.getElementById('mf-err');
  if(errEl) errEl.style.display='none';
}

async function staffAddMonthly(btn){
  const L=t();
  const plateEl = document.getElementById('mf-plate');
  const phoneEl = document.getElementById('mf-phone');
  const tierEl  = document.getElementById('mf-tier');
  const errEl   = document.getElementById('mf-err');
  const plate   = (plateEl?.value||'').trim().toUpperCase();
  const phone   = normalizePhone(phoneEl?.value||'');
  const tier    = tierEl?.value||'';
  const showErr = (msg) => { if(errEl){ errEl.textContent=msg; errEl.style.display='block'; } };
  if(!plate){ showErr(L.errMonthlyPlate); return; }
  if(!phone||!/^04\d{8}$/.test(phone)){ showErr(L.errMonthlyPhone); return; }
  if(!tier){ showErr(L.errMonthlyTier); return; }
  if(!confirm(L.addMonthlyConfirm(plate))) return;
  const name=await promptStaffName();
  if(!name) return;
  btn.disabled=true; btn.textContent='\u2026';
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({
      action:'staffAddMonthly', plate, phone, tier, station,
      staffName:name, token:API_TOKEN, date:todayStr()
    })});
    const data=await res.json();
    if(data.success){
      showToast(L.addMonthlySuccess,'success');
      document.getElementById('monthly-search-input').value=plate;
      await searchPlate();
    } else {
      btn.disabled=false; btn.textContent=L.addMonthlyBtn;
      showErr(data.error||L.addMonthlyErr);
    }
  }catch(e){
    btn.disabled=false; btn.textContent=L.addMonthlyBtn;
    showErr(L.addMonthlyErr);
  }
}

function getStaffName(){
  const name = localStorage.getItem('ap_staff_name') || '';
  const ts   = parseInt(localStorage.getItem('ap_staff_name_ts') || '0');
  return (name && ts && (Date.now()-ts) < 4*60*60*1000) ? name : '';
}

function updateChip(){
  const name   = getStaffName();
  const chip   = document.getElementById('staff-chip');
  const avatar = document.getElementById('staff-chip-avatar');
  const label  = document.getElementById('staff-chip-name');
  if(name){
    chip.style.display='flex';
    avatar.textContent = name.charAt(0).toUpperCase();
    label.textContent  = name;
    chip.title = t().clearName||'Tap to change name';
  } else {
    chip.style.display='none';
  }
}

function clearCachedName(){
  if(!confirm(lang==='zh'?'\u66F4\u6539\u59D3\u540D\uFF1F':'Change your name?')) return;
  localStorage.removeItem('ap_staff_name');
  localStorage.removeItem('ap_staff_name_ts');
  updateChip();
}

let _nameResolve = null;

function promptStaffName(){
  const cached = getStaffName();
  if(cached) return Promise.resolve(cached);
  return new Promise(resolve=>{
    _nameResolve=resolve;
    const L=t();
    const modal=document.getElementById('name-modal');
    const input=document.getElementById('modal-name-input');
    document.getElementById('modal-title').textContent  = L.modalTitle  || 'Your Name';
    document.getElementById('modal-sub').textContent    = L.modalSub    || 'Enter your name for the record';
    document.getElementById('modal-cancel').textContent = L.modalCancel || 'Cancel';
    document.getElementById('modal-confirm').textContent= L.modalConfirm|| 'Confirm \u2192';
    document.getElementById('modal-err').style.display='none';
    input.value='';
    modal.style.display='flex';
    setTimeout(()=>input.focus(),80);
  });
}

function resolveNameModal(){
  const input=document.getElementById('modal-name-input');
  const val=input.value.trim();
  const L=t();
  if(!val){
    const err=document.getElementById('modal-err');
    err.textContent=L.modalErr||'Please enter your name.';
    err.style.display='block';
    return;
  }
  localStorage.setItem('ap_staff_name', val);
  localStorage.setItem('ap_staff_name_ts', String(Date.now()));
  document.getElementById('name-modal').style.display='none';
  updateChip();
  if(_nameResolve){ _nameResolve(val); _nameResolve=null; }
}

function cancelNameModal(){
  document.getElementById('name-modal').style.display='none';
  if(_nameResolve){ _nameResolve(null); _nameResolve=null; }
}

function showToast(msg, type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast'+(type?' '+type:'');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function esc(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizePhone(raw){
  const s=String(raw||'').replace(/\s/g,'').trim();
  if(!s) return '';
  if(/^4\d{8}$/.test(s)) return '0'+s;
  return s;
}

document.querySelectorAll('.lang-btn').forEach(b=>{
  b.classList.toggle('active',(lang==='en'&&b.textContent==='EN')||(lang==='zh'&&b.textContent==='\u4E2D\u6587'));
});
applyLang();
if(station){ showScreen('portal'); loadPending(); }
else showScreen('station');
